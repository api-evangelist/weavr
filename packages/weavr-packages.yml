notes: >-
  Weavr's client libraries are the "Secure Components" SDKs — client-side UI
  component libraries that tokenize sensitive data (passwords, card PANs/PINs)
  so the embedder never handles it. Versions confirmed from the official
  changelog (docs.weavr.io/changelog/rss.xml). Server-side integration is via
  the REST API (openapi/), not a published server SDK.
