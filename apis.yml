- aid: weavr:weavr-managed-accounts-api
  name: Weavr Managed Accounts API
  description: >-
    Managed Accounts are a type of financial instrument offered by Weavr. They hold funds for their owner,
    and can be upgraded to IBANs so as to receive and send funds to instruments outside of the Weavr Platform,
    via Wire Transfers.

    These accounts can also be used as sources and destinations in the `transfer` transaction.


    With the `access_token` representing the identity and the consent of the identity, you will be able
    to operations on the identity's managed accounts, such as getting a managed account's details and
    retrieving its statement.
  humanURL: https://api.weavr.io/products/multi/openapi
