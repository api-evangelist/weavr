- aid: weavr:weavr-payment-runs-api
  name: Weavr Payment runs API
  description: "A Payment run contains a list of supplier payments. A Payment run can be \n- created by\
    \ a user with a `CREATOR` role \n- confirmed by a user with a `CONTROLLER` role\n- funded by a user\
    \ with a `CONTROLLER` role\n\nNote that the Controller user must have their mobile device enrolled\
    \ to SCA. \n\nBefore a payment run can be executed, it must be funded. Users with the `CONTROLLER`\
    \ role must link their company's bank account(s) that are represented as Linked Accounts, which than\
    \ can be used as the funding source for a payment run.\n\nDepending on the bank's constraints it may\
    \ not be possible to deposit the total amount of funds required for a payment run, in which case the\
    \ payment run will be automatically split into funding groups. All funding groups must be funded and\
    \ executed for the payment run to be marked as completed. \n\nNote that even if the payment is created\
    \ successfully, you still need to check its status in order to determine if it is `completed` or`failed`."
  humanURL: https://api.weavr.io/products/multi/openapi
  baseURL: https://api.weavr.io/multi
  tags:
  - Payment Runs
  tags_raw:
  - Payment runs
  properties:
  - type: OpenAPI
    url: openapi/weavr-payment-runs-api-openapi.yml
