aid: weavr
name: Weavr
description: >-
  Weavr is an embedded-finance ("banking-as-a-service") platform that lets
  software companies embed regulated financial products — managed accounts,
  IBANs, virtual and physical cards, transfers, sends and wire payments —
  directly inside their applications. Its Multi API issues accounts and cards to
  corporate and consumer end-users with full KYB/KYC onboarding, Strong Customer
  Authentication (SCA) step-up challenges, and client-side "Secure Components"
  that tokenize sensitive data so the embedder stays out of PCI scope. Weavr
  operates through regulated EMI partners (Paynetics AD in the EU, Paynetics UK
  in the UK) and exposes a Multi API, a BackOffice programme-operations API, an
  Embedded Payment Run API, a Webhooks event surface and a sandbox Simulator
  API, backed by SDKs for Web, iOS, Android and React Native and an official
  agent-skills pack.
