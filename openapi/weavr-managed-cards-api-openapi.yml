    SensitiveCvv:
      type: object
      description: 'The CVV of the card.


        Unless you are PCI-DSS compliant and have opted to switch off Weavr''s security model, the card''s CVV will be tokenised.


        To show the card''s CVV to your user, you need to embed the CVV UI Component in your application. This accepts the tokenised CVV and shows the plain text CVV number to the user on screen.


        In addition, it is returned only when the current session is stepped-up.

        '
      properties:
        value:
          maxLength: 3
          type: string
    ProfileLevelSpendRules:
      allOf:
      - $ref: '#/components/schemas/CommonLevelSpendRules'
      - type: object
        properties:
          authForwardingEnabled:
            type: boolean
            description: Indicates if auth forwarding is enabled on profile level
    BlockedReason:
      type: string
      description: "The reason why the instrument has been blocked:\n  - USER: The root, or an authorised user, of the identity owning the instrument has temporarily blocked the instrument.\n  - SYSTEM: The platform or an administrator of the platform has temporarily blocked the instrument.\n  - LOST: The instrument has been blocked because it was marked as lost.\n  - SINGLE_SPEND: The instrument has been automatically blocked after its first successful transaction (single-spend card).\n"
      enum:
      - USER
      - SYSTEM
      - LOST
      - SINGLE_SPEND
    ManagedCardReplacement:
      description: Indicates if the card is replaced by another card.
      type: object
      required:
      - id
      - reason
      properties:
        id:
          description: The id of the replacement card
          pattern: ^[0-9]+$
          type: string
        reason:
          description: "The reason why the card was replaced.\n  - DAMAGED: The physical card was damaged and cannot be used at a physical terminal.\n  - LOST_STOLEN: The physical card was either lost or stolen and cannot be used.\n  - EXPIRED: The card expired.\n  - COMPROMISED: The virtual card was compromised; the virtual card details have been exposed or accessed without authorization.\n"
          type: string
          enum:
          - DAMAGED
          - LOST_STOLEN
          - EXPIRED
          - COMPROMISED
    TransactionId:
