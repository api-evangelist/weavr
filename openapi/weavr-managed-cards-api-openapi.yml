webhooks:
  /managed_cards/state_change/watch:
    post:
      tags:
      - Managed Cards
      summary: Card state change
      description: 'Notification that a card has changed state. The following events trigger a notification:

        - Activate a physical card.

        - Remove a managed card.

        - Report a physical card as lost.

        - Report a physical card as stolen.

        - Mark a virtual card as compromised.

        - Card has expired.

        - Block a managed card.

        - Unblock a managed card.

        - Update card renewal type.


        Please note that since a card can have multiple blocks, an unblock event (for which a notification is sent) may not always result in the card state being updated to Active.

        '
      operationId: managed_cards_state_change_watch
      parameters:
      - $ref: '#/components/parameters/call-ref'
      - $ref: '#/components/parameters/published-timestamp'
      - $ref: '#/components/parameters/signature'
      - $ref: '#/components/parameters/signature-v2'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagedCardsStateChangeEvent'
        required: true
      responses:
        '204':
          description: Success - No Content
    servers:
    - url: '""'
  /managed_cards/authorisations/watch:
    post:
      tags:
      - Managed Cards
      summary: Card authorisation
      description: 'Notification that a card authorisation attempt has been performed

        on a managed card. This is sent irrespective of the authorisation outcome

        - the `approved` field indicates whether the authorisation has been approved or denied.

        '
