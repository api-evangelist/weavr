      - cardPayment
      description: 'Notification of a CardPayment lifecycle change. The CardPayment payload

        is identical in shape to the response of GET /multi/card_payments/{id},

        carrying the current aggregate state plus the full discriminated events

        timeline. The triggering event sits at the end of `cardPayment.events[]`.

        '
      properties:
        eventType:
          $ref: '#/components/schemas/CardPaymentEventType'
          description: The type of the triggering event (authorisation, settlement, refund, original credit). Combine with the trailing `cardPayment.events[]` entry's `reversal` flag to distinguish reversals.
        cardPayment:
          $ref: '#/components/schemas/CardPayment'
  parameters:
    accept:
      name: accept
      in: header
      description: 'A request parameter specifying the type of response the client would like. Must be one of `application/json`, `application/pdf` or `text/csv`.


        The default response type (`application/json`) will be returned if specified incorrectly or not specified.

        '
      required: false
      schema:
        type: string
    singleEntryPerTransaction:
      name: singleEntryPerTransaction
      in: query
      required: false
      description: 'Returns transactions that span multiple movements as a single entry.

        Only includes transactions that have been completed.

        Defaults to true for PDF statements, false otherwise.

        Note: due to the fact that only completed transactions are included, some

        transactions that are in progress and have modified the balance of the instrument

        will not be shown, which could lead to seemingly inconsistent balance being displayed.

        '
      schema:
        type: boolean
    statementTransactionType:
      name: transactionType
      in: query
      required: false
      description: Filter by the transaction type. Leave out to fetch all entries.
      schema:
        type: array
        uniqueItems: true
        items:
          $ref: '#/components/schemas/StatementTransactionType'
    toTimestamp:
      name: toTimestamp
      in: query
      required: false
