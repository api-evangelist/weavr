        contain no spaces.
      maxLength: 25
    UserId:
      type: string
      pattern: ^[0-9]+$
    UpdateCardLevelSpendRules:
      allOf:
        - $ref: '#/components/schemas/CardLevelSpendRules'
        - type: object
          properties:
            updateSpendLimitMethod:
              $ref: '#/components/schemas/SpendLimitUpdateMethod'
    ProfileId:
      type: string
      description: >
        The profile Id which a specific identity, instrument or transaction type
        is linked to.


        Profiles contain configuration and determine behavioral aspects of the
        newly created transaction, for example, fees that may apply.


        You can have one or more profiles linked to your application, and these
        can be used to drive different behaviors according to your product's
        needs.


        Profile Ids can be found in the Multi Portal, in the API Credentials
        page.
      pattern: ^[0-9]+$
    InstrumentId:
      required:
        - id
        - type
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        type:
          $ref: '#/components/schemas/InstrumentType'
    CurrencyAmount:
      required:
        - currency
        - amount
      type: object
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        amount:
          type: integer
          format: int64
          description: >
            The monetary amount, scaled to the lowest denomination of the
            currency.


            Example, an amount of 1000 for a EUR currency is actually 1000 Euro
            cents or EUR 10.00.
      description: The object representing a monetary amount in a particular currency.
    ScheduledTimestamp:
      pattern: ^[0-9]+$
      type: string
      description: >-
        The epoch timestamp at which the transaction is scheduled to be
        executed.
    SendCreateRequest:
      required:
        - profileId
        - source
        - destination
        - destinationAmount
      type: object
      properties:
        profileId:
          $ref: '#/components/schemas/ProfileId'
        tag:
          $ref: '#/components/schemas/Tag'
        source:
          $ref: '#/components/schemas/InstrumentId'
        destination:
          oneOf:
            - $ref: '#/components/schemas/InstrumentId'
            - $ref: '#/components/schemas/BeneficiaryId'
        destinationAmount:
          $ref: '#/components/schemas/CurrencyAmount'
        description:
          type: string
          maxLength: 255
          pattern: ^[a-zA-Z0-9\/\-?:().$_,'+\s#=!"%&*<>;\{@\r\n]*$
          description: The description details that are passed to the beneficiary.
        scheduledTimestamp:
          $ref: '#/components/schemas/ScheduledTimestamp'
    OutgoingWireTransferCreateRequest:
      required:
        - destinationBeneficiary
        - profileId
        - sourceInstrument
        - transferAmount
      type: object
      properties:
        profileId:
          $ref: '#/components/schemas/ProfileId'
        tag:
          $ref: '#/components/schemas/Tag'
        sourceInstrument:
          description: The managed account from which funds will be collected.
          required:
            - type
            - id
          type: object
          properties:
            type:
              type: string
              enum:
                - managed_accounts
            id:
              type: string
              pattern: ^[0-9]+$
        transferAmount:
          description: >-
            The amount, in same currency as source and destination, that was
            transferred from the source.
          $ref: '#/components/schemas/CurrencyAmount'
        purpose:
          type: string
          maxLength: 255
          description: >-
            The purpose of the payment. Mandatory for wire transfers executed
            over `SWIFT`.
        description:
          type: string
          description: >
            These details are passed to the beneficiary as the `reference` .
            This field is mandatory for wire transfers executed over `SEPA`and
            `SWIFT`. The allowed length is dependent on the payment type:


            `SEPA` <= `35` characters. An extended character set is accepted to
            cater for all European languages. If `SEPA` does not support a
            particular character, it is automatically converted to an acceptable
            alternative, in line with `SEPA` scheme guidance.


            `SWIFT` <= `35` characters


            `Faster Payments` <= `18` characters
        destinationBeneficiary:
          oneOf:
            - $ref: '#/components/schemas/OutgoingWireTransferBeneficiary'
            - $ref: '#/components/schemas/SEPABeneficiary'
            - $ref: '#/components/schemas/SWIFTBeneficiary'
            - $ref: '#/components/schemas/RIXBeneficiary'
            - $ref: '#/components/schemas/FasterPaymentsBeneficiary'
            - $ref: '#/components/schemas/BeneficiaryId'
            - $ref: '#/components/schemas/ExternalAccountId'
        scheduledTimestamp:
          $ref: '#/components/schemas/ScheduledTimestamp'
    LinkedAccount:
      required:
        - id
        - profileId
        - name
        - country
        - state
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the linked account.
          pattern: ^[0-9]+$
        profileId:
          $ref: '#/components/schemas/ProfileId'
        tag:
          $ref: '#/components/schemas/Tag'
        friendlyName:
          minLength: 1
          maxLength: 50
          type: string
          description: >-
            A user-friendly label assigned to the Linked Account to help
            end-users easily identify it within the application. This name can
            be updated at any time using the `PATCH` endpoint
        name:
          minLength: 1
          maxLength: 100
          type: string
          description: >
            The full name or corporate name of the account holder as registered
            with the external bank or payment service provider. This is the name
            under which the account is officially held.
        type:
          $ref: '#/components/schemas/AccountType'
        currency:
          $ref: '#/components/schemas/Currency'
        country:
          description: The country of the bank or institution at which the account is held.
          type: string
          maxLength: 2
          minLength: 2
          pattern: ^[A-Z]+$
        accountReference:
          description: >-
            The IBAN or Account Number and Sort Code of the account held at the
            external bank or payment service provider.
          oneOf:
            - $ref: '#/components/schemas/AccountNumberAndSortCode'
            - $ref: '#/components/schemas/Iban'
            - $ref: '#/components/schemas/AccountDescriptor'
        state:
          $ref: '#/components/schemas/LinkedAccountState'
        creationTimestamp:
          description: >-
            The timestamp when the linked account was created, expressed in
            Epoch timestamp using millisecond precision.
          type: integer
          format: int64
        owner:
          $ref: '#/components/schemas/StringWrappedTypeId'
    UnknownSenderAccount:
      type: object
      properties:
        name:
          type: string
        accountReference:
          oneOf:
            - $ref: '#/components/schemas/Iban'
            - $ref: '#/components/schemas/AccountNumberAndSortCode'
            - $ref: '#/components/schemas/AccountDescriptor'
    ManagedAccount:
