    SpendLimitInterval:
      description: >
        The time period for which the `spendLimit` is valid.
         - DAILY: starting from 00:00:00 UTC of current day to 23:59:59 UTC of current day
         - WEEKLY: 00:00:00 UTC Monday of current week to following Sunday 23:59:59 UTC
         - MONTHLY: 1st of current calendar month to end of current calendar month
         - QUARTERLY: starting from beginning of current quarter where quarters are defined as follows:
          - 1 January 00:00:00 UTC to 31 March 23:59:59 UTC
          - 1 April 00:00:00 UTC to 30 Jun 23:59:59 UTC
          - 1 July 00:00:00 UTC to 30 September 23:59:59 UTC
          - 1 October 00:00:00 UTC to 31 December 23:59:59 UTC

        - YEARLY: 1 January 00:00:00 UTC of current calendar year to 31 December
        23:59:59 UTC of current calendar year.

        - ALWAYS: This indicates that the `spendLimit` is the total amount that
        can be spent through the card throughout the whole lifetime of the card.
      type: string
      enum:
        - DAILY
        - WEEKLY
        - MONTHLY
        - QUARTERLY
        - YEARLY
        - ALWAYS
    UKConfirmationOfPayeeResult:
      type: object
      required:
        - match
      properties:
        match:
          type: string
          description: >-
            The result of matching performed by the UK Confirmation of Payee
            responder
          enum:
            - EXACT_MATCH
            - CLOSE_MATCH
            - NO_MATCH
            - NOT_POSSIBLE
        reasonCode:
          type: string
          description: >
            The reason why the matching failed at the UK Confirmation of Payee
            responder:

              - ANNM: The CoP responder confirms that the account `name` provided does not match;
              - MBAM: The CoP responder indicates that the account `name` provided closely matches the actual account in its records, the actual account name is returned in the `accountName` field;
              - BANM: The account `type` that the user specified is 'PERSONAL', but the CoP responder indicates that the actual account matching the `name` provided is actually BUSINESS;
              - PANM: The account `type` that the user specified is 'BUSINESS', but the CoP responder indicates that the actual account matching the `name` provided is actually PERSONAL;
              - BAMM: The account `type` that the user specified is 'PERSONAL', but the CoP responder indicates that an account closely matching the `name` provided is BUSINESS;
              - PAMM: The account `type` that the user specified is 'BUSINESS', but the CoP responder indicates that an account closely matching the `name` provided is PERSONAL;
              - AC01: The account does not exist in the CoP responders books, the `accountNumber` specified is likely incorrect; 
              - IVCR: The CoP responder was unable to locate an account based on the `secondaryReference` field;
              - ACNS: The account is not supported for CoP by the CoP responder;
              - OPTO: The owner of the account has opted out of CoP service by the CoP responder;
              - CASS: The account has been switched using the Current Account Switch Service;
              - SCNS: The `sortCode` provided is not supported at endpoint;
          enum:
            - ANNM
            - MBAM
            - BANM
            - PANM
            - BAMM
            - PAMM
            - AC01
            - IVCR
            - ACNS
            - OPTO
            - CASS
            - SCNS
        accountName:
          type: string
          description: >
            CoP: Returned when the `match` is a `CLOSE_MATCH` and the
            `reasonCode` is MBAM, BAMM or PAMM

            VoP: Returned when the `match` is a `CLOSE_MATCH`
    SEPAVerificationOfPayeeResult:
      type: object
      required:
        - match
      properties:
        match:
          type: string
          description: >-
            The result of the SEPA Verification of Payee check performed by the
            responding PSP.
          enum:
            - MATCH
            - NO_MATCH
            - CLOSE_MATCH
            - NOT_POSSIBLE
        accountName:
          type: string
          description: >
            The name of the account holder as registered with the responding
            PSP.

            Returned when the match result is CLOSE_MATCH to help the payer
            verify the payee.
    RolloverPolicy:
      type: object
      description: >-
        The rollover policy will dictate how Weavr handles any eventual
        overspending. This is possible if a merchant clears more funds than
        authorised, or when a merchant clears funds without authorising,
        resulting in the `availableToSpend` value to go into negative. Rollover
        is relative to a `spendLimit.interval`
      required:
        - rolloverNegative
      properties:
        rolloverNegative:
          type: boolean
          description: >-
            If set to true any overspend will keep rolling over and get deducted
            in the upcoming intervals until the `availableToSpend` is back to a
            positive value. Any overspend will be deducted from the
            `availableToSpend` at the beginning of the next interval.
    StatementCardPaymentTransaction:
      description: Reference to a card payment as it appears in a statement entry.
      allOf:
        - $ref: '#/components/schemas/StatementResponseEntryTransaction'
        - type: object
          properties:
            subtype:
              $ref: '#/components/schemas/StatementCardPaymentSubtype'
    StatementTransferTransaction:
