          $ref: '#/components/schemas/LinkedAccountProfileId'
        tag:
          $ref: '#/components/schemas/Tag'
        name:
          description: >
            The full name or corporate name of the account holder as registered
            with the external bank or payment service provider. This is the name
            under which the account is officially held.
          type: string
          minLength: 1
          maxLength: 100
        type:
          $ref: '#/components/schemas/AccountType'
        accountReference:
          description: >-
            The IBAN, or Account Number and Sort Code, or Account Descriptor of
            the account held at the external bank or payment service provider.
          oneOf:
            - $ref: '#/components/schemas/Iban'
            - $ref: '#/components/schemas/AccountNumberAndSortCode'
            - $ref: '#/components/schemas/AccountDescriptor'
        country:
          description: The country of the bank or institution at which the account is held.
          type: string
          maxLength: 2
          minLength: 2
          pattern: ^[A-Z]+$
        friendlyName:
          description: >-
            A user-friendly label assigned to the Linked Account to help
            end-users easily identify it within the application. This name can
            be updated at any time using the `PATCH` endpoint.
          type: string
          maxLength: 50
        currency:
          oneOf:
            - $ref: '#/components/schemas/Currency'
    AccountLowBalanceThreshold:
      type: integer
      format: int64
      description: >-
        Sends a low balance notification webhook when the available balance
        drops below this amount. Currency is inherited from the managed account.
    ManagedCardRequest:
      required:
        - profileId
        - friendlyName
        - nameOnCard
        - billingAddress
        - mode
      type: object
      properties:
        profileId:
          $ref: '#/components/schemas/ProfileId'
        tag:
          $ref: '#/components/schemas/Tag'
        friendlyName:
          maxLength: 50
          minLength: 1
          type: string
          description: The friendly name for the card.
        nameOnCard:
          maxLength: 27
          minLength: 1
          pattern: >-
            ^[a-zA-Z0-9ßÀÁÂÃÄÅǍÆÇÈÉÊËÌÍÎÏÒÓÔÕÖØŠÙÚÛÜŸÝĄĆČĎĘĹĽŁŃŇÑŐŔŚȘȚŤŰŹŻŽàáâãäåǎæçèéêëìíîïòóôõöøšùúûüÿýąćčďęĺľłńňñőŕśșțťűźżž\-^.
            '-]*$
          type: string
          description: >
            The card holder's name for the card.


            This may be verified by merchants when the card is used online. For
            Physical cards, this field will be printed on the card.

            The maximum characters allowed will depend on the design chosen and
            will be provided to you by Weavr when setting up your plastic cards.
        nameOnCardLine2:
          maxLength: 27
          pattern: >-
            ^[a-zA-Z0-9ßÀÁÂÃÄÅǍÆÇÈÉÊËÌÍÎÏÒÓÔÕÖØŠÙÚÛÜŸÝĄĆČĎĘĹĽŁŃŇÑŐŔŚȘȚŤŰŹŻŽàáâãäåǎæçèéêëìíîïòóôõöøšùúûüÿýąćčďęĺľłńňñőŕśșțťűźżž\-^.
            '-]*$
          type: string
          description: >-
            Line 2 of the 'name on card' field. For Physical cards, this field
            will be printed on the card. The maximum characters allowed will
            depend on the design chosen and will be provided to you by Weavr
            when setting up your plastic cards.
        cardholderMobileNumber:
          description: >
            The mobile number including country code of the card holder.


            For transactions that require a 3DS challenge, an SMS with a code
            will be sent on this number, to be entered during an online
            purchase.
          maxLength: 15
          minLength: 5
          pattern: ^\+[0-9]+$
          type: string
          deprecated: true
        billingAddress:
          description: >-
            The billing address set for the card holder. This may be verified by
            merchants when the card is used online.
          $ref: '#/components/schemas/BillingAddress'
        digitalWallets:
          description: The Card Tokenisation details
          $ref: '#/components/schemas/DigitalWallets'
        authForwardingDefaultTimeoutDecision:
          type: string
          description: Default decision for auth forwarding on timeout
          enum:
            - APPROVE
            - DECLINE
        threeDSecureAuthConfig:
          description: 3DS details for card creation
          $ref: '#/components/schemas/ThreeDSecureAuthConfig'
        mode:
          type: string
          description: >
            The card can be created in prepaid mode or debit mode.


            - A prepaid mode card has its own balance and can have funds
            transferred to or from it.

            - A debit mode card does not have its own balance but will be able
            to spend funds belonging to its parent managed account, subject to a
            configurable spend limit.
        externalData:
          $ref: '#/components/schemas/ExternalData'
        renewalType:
          $ref: '#/components/schemas/CardRenewalType'
        userId:
          $ref: '#/components/schemas/UserId'
          description: >-
            The Authorised User to be linked to the card, whose authentication
            details will be used for actions such as 3DS authentication, or
            manual provisioning to a digital wallet. This field can be used
            instead of threeDSecureAuthConfig as it better describes the wider
            scope of possible uses.
      discriminator:
        propertyName: mode
        mapping:
          PREPAID_MODE: '#/components/schemas/PrepaidModeCardRequest'
          DEBIT_MODE: '#/components/schemas/DebitModeCardRequest'
    BillingAddress:
      required:
        - addressLine1
        - city
        - postCode
        - country
      type: object
      properties:
        addressLine1:
          minLength: 1
          maxLength: 150
          type: string
          description: The first line of the address.
        addressLine2:
          maxLength: 150
          type: string
          description: The second line of the address.
        city:
          maxLength: 50
          type: string
          description: The city of the address.
        postCode:
          maxLength: 10
          pattern: ^[A-Za-z0-9 -]*$
          type: string
          description: The post code associated with the address.
        state:
          maxLength: 50
          type: string
          description: The state of the address.
        country:
          maxLength: 2
          minLength: 2
          pattern: ^[A-Z]+$
          type: string
          description: The country of the address expressed in ISO 3166 alpha-2 format.
    ExternalData:
      description: >-
        External data fields, as provided and managed by the caller that are to
        be stored and associated with a Managed Card instance. This information
        is not processed or used by Weavr but some of the values could be shown
        in specific reports and used as filters
      type: array
      items:
        type: object
        properties:
          name:
            type: string
            minLength: 1
            maxLength: 100
          value:
            type: string
            minLength: 1
            maxLength: 100
      uniqueItems: true
      maxItems: 10
    DeliveryAddress:
      required:
        - name
        - surname
        - addressLine1
        - city
        - postCode
        - country
      type: object
      description: The delivery address where the physical card is delivered.
      properties:
        name:
          maxLength: 100
          type: string
        surname:
          maxLength: 100
          type: string
        addressLine1:
          maxLength: 50
          minLength: 1
          type: string
        addressLine2:
          maxLength: 50
          minLength: 1
          type: string
        city:
          maxLength: 50
          type: string
        postCode:
          maxLength: 10
          pattern: ^[A-Za-z0-9 -]*$
          type: string
        state:
          maxLength: 50
          type: string
        country:
          maxLength: 2
          minLength: 2
          pattern: ^[A-Z]+$
          type: string
          description: Country of the identity in ISO 3166 alpha-2 format.
        contactNumber:
          $ref: '#/components/schemas/PhoneNumber'
          description: >-
            Mandatory when bulk delivery is selected. Will be printed on the
            box/packet to assist delivery.
    DeliveryMethod:
      type: string
      description: >
        The delivery methods supported for delivering printed physical cards. If
        not specified, the STANDARD_DELIVERY method will be used.
      enum:
        - STANDARD_DELIVERY
        - REGISTERED_MAIL
        - COURIER
        - FIRST_CLASS_MAIL
    DigitalWallets:
      type: object
      properties:
        pushProvisioningEnabled:
          type: boolean
          description: >-
            Indicates whether the card is enabled for push provisioning in a
            digital wallet.
        walletsEnabled:
          type: boolean
          description: >-
            Indicates whether the card is enabled for tokenisation in a digital
            wallet.
        artworkReference:
          type: string
          description: >-
            The artwork reference that will be used if the card is enabled for
            tokenisation in a digital wallet.
    ThreeDSecureAuthConfig:
      deprecated: true
      type: object
      required:
        - linkedUserId
        - primaryChannel
      properties:
        linkedUserId:
          type: string
          description: >-
            The Authorised user whose authentication / billing details will be
            reflected on the card for verification purposes such as 3ds.
          pattern: ^[0-9]+$
          deprecated: true
        primaryChannel:
          type: string
          description: Primary Authentication Method
          enum:
            - OTP_SMS
            - BIOMETRICS
            - TWILIO_AUTHY
        fallbackChannel:
          type: string
          description: Fallback Authentication Method
          enum:
            - OTP_SMS
    BulkCardDelivery:
      type: boolean
      description: >
        Bulk delivery is available for deliveryMethods REGISTERED_MAIL or
        COURIER.

        All cards marked as bulk and ordered within the fulfilment centre’s
        dispatch window will be sent in bulk. Delivery address must be identical
        for all orders. contactNumber in the deliveryAddress object is mandatory
        when bulk is selected. Maximum number of cards delivered in a single
        box/packet is REGISTERED_MAIL = 90, COURIER = 200.
    PhysicalCardActivationCode:
      pattern: ^[0-9]{1,6}$
      type: string
    CardRenewalType:
      description: |
        Indicates how the card will be handled once it is close to expiring.
          - RENEW: The card will be automatically renewed, keeping the same card number but with a new expiry date and CVV.
          - NO_RENEW: Once the expiry date is reached, the card is destroyed.
      enum:
        - RENEW
        - NO_RENEW
      type: string
    CardLevelSpendRules:
      allOf:
        - $ref: '#/components/schemas/BaseCardLevelSpendRules'
        - type: object
          properties:
            minTransactionAmount:
              type: integer
              minimum: 0
              format: int64
              description: >-
                The minimum transaction amount, in card currency, that is
                allowed. If the transaction amount is less than this value, then
                the transaction will be declined.
            maxTransactionAmount:
              type: integer
              minimum: 0
              format: int64
              description: >-
                The maximum transaction amount, in card currency, that is
                allowed. If the transaction amount is greater than this value,
                then the transaction will be declined.
    SensitivePin:
      type: object
      description: >
        The PIN used for in-person transactions done with physical cards.


        Unless you are PCI-DSS compliant and have opted to switch off Weavr's
        security model, the card's PIN will be tokenised.


        To show the PIN to your user, you need to embed the Display Card PIN UI
        Component in your application. This accepts the tokenised PIN and shows
        the plain text PIN to the user on screen.
      required:
        - value
      properties:
        value:
          minLength: 4
          maxLength: 24
          type: string
    TransactionBulkCancelRequest:
      required:
        - cancellations
      type: object
      properties:
        cancellations:
          type: array
          description: Contains the details of the transactions to be cancelled.
          items:
            $ref: '#/components/schemas/TransactionCancelRequest'
    TransactionSingleCancelRequest:
      type: object
      properties:
        cancellationReason:
          $ref: '#/components/schemas/TransactionCancellationReason'
    CorrespondentBankingOwtCreateRequest:
      required:
        - profileId
        - sourceInstrument
        - amount
        - originator
        - beneficiary
        - purpose
      type: object
      properties:
        profileId:
          $ref: '#/components/schemas/ProfileId'
        tag:
          $ref: '#/components/schemas/Tag'
        sourceInstrument:
          description: The managed account from which funds will be collected.
          required:
            - type
            - id
          type: object
          properties:
            type:
              type: string
              enum:
                - managed_accounts
            id:
              type: string
              pattern: ^[0-9]+$
        amount:
          description: The amount to transfer.
          $ref: '#/components/schemas/CurrencyAmount'
        originator:
          oneOf:
            - $ref: '#/components/schemas/CorrespondentBankingIndividualOriginator'
            - $ref: '#/components/schemas/CorrespondentBankingBusinessOriginator'
        beneficiary:
          oneOf:
            - $ref: '#/components/schemas/CorrespondentBankingSEPABeneficiary'
            - $ref: '#/components/schemas/CorrespondentBankingRIXBeneficiary'
            - $ref: >-
                #/components/schemas/CorrespondentBankingFasterPaymentsBeneficiary
        purpose:
          type: string
          maxLength: 255
          description: The purpose of the payment.
        description:
          maxLength: 35
          type: string
          description: >
            These details are passed to the beneficiary as the `reference`. This
            field is mandatory for wire transfers executed over `SEPA`. The
            allowed length is dependent on the payment type:


            `SEPA` <= `35` characters. An extended character set is accepted to
            cater for all European languages. If `SEPA` does not support a
            particular character, it is automatically converted to an acceptable
            alternative, in line with `SEPA` scheme guidance.


            `Faster Payments` <= `18` characters
        externalData:
          type: array
          description: Additional external data as key-value pairs.
          items:
            $ref: '#/components/schemas/CorrespondentBankingExternalData'
        scheduledTimestamp:
          $ref: '#/components/schemas/ScheduledTimestamp'
    BasicBeneficiary:
      required:
        - trustLevel
        - beneficiaryInformation
        - beneficiaryDetails
      type: object
      properties:
        trustLevel:
          description: The value that determines whether a Beneficiary is trusted or not.
          $ref: '#/components/schemas/BeneficiaryTrustLevel'
        externalRefs:
          description: The id of the entity as it is represented on the caller system.
          type: array
          items:
            type: string
        group:
          description: >-
            A custom field that can be used to categorise a beneficiary for
            easier searching and filtering.
          type: string
          maxLength: 150
        beneficiaryInformation:
          description: The object representing the beneficiary details.
          oneOf:
            - $ref: '#/components/schemas/BusinessBeneficiaryType'
            - $ref: '#/components/schemas/ConsumerBeneficiaryType'
        beneficiaryDetails:
          description: The object representing the beneficiary instrument details.
          oneOf:
            - $ref: '#/components/schemas/InstrumentDetailsBeneficiary'
            - $ref: '#/components/schemas/BankAccountDetailsBeneficiary'
    TokenType:
      type: string
      description: >
        The auth token received can only be used to access the following
        endpoints:
          - `/identities`
          - `/access_token`
      enum:
        - NO_TYPE
        - AUTH
        - ACCESS
    CredentialId:
      required:
        - type
        - id
      type: object
      properties:
        type:
          maxLength: 50
          pattern: ^[a-zA-Z0-9_-]+$
          type: string
          enum:
            - ROOT
            - USER
            - API_CLIENT
          description: The type of user.
        id:
          type: string
          pattern: ^[0-9]+$
          description: The identifier of the user.
    SyntaxError:
      type: object
      description: >-
        Is returned as part of an HTTP error response whenever a syntax error is
        detected. A list of the fields together with their syntax error will be
        provided.
      properties:
        invalidFields:
          type: array
          items:
            type: object
            properties:
              params:
                type: array
                items:
                  type: string
              fieldName:
                type: string
              error:
                type: string
                enum:
                  - REQUIRED
                  - HAS_TEXT
                  - REQUIRES
                  - SIZE
                  - RANGE
                  - IN
                  - NOT_IN
                  - REGEX
                  - EXACTLY
                  - AT_LEAST
                  - AT_MOST
                  - ALL_OR_NONE
    TokenError:
      description: The used token is expired or not found
      type: object
      properties:
        errorCode:
          type: string
          enum:
            - TOKEN_EXPIRED
            - TOKEN_NOT_FOUND
    PasswordInfo:
      required:
        - identityId
      type: object
      description: Additional information related to the user's password.
      properties:
        identityId:
          description: The identity to which the user's password information belongs to.
          $ref: '#/components/schemas/IdentityId'
        expiryDate:
          minimum: 0
          type: integer
          format: int64
          description: >-
            The millisecond timestamp indicating when the password will expire.
            If 0, then this password will not expire.
    TokenResponse:
      type: object
      properties:
        token:
          type: string
          description: >-
            An authorisation token to be used in the Authorization header for
            secured operations.
    SCAFactor:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/SCAChallengeType'
        status:
          $ref: '#/components/schemas/SCAFactorStatus'
        channel:
          $ref: '#/components/schemas/SCAChannel'
    User:
      required:
        - id
        - email
        - name
        - surname
        - identity
        - active
      type: object
      properties:
        id:
          type: string
          pattern: ^[0-9]+$
          description: The unique identifier of the user.
        identity:
          description: The identity that the user belongs to.
          $ref: '#/components/schemas/IdentityId'
        name:
          maxLength: 100
          type: string
          description: The first name of the user.
        surname:
          maxLength: 100
          type: string
          description: The last name of the user.
        email:
          $ref: '#/components/schemas/Email'
        mobile:
          $ref: '#/components/schemas/Mobile'
        active:
          type: boolean
          description: >-
            The state of the user. If the `active` attribute is false, then the
            user will not be able to log in.
        dateOfBirth:
          description: Date of birth of the authorised user.
          $ref: '#/components/schemas/Date'
        tag:
          $ref: '#/components/schemas/Tag'
        countryOfResidence:
          type: string
          maxLength: 2
          minLength: 2
          pattern: ^[A-Z]+$
        locale:
          $ref: '#/components/schemas/UserLocale'
        brand:
          $ref: '#/components/schemas/Brand'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/UserPredefinedRole'
    BulkProcessConflict:
      properties:
        errorCode:
          $ref: '#/components/schemas/BulkProcessConflictErrorCode'
      type: object
    BulkProcessDetails:
      allOf:
        - $ref: '#/components/schemas/BulkProcess'
        - type: object
          properties:
            operationStatusCounts:
              type: array
              items:
                $ref: '#/components/schemas/BulkProcessOperationStatusCounts'
    BulkProcessOperationsPaged:
      properties:
        count:
          description: Total number of records (excluding limit)
          format: int32
          type: integer
        operations:
          items:
            $ref: '#/components/schemas/BulkProcessOperation'
          type: array
        responseCount:
          description: Total number of records returned in this response
          format: int32
          type: integer
      type: object
    UserIdentitiesGetResponseSchema:
      required:
        - identities
        - count
        - responseCount
      type: object
      properties:
        identities:
          type: array
          description: The list of identities available to user.
          items:
            $ref: '#/components/schemas/UserIdentity'
        count:
          type: integer
          description: The total number of records (excluding the paging limit).
          format: int32
        responseCount:
          type: integer
          description: >-
            The total number of records returned in this response (always capped
            at 100).
          format: int32
    CreatedCorporate:
      allOf:
        - $ref: '#/components/schemas/Corporate'
        - type: object
          required:
            - rootUser
          properties:
            rootUser:
              description: The root user of the Corporate Identity.
              $ref: '#/components/schemas/CreatedCorporateRootUser'
    KyiStatus:
      type: string
      enum:
        - NOT_STARTED
        - INITIATED
        - PENDING_REVIEW
        - APPROVED
        - REJECTED
    ChargeFee:
      required:
        - transactionId
        - profileId
        - feeType
        - source
        - destination
        - availableBalanceAdjustment
        - state
        - creationTimestamp
      type: object
      properties:
        transactionId:
          $ref: '#/components/schemas/TransactionId'
          description: The unique identifier of the transaction.
        profileId:
          type: string
          description: >-
            The profile Id which a specific identity, instrument or transaction
            type is linked to.
        feeType:
          type: string
          description: >-
            The fee type as defined in the Multi Portal, and as sent in the
            request.
        source:
          $ref: '#/components/schemas/InstrumentId'
        availableBalanceAdjustment:
          $ref: '#/components/schemas/CurrencyAmount'
          description: The object representing a monetary amount in a particular currency.
        state:
          $ref: '#/components/schemas/TransactionState'
          description: The transaction entry state.
        creationTimestamp:
          type: integer
          format: int64
    FeeTransactionList:
      type: object
      description: A paginated list of fee transactions.
      properties:
        fees:
          type: array
          items:
            $ref: '#/components/schemas/FeeTransaction'
        count:
          type: integer
          format: int64
          description: The total number of records matching the filter criteria.
        responseCount:
          type: integer
          format: int64
    LinkedAccountVerificationRun:
      type: object
      required:
        - state
      properties:
        id:
          type: string
          description: The unique identifier of the linked account verification
        state:
          description: The state of the linked account verification
          $ref: '#/components/schemas/LinkedAccountVerificationRunState'
        completedTimestamp:
          type: integer
          format: int64
          description: >-
            The timestamp when the verification was completed, expressed in
            Epoch timestamp using millisecond precision.
        verificationSteps:
          type: array
          items:
            type: object
            properties:
              step:
                $ref: '#/components/schemas/LinkedAccountVerificationStep'
              details:
                oneOf:
                  - $ref: >-
                      #/components/schemas/LinkedAccountVerificationTransferInstruction
                  - $ref: '#/components/schemas/LinkedAccountMicroDepositVerification'
              status:
                $ref: '#/components/schemas/LinkedAccountVerificationStepStatus'
              completedTimestamp:
                type: integer
                format: int64
                description: >-
                  The timestamp when the card will be renewed, expressed in
                  Epoch timestamp using millisecond precision.
        overriddenReason:
          type: string
          description: >-
            Optional field for users to provide a reason for overriding the
            verification steps
    ManagedAccountIBAN:
      required:
        - state
        - bankAccountDetails
      type: object
      properties:
        state:
          type: string
          description: |
            The state of the Managed Account's IBAN as follows:
              - UNALLOCATED: The Managed Account has never been assigned an IBAN. Use the _managedAccountsIBANUpgrade_ operation to assign an IBAN to a Managed Account.
              - PENDING_ALLOCATION: The IBAN is being allocated to the Managed Account.
              - ALLOCATED: An IBAN is allocated to the Managed Account.
          enum:
            - UNALLOCATED
            - PENDING_ALLOCATION
            - ALLOCATED
        bankAccountDetails:
          description: >-
            A list of bank account details associated with the IBAN.

            Multiple details can be provided if multiple IBAN providers are
            supported by your payment model.
          type: array
          items:
            required:
              - beneficiaryNameAndSurname
              - beneficiaryBank
              - beneficiaryBankAddress
              - type
              - details
            type: object
            properties:
              beneficiaryNameAndSurname:
                type: string
                description: >-
                  The beneficiary name and surname details to be used when
                  initiating a deposit onto the IBAN.
              beneficiaryBank:
                type: string
                description: >-
                  The beneficiary bank name to be used when initiating a deposit
                  onto the IBAN.
              beneficiaryBankAddress:
                type: string
                description: >-
                  The beneficiary bank address to be used when initiating a
                  deposit onto the IBAN.
              paymentReference:
                type: string
                description: >
                  A reference required by the partner bank to execute a deposit
                  on the managed account.



                  If provided, make sure that this is included as part of the
                  wire transfer details when initiating a deposit.
              details:
                description: >
                  The bank details required to initiate a deposit on the managed
                  account.


                  The details required to deposit on the IBAN vary depending on
                  the wire transfer channel that will be used.
                anyOf:
                  - $ref: '#/components/schemas/IBANDetails'
                  - $ref: >-
                      #/components/schemas/FasterPaymentsBankDetailsOrBACSBankDetails
                  - $ref: '#/components/schemas/SwiftBankDetails'
    Statement:
      type: object
      description: The list of statement entries.
      properties:
        entry:
          type: array
          items:
            $ref: '#/components/schemas/StatementEntry'
        count:
          type: integer
          description: The total number of records (excluding the paging limit).
          format: int32
        responseCount:
          type: integer
          description: The total number of records returned in this response.
          format: int32
        startBalance:
          description: >-
            The start balance amount in the instrument's currency. Empty for
            debit cards.
          $ref: '#/components/schemas/CurrencyAmount'
        endBalance:
          description: >-
            The end balance amount in the instrument's currency. Empty for debit
            cards.
          $ref: '#/components/schemas/CurrencyAmount'
        footer:
          description: The footer description for the current statement
          type: string
    StatementEntry:
      required:
        - transactionAmount
        - entryState
        - transactionId
        - processedTimestamp
      type: object
      properties:
        transactionId:
          description: The unique identifier of the transaction.
