          type: string
        id:
          type: string
          pattern: ^[0-9]+$
    ManagedInstrumentBalance:
      type: object
      description: >-
        Instruments with funds have 2 balances, the `availableBalance`
        indicating the funds that are available for transactions such as
        purchases, and the `actualBalance` indicating the funds that are
        actually on the instrument.
      properties:
        availableBalance:
          type: integer
          format: int64
          description: >-
            The funds available for transactions on the instrument. Funds that
            are blocked or pending are not included in the available balance.
        actualBalance:
          type: integer
          format: int64
          description: >-
            The funds that are actually on the instrument. Funds that are
            blocked or pending, due to for example, a purchase authorisation or
            a pending deposit, are included in the actual balance.
