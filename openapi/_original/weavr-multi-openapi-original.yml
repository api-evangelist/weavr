  /transactions:
    get:
      tags:
        - Transaction Activity
      description: >
        Returns all transactional activity across all managed accounts and
        managed cards.


        This provides a single view of all transfers, sends, wire transfers,
        card payments, fees, and other

        transaction types regardless of which wallet they belong to.


        `creationTimestamp` is when the transaction was created in its owning
        service (the same value the

        nested `transaction` object reports), and is the field the
        creation-window filter applies to.

        Transactions that are committed but not yet executed (e.g. scheduled
        wire transfers) appear with

        status `SUBMITTED`; such transactions never appear on statements until
        they execute.


        A transfer between two of the caller's own instruments (e.g. between a
        managed account and a

        managed card belonging to the same identity) returns **two** entries — a
        `DEBIT` on the source

        instrument and a `CREDIT` on the destination instrument — which share
        the same `id` and differ by

        `instrument`. Treat `(id, instrument)` as the key when reconciling, and
        note that such a transfer

        contributes 2 to the `count`. The per-instrument activity endpoints

        (`/managed_accounts/{id}/transactions`,
        `/managed_cards/{id}/transactions`) are scoped to one

        instrument and so still show the single relevant side.
      summary: Get all transaction activity
      operationId: transactionsGet
      x-permissions:
        - i:managed_accounts:statement
        - i:managed_cards:statement
      parameters:
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/transactionActivityType'
        - $ref: '#/components/parameters/transactionActivityStatus'
        - $ref: '#/components/parameters/transactionActivityDirection'
        - $ref: '#/components/parameters/creationTimestampFrom'
        - $ref: '#/components/parameters/creationTimestampTo'
        - $ref: '#/components/parameters/lastUpdatedTimestampFrom'
        - $ref: '#/components/parameters/lastUpdatedTimestampTo'
        - $ref: '#/components/parameters/sortOrder'
        - $ref: '#/components/parameters/transactionActivitySortBy'
      responses:
        '200':
          $ref: '#/components/responses/TransactionActivityListResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Error'
      security:
        - auth_token: []
          api-key: []
  /bulks/users:
    post:
      x-permissions:
        - i:users:create
      tags:
        - Operations
      description: >
        Submit the details for the creation of a batch of Authorised Users 


        The bulkId returned in the response can subsequently be used to launch
        the execution of the bulk process through [Execute Bulk
        Process](#tag/Manage/operation/bulkIdExecute). A submitted bulk process
        can be managed (executed, accessed, paused, resumed and cancelled) by
        any Authorised User of the same identity of the user that submits the
        details.


        The status of the bulk process after execution of this operation is set
        to ‘SUBMITTED’. The execution of the bulk process is launched through
        the Execute bulk process operation.


        The submission of data for a bulk process does not expire but it can be
        cancelled through [Cancel Bulk
        Process](#tag/Manage/operation/bulkIdCancel).


        The system is configured to accept bulk requests to process up to a
        maximum of 10,000 bulk operations


        Each individual operation in this bulk will be processed via [Create a
        User](#tag/Setup/operation/userCreate).
      summary: Create users in bulk
      operationId: bulksUserCreate
      parameters:
        - $ref: '#/components/parameters/idempotency-ref'
      responses:
        '201':
          description: Success - returning bulk process
          content:
            application/json:
              schema:
                type: object
                properties:
                  bulkId:
                    type: string
                  operationCount:
                    type: integer
                  path:
                    type: string
      security:
        - auth_token: []
          api-key: []
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  pathParams:
                    type: object
                    properties: {}
                  requestBody:
                    required:
                      - email
                      - name
                      - surname
                    type: object
                    properties:
                      name:
                        minLength: 1
                        maxLength: 50
                        type: string
                        description: The first name of the user.
                      surname:
                        minLength: 1
                        maxLength: 50
                        type: string
                        description: The last name of the user.
                      email:
                        $ref: '#/components/schemas/Email'
                      mobile:
                        $ref: '#/components/schemas/Mobile'
                      dateOfBirth:
                        description: Date of birth of the authorised user.
                        $ref: '#/components/schemas/Date'
                      tag:
                        $ref: '#/components/schemas/Tag'
                      countryOfResidence:
                        type: string
                        maxLength: 2
                        minLength: 2
                        pattern: ^[A-Z]+$
                      locale:
                        $ref: '#/components/schemas/UserLocale'
                      brand:
                        $ref: '#/components/schemas/Brand'
                      roles:
                        type: array
                        items:
                          $ref: '#/components/schemas/UserPredefinedRole'
                        description: >-
                          Optional roles to assign to the user. For a full
                          description of the permissions associated with each
                          role, see our product documentation.
              maxItems: 10000
              minItems: 1
