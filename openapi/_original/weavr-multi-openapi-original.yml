        application/json:
          schema:
            required:
              - email
            type: object
            properties:
              email:
                $ref: '#/components/schemas/Email'
              identity:
                $ref: '#/components/schemas/IdentityId'
    SCAVerifyRequest:
      required: true
      content:
        application/json:
          schema:
            required:
              - verificationCode
            type: object
            properties:
              verificationCode:
                description: The code received by the user on the device.
                $ref: '#/components/schemas/Nonce'
    PasswordCreateRequest:
      required: true
      content:
        application/json:
          schema:
            required:
              - password
            type: object
            properties:
              password:
                $ref: '#/components/schemas/SensitivePassword'
    PasswordUpdateRequest:
      required: true
      content:
        application/json:
          schema:
            required:
              - oldPassword
              - newPassword
            type: object
            properties:
              oldPassword:
                $ref: '#/components/schemas/SensitivePassword'
              newPassword:
                $ref: '#/components/schemas/SensitivePassword'
    PasswordValidateRequest:
      required: true
      content:
        application/json:
          schema:
            required:
              - password
            type: object
            properties:
              password:
                $ref: '#/components/schemas/SensitivePassword'
    EmailRequest:
      required: true
      content:
        application/json:
          schema:
            required:
              - email
            type: object
            properties:
              email:
                $ref: '#/components/schemas/Email'
    LostPasswordResumeRequest:
      required: true
      content:
        application/json:
          schema:
            required:
              - email
              - nonce
              - newPassword
            type: object
            properties:
              nonce:
                $ref: '#/components/schemas/Nonce'
              email:
                $ref: '#/components/schemas/Email'
              newPassword:
                $ref: '#/components/schemas/SensitivePassword'
    MultipleSCAChallengeRequest:
      required: true
      content:
        application/json:
          schema:
            required:
              - resourceType
              - resourceIds
            type: object
            properties:
              resourceType:
                description: >-
                  The resource type that the subsequent Ids pertain to. Note
                  that the `linked_account_declaration` can only be performed by
                  a logged in Root User.
                $ref: '#/components/schemas/MultipleSCAResourceType'
              resourceIds:
                type: array
                description: >-
                  Can be used with a single or a list of resource Ids. A
                  resource Id is the unique identifier of the resource type that
                  was provided in the response when the resource (such as a
                  transaction) was created.
                items:
                  type: string
                  pattern: ^[0-9]{1,}$
    MultipleSCAVerifyRequest:
      required: true
      content:
        application/json:
          schema:
            required:
              - verificationCode
              - resourceType
            type: object
            properties:
              verificationCode:
                description: The code received by the user on the device.
                $ref: '#/components/schemas/Nonce'
              resourceType:
                description: >-
                  The resource type that the subsequent Ids pertain to. Note
                  that the `linked_account_declaration` can only be performed by
                  a logged in Root User.
                $ref: '#/components/schemas/MultipleSCAResourceType'
    AccessTokenRequest:
      required: true
      content:
        application/json:
          schema:
            required:
              - identity
            type: object
            properties:
              identity:
                $ref: '#/components/schemas/IdentityId'
              clientAssertion:
                description: >-
                  Generated using the certificate linked to the Delegated API
