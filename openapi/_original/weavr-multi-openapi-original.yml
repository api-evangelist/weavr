              description: The unique identifier of a Beneficiary.
            relatedOperationBatches:
              description: >-
                The object representing the list of batch IDs and the operations
                that occurred for each batch.
              type: array
              items:
                $ref: '#/components/schemas/BeneficiaryOperationBatchId'
            state:
              $ref: '#/components/schemas/BeneficiaryState'
            validationFailure:
              $ref: '#/components/schemas/BeneficiaryValidationFailure'
    TransactionActivityList:
      type: object
      description: A paginated list of transaction activity entries.
      properties:
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/TransactionActivityItem'
        count:
          type: integer
          format: int64
          description: The total number of records matching the filter criteria.
        responseCount:
          type: integer
          format: int64
    SCAOtpChannel:
      type: string
      enum:
        - SMS
      description: |
        - "SMS": The one-time-password is sent as a text message
    SCAPushChannel:
      type: string
      enum:
        - AUTHY
        - BIOMETRIC
      description: >
        - "AUTHY": The push notification is sent on the user's device using
        [Twilio Authy](https://www.twilio.com/authy)

        - "BIOMETRIC": The push notification is sent to the user's device
    AuthSCAPushChannel:
      type: string
      enum:
        - AUTHY
      description: >
        - "AUTHY": The push notification is sent on the user's device using
        [Twilio Authy](https://www.twilio.com/authy)
    BulkProcessStatus:
      type: string
      enum:
        - SUBMITTED
        - RUNNING
        - PARTIALLY_COMPLETED
        - COMPLETED
        - FAILED
        - PAUSED
        - CANCELLED
    BulkId:
      type: string
      pattern: ^[0-9]+$
    BulkProcessOperationStatus:
      type: string
      enum:
        - SUBMITTED
        - RUNNING
        - COMPLETED
        - FAILED
        - CANCELLED
    InstrumentState:
      type: string
      description: >
        The state of the instrument indicating what it can and cannot do as
        follows:
          - ACTIVE: The instrument is in an active state and can be used in transactions.
          - BLOCKED: The instrument is temporarily blocked and cannot be used. Any funds on the instrument are also frozen. The `blockedReason` provides more information as to why it was blocked.
          - DESTROYED: The instrument has been permanently destroyed. The `destroyReason` provides more information as to why it was destroyed.
          - NOT_ENABLED: The instrument is not enabled for use, since the linked user has not completed all necessary verification steps.
      enum:
        - ACTIVE
        - BLOCKED
        - DESTROYED
        - NOT_ENABLED
    LinkedAccountVerificationRunState:
      type: string
      enum:
        - PENDING
        - VERIFIED
        - REJECTED
    BlockedReason:
      type: string
      description: |
        The reason why the instrument has been blocked:
          - USER: The root, or an authorised user, of the identity owning the instrument has temporarily blocked the instrument.
          - SYSTEM: The platform or an administrator of the platform has temporarily blocked the instrument.
          - LOST: The instrument has been blocked because it was marked as lost.
          - SINGLE_SPEND: The instrument has been automatically blocked after its first successful transaction (single-spend card).
      enum:
        - USER
        - SYSTEM
        - LOST
        - SINGLE_SPEND
    DestroyedReason:
      type: string
      description: |
        The reason why the instrument has been destroyed:
          - SYSTEM: The platform or an administrator of the platform has destroyed the instrument.
          - USER: The root, or an authorised user, of the identity owning the instrument has destroyed the instrument.
          - LOST: The instrument was automatically destroyed as it was marked as lost.
          - STOLEN: The instrument was automatically destroyed as it was marked as stolen.
          - EXPIRED: The instrument was automatically destroyed as it expired.
          - COMPROMISED: The instrument was automatically destroyed as it was marked as compromised.
          - SINGLE_SPEND: The instrument was automatically destroyed as it was a single-spend card that was used.
      enum:
        - SYSTEM
        - USER
        - LOST
        - STOLEN
        - EXPIRED
        - COMPROMISED
        - SINGLE_SPEND
    StatementTransactionType:
      type: string
      enum:
        - AUTHORISATION
        - SETTLEMENT
        - MANUAL_TRANSACTION
        - TRANSFER
        - SEND
        - DEPOSIT
        - AUTHORISATION_REVERSAL
        - AUTHORISATION_EXPIRY
        - AUTHORISATION_DECLINE
        - AUTHORISATION_MANUAL_CLOSE
        - MERCHANT_REFUND
        - MERCHANT_REFUND_REVERSAL
        - ORIGINAL_CREDIT_TRANSACTION
        - SETTLEMENT_REVERSAL
        - ADJUSTMENT
        - CHARGE_FEE
        - WITHDRAWAL_RESERVE
        - WITHDRAWAL_RELEASE
        - FEE_REVERSAL
        - OUTGOING_WIRE_TRANSFER
        - AUTHORISATION_CANCELLATION
        - SYSTEM_TRANSACTION
        - OUTGOING_DIRECT_DEBIT_COLLECTION
        - OUTGOING_DIRECT_DEBIT_REFUND
        - CORRESPONDENT_BANK_TRANSFER
    InstrumentStatementSortOrder:
      type: string
      enum:
        - ASC
        - DESC
    StatementResponseEntryTransactionType:
      type: string
      description: The top-level type of transaction represented by this statement entry.
      enum:
        - card_payments
        - transfers
        - sends
        - outgoing_wire_transfers
        - incoming_wire_transfers
        - correspondent_bank_transfers
        - fees
        - system_transactions
    AccessInstrumentType:
      type: string
      description: The type of access instrument that initiated a transaction.
      enum:
        - managed_cards
        - ibans
    TransactionActivityType:
      type: string
      description: |
        The type of transaction:
          - transfers: Internal transfer between instruments of the same identity
          - sends: Transfer between instruments of different identities
          - outgoing_wire_transfers: Wire transfer to an external bank account
          - correspondent_bank_transfers: Wire transfer on behalf of a third-party originator
          - incoming_wire_transfers: Wire transfer received from an external bank account
          - card_payments: Card payment (purchase, refund, OCT, etc.) with full lifecycle
          - fees: Fee charged or reversed on an instrument
          - system_transactions: System-generated transactions (balance adjustments, account closures, dispute outcomes, etc.)
      enum:
        - transfers
        - sends
        - outgoing_wire_transfers
        - correspondent_bank_transfers
        - incoming_wire_transfers
        - card_payments
        - fees
        - system_transactions
    TransactionActivityStatus:
      type: string
      description: |
        Normalised lifecycle status of a transaction:
          - DRAFT: Transaction ID has been created. There are additional user-actions required before the transaction is considered an “executable instruction” that is fully submitted. No balance movements have taken place on the target instrument yet.
          - SUBMITTED: Transaction has been submitted and is awaiting processing. No balance movements have taken place yet. Transactions scheduled for processing on a future date remain in a submitted status.
          - PROCESSING: The submitted transaction is being processed.
          - COMPLETED: Executed and processed. Funds have moved, actual balance changed.
          - CANCELLED: Transaction was cancelled before completion. Funds have been returned to the original instrument. 
          - RETURNED: The transaction was previously COMPLETED but has been returned. Funds have been returned to the original instrument. Note that card refunds may be separate transactions, not RETURNED purchases.
      enum:
        - DRAFT
        - SUBMITTED
        - PROCESSING
        - COMPLETED
        - CANCELLED
        - RETURNED
    TransactionActivityDirection:
      type: string
      description: Whether funds were credited to or debited from the instrument.
      enum:
        - CREDIT
        - DEBIT
    TransactionActivitySortBy:
      type: string
      description: |
        The field to sort transaction activity results by:
          - creationTimestamp: Sort by when the transaction was first created (default).
          - lastUpdatedTimestamp: Sort by when the transaction was most recently updated.
      enum:
        - creationTimestamp
        - lastUpdatedTimestamp
    CardPaymentStatus:
      type: string
      description: >
        Lifecycle status of a CardPayment.


        - `SETTLEMENT_IN_PROGRESS` — authorised, not yet (or not fully) settled.
        The hold is still on the card.

        - `SETTLED` — fully settled. The customer has been charged.

        - `DECLINED` — the latest authorisation was declined; no money moved.

        - `CANCELLED` — the authorisation was cancelled/reversed before
        settlement; no charge applied.

        - `EXPIRED` — the authorisation timed out without settling.
      enum:
        - SETTLEMENT_IN_PROGRESS
        - SETTLED
        - DECLINED
        - CANCELLED
        - EXPIRED
    CardPaymentType:
      type: string
      description: |
        High-level type of card payment, derived from the first event.

        - `PURCHASE` — standard purchase at a merchant.
        - `REFUND` — refund from a merchant to the cardholder.
        - `ORIGINAL_CREDIT` — push credit to the cardholder (OCT).
        - `ACCOUNT_FUNDING` — load funds onto an account.
        - `CASH_WITHDRAWAL` — cash withdrawn at ATM or scheme cash service.
        - `BALANCE_INQUIRY` — non-financial balance check.
      enum:
        - PURCHASE
        - REFUND
        - ORIGINAL_CREDIT
        - ACCOUNT_FUNDING
        - CASH_WITHDRAWAL
        - BALANCE_INQUIRY
    CardPaymentSubtype:
      type: string
      description: >-
        Scheme-network subtype that further classifies an event.
        Reversal-vs-original lives on the separate `reversal` field on each
        event.
      enum:
        - sale_purchases
        - cash_withdrawals
        - sales_with_cashback
        - mail_or_telephone_orders
        - account_funding
        - purchase_reversals
        - cash_withdrawal_reversals
        - purchase_refunds
        - purchase_refund_reversals
        - original_credit_transactions
        - original_credit_transaction_reversals
    CardPaymentEventType:
      type: string
      description: >-
        Type of event recorded against a CardPayment. The `reversal` flag on
        each event distinguishes a reversal from the original action.
      enum:
        - AUTHORISATION
        - SETTLEMENT
        - REFUND
        - ORIGINAL_CREDIT
    TransactionState:
      type: string
      description: Status of the transaction.
      enum:
        - INITIALISED
        - COMPLETED
        - REJECTED
        - FAILED
        - PENDING
        - SCHEDULED
        - CANCELLED
    InstrumentType:
      type: string
      enum:
        - managed_cards
        - managed_accounts
    SendState:
      type: string
      description: |
        The state of the send transaction, as follows:
         - INVALID: The send transaction has failed initial validation checks. 
         - INITIALISED: The initial state of a send transaction when SCA is not required.
         - PENDING_CHALLENGE: The send transaction requires the completion of a transaction confirmation challenge before it can be submitted.
         - PENDING: The send transaction has exceeded the destination limit and is pending treasury approval.
         - APPROVED: The send transaction that was submitted has been approved.
         - COMPLETED: The requested funds have been sent from the source instrument.
         - REJECTED: The send transaction that was submitted was rejected.
         - FAILED: There was an issue with the send transaction, and the transaction has failed.
         - RETURNED: The send transaction has been returned to the sender.
         - SCHEDULED: The send transaction will be executed at the scheduled time.
         - CANCELLED: The scheduled send transaction has been cancelled.
      enum:
        - INVALID
        - INITIALISED
        - COMPLETED
        - REJECTED
        - FAILED
        - PENDING
        - PENDING_CHALLENGE
        - APPROVED
        - RETURNED
        - SCHEDULED
        - CANCELLED
    IncomingWireTransferMultiState:
      type: string
      description: |
        The state of an incoming wire transfer:
          - PENDING: The transfer has been received and is being processed. Funds have not yet been credited to the destination account.
          - COMPLETED: Funds have been credited to the destination account.
          - REJECTED: The transfer was not accepted; funds were not credited.
      enum:
        - PENDING
        - COMPLETED
        - REJECTED
    OutgoingWireTransferState:
      description: |
        The state of the Outgoing wire transfer transaction, as follows:
          - INVALID: The wire transfer has failed initial validation checks.
          - PENDING_CHALLENGE: The wire transfer requires the completion of a transaction confirmation challenge before it can be submitted.
          - SUBMITTED: The wire transfer has been submitted to the sending financial institution for processing.
          - REJECTED: The wire transfer that was submitted was rejected.
          - APPROVED: The wire transfer that was submitted has been approved and is being processed by the sending financial institution.
          - FAILED: There was an issue with the wire transfer, and the transaction has failed.
          - COMPLETED: The requested funds have been sent from the source instrument.
          - RETURNED: The wire transfer has been returned to the sender.
          - SCHEDULED: The wire transfer will be executed at the scheduled time.
          - CANCELLED: The scheduled wire transfer has been cancelled.
          - PENDING_CONFIRMATION: The wire transfer requires a manual confirmation by the user before proceeding.
      type: string
      enum:
        - INVALID
        - PENDING_CHALLENGE
        - SUBMITTED
        - REJECTED
        - APPROVED
        - FAILED
        - COMPLETED
        - RETURNED
        - SCHEDULED
        - CANCELLED
        - PENDING_CONFIRMATION
    BulkProcess:
      type: object
      properties:
        bulkId:
          description: The bulk id of the bulk process
          type: string
        status:
          description: >
            "SUBMITTED": the data for the bulk process operations has been
            persisted and bulk process is ready for execution. A bulk process in
            this status can be executed or submitted. This is the initial state
            for a bulk process


            "RUNNING" :  the bulk process is currently being executed by the
            system


            "COMPLETED"  : the execution of the bulk process is complete and all
            bulk operations of the bulk process were executed successfully. This
            is a final state for the bulk process 


            "PARTIALLY_COMPLETED"  the execution of the bulk process is complete
            and some of the bulk operations of the bulk process failed. This is
            a final state for the bulk process


            "FAILED" : none of the operations of the bulk process have executed.
            This is a final state for the bulk process


            "PAUSED"  : the execution of bulk process has been paused through
            the Pause bulk process operation  Execution can be resumed through
            Resume bulk operation


            "CANCELLED" : the execution of bulk process has been cancelled
            through Cancel bulk operation. This is a final state for the bulk
            process
          type: string
        submittedItemsCount:
          description: The number of bulk operations in the bulk process
          type: integer
        executionStart:
          description: Timestamp of when the execution of the Bulk Process started
          type: integer
          format: int64
        executionFinish:
          description: Timestamp of when the execution of the Bulk Process finished.
          type: integer
          format: int64
        operation:
          description: >-
            The underlying operations contained within the Bulk; shown as the
            endpoint for the equivalent single operation.
          type: string
        mode:
          description: The mode that was instructed when execution was started
          $ref: '#/components/schemas/BulkProcessMode'
    SpendLimitUpdateMethod:
      type: string
      description: |
        The spend limit update method to apply. Currently supported:
          - OVERWRITE: (default option if nothing selected). Overwrites the previous values for the spendLimit object i.e. sets new limits
          - INCREMENT : This will increase the existing value of the spend limit by the amount input the value field. If used in conjunction with an ALWAYS interval, this can be used to increment a spend limit on a periodic basis (controlled by you, e.g. monthly), and means that any 'unused' balance from the previous period will still available to spend. See examples in our documentation
      enum:
        - OVERWRITE
        - INCREMENT
    BeneficiaryId:
      required:
        - beneficiaryId
      type: object
      properties:
        beneficiaryId:
          $ref: '#/components/schemas/Id'
    OutgoingWireTransferBeneficiary:
      deprecated: true
      required:
        - name
        - bankAccountDetails
      type: object
      description: >
        Details of the beneficiary of the outgoing wire transfer.

        **Deprecated**: Use `SEPABeneficiary` for SEPA/IBAN transfers or
        `FasterPaymentsBeneficiary` for Faster Payments transfers instead.
      properties:
        name:
          type: string
          description: >
            The beneficiary's full name. The allowed length and pattern is
            dependent on the bank account details type:


            `IBANDetails`: >= `1` character and <= `150` characters. An extended
            character set is accepted to cater for all European languages. If
            `SEPA` does not support a particular character, it is automatically
            converted to an acceptable alternative, in line with `SEPA` scheme
            guidance.


            `FasterPaymentsBankDetailsOrBACSBankDetails`: >= `1` character and
            <= `140` characters with a pattern of
            `^[a-zA-Z0-9\/\-?:().,’+\s#=!"%&*<>;\{@\r\n]*$`

            (please note that the `’` symbol is the unicode value U+2019 (right
            single quotation mark) and not the unicode value U+0027
            (apostrophe))
        type:
          type: string
          description: >-
            The type of beneficiary account. Required only when
            `FasterPaymentsBankDetailsOrBACSBankDetails` are specified
          enum:
            - PERSONAL
            - BUSINESS
        address:
          maxLength: 150
          minLength: 1
          type: string
          description: >
            The beneficiary’s address. For `SEPA`, an extended character set is
            accepted to cater for all European languages. If `SEPA` does not
            support a particular character, it is automatically converted to an
            acceptable alternative, in line with `SEPA` scheme guidance.
        bankName:
          type: string
          description: The beneficiary's bank name.
        bankAddress:
          maxLength: 150
          minLength: 1
          type: string
          description: The beneficiary's bank address.
        bankCountry:
          type: string
          description: The beneficiary's bank country in ISO 3166 alpha-2 format.
          maxLength: 2
          minLength: 2
          pattern: ^[A-Z]{2}$
        bankAccountDetails:
          description: >-
            Details of the beneficiary bank account, depending on the type of
            transfer chosen.
          oneOf:
            - $ref: '#/components/schemas/IBANDetails'
            - $ref: '#/components/schemas/FasterPaymentsBankDetailsOrBACSBankDetails'
        nationality:
          $ref: '#/components/schemas/Nationality'
        dateOfBirth:
          $ref: '#/components/schemas/DateOfBirth'
    SEPABeneficiary:
      required:
        - name
        - iban
      type: object
      description: Beneficiary details for SEPA/IBAN wire transfers.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
          description: >
            The beneficiary's full name. >= 1 character and <= 150 characters.

