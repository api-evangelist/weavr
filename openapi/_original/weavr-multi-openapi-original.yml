                      properties:
                        type:
                          type: string
                          enum:
                            - linked_accounts
                            - unknown_sender_accounts
                        instrument:
                          oneOf:
                            - $ref: '#/components/schemas/LinkedAccount'
                            - $ref: '#/components/schemas/UnknownSenderAccount'
                        reference:
                          type: string
                          description: >-
                            This is an external reference (if available), input
                            by the sender when creating the payment, and
                            intended for the recipient.
                destination:
                  type: object
                  required:
                    - instrument
                    - owner
                  properties:
                    instrument:
                      type: object
                      required:
                        - type
                        - instrument
                      properties:
                        type:
                          type: string
                          enum:
                            - managed_accounts
                        instrument:
                          oneOf:
                            - $ref: '#/components/schemas/ManagedAccount'
                    owner:
                      type: object
                      required:
                        - type
                        - owner
                      properties:
                        type:
                          type: string
                          enum:
                            - consumers
                            - corporates
                        owner:
                          oneOf:
                            - $ref: '#/components/schemas/Corporate'
                            - $ref: '#/components/schemas/Consumer'
                amount:
                  $ref: '#/components/schemas/CurrencyAmount'
                timestamp:
                  type: integer
                  description: >-
                    The timestamp of the transaction, using epoch timestamp with
                    millisecond precision.
                  format: int64
      responses:
        '200':
          description: Authorisation event received with `APPROVED` or `DECLINED` decision.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    enum:
                      - APPROVED
                      - DENIED
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
      security:
        - webhooks_key: []
  /managed_cards/authorisation_request:
    post:
      tags:
        - Spend Controls
      summary: Approve or reject card payments
      description: >
        Receive purchase authorisation events and choose if to approve or
        decline them by replying to the event.


        Switch on Authorisation Forwarding in your Sandbox Innovator Portal and
        configure the Authorisation Forwarding URL to start receiving these
        events. Weavr will send webhook events on the following URL
        {Authorisation Forwarding URL}/managed_cards_authorisation_forwarding.


        A response is expected in 1.5s, after which the Default Timeout Response
        configured in the card profile or the card
        `authForwardingDefaultTimeoutDecision` parameter will be used.
      operationId: managed_cards_authorisation_forwarding
      parameters:
        - $ref: '#/components/parameters/call-ref'
        - $ref: '#/components/parameters/published-timestamp'
        - $ref: '#/components/parameters/signature'
        - $ref: '#/components/parameters/signature-v2'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardAuthorisationEvent'
        required: true
      responses:
        '200':
          description: Authorisation event received with `APPROVED` or `DECLINED` decision.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    enum:
                      - APPROVED
                      - DENIED
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
      security:
        - webhooks_key: []
