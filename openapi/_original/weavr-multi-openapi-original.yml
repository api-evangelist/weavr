              - ipAddress
              - baseCurrency
            type: object
            properties:
              profileId:
                $ref: '#/components/schemas/ProfileId'
              tag:
                $ref: '#/components/schemas/Tag'
              rootUser:
                required:
                  - name
                  - surname
                  - email
                  - mobile
                  - companyPosition
                type: object
                description: >
                  The root user needs to be a director or a legal representative
                  of the corporate that is being onboarded - this user cannot be
                  deactivated.


                  Root users need to verify their email address and mobile
                  number, as well as complete KYC as part of the Corporate's due
                  diligence process.
                properties:
                  name:
                    maxLength: 50
                    type: string
                    description: The first name of the root user.
                  surname:
                    maxLength: 50
                    type: string
                    description: The last name of the root user.
                  email:
                    $ref: '#/components/schemas/Email'
                  mobile:
                    $ref: '#/components/schemas/Mobile'
                  companyPosition:
                    $ref: '#/components/schemas/CompanyPosition'
                  dateOfBirth:
                    description: Date of birth of the root user.
                    $ref: '#/components/schemas/Date'
                  tag:
                    $ref: '#/components/schemas/Tag'
                  locale:
