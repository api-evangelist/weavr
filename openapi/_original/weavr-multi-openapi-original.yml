  schemas:
    UserPredefinedRole:
      type: string
      enum:
        - CARD_ASSIGNEE
        - CARDS_MANAGEMENT_ROLE
        - FUNDS_MANAGEMENT_ROLE
        - ACCESS_MANAGEMENT_ROLE
        - ADMIN
    BulkProcessesPaged:
      properties:
        count:
          description: Total number of records (excluding limit)
          format: int32
          type: integer
        bulkProcesses:
          items:
            $ref: '#/components/schemas/BulkProcess'
          type: array
        responseCount:
          description: Total number of records returned in this response
          format: int32
          type: integer
      type: object
    Email:
      type: string
      description: E-mail Address of the user
      format: email
    VerificationCode:
      type: string
      description: >-
        A randomly generated one-time use code used to verify the user's email
        address or mobile number.
      pattern: ^[0-9]{6}$
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
    ManufacturingState:
      type: string
      description: |
        Information on the manufacturing of the physical card, as follows:
          - REQUESTED: The upgrade of the card to physical has been requested.
          - SENT_FOR_FULFILLMENT - The card has been sent for printing.
          - DISPATCHED: The card has been manufactured and dispatched. You may receive a second DISPATCHED event when the manufacturer provides a tracking code.
          - DELIVERED: The card has been received and activated by the recipient.
      enum:
        - REQUESTED
        - SENT_FOR_FULFILLMENT
        - DISPATCHED
        - DELIVERED
    SourceInstrumentType:
      type: string
      enum:
        - managed_accounts
    Id:
      type: string
      pattern: ^[0-9]+$
    OutgoingWireTransferUpdateBeneficiaryNameRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
          description: >-
            The new beneficiary name. Mutually exclusive with
            acceptVerifiedName. For FasterPayments/BACS: max 140 chars matching
            pattern ^[a-zA-Z0-9\/\-?:().,'+\s#=!"%&*<>;\{@\r\n]*$. For IBAN: max
            150 chars.
        acceptVerifiedName:
          type: boolean
          description: >-
            Set to true to accept the account name returned with a CLOSE_MATCH
            or EXACT_MATCH VoP/CoP result. Mutually exclusive with name.
    CorrespondentBankingOwtState:
      description: |
        The state of the correspondent bank transfer transaction, as follows:
          - INVALID: The transfer has failed initial validation checks.
          - PENDING_CHALLENGE: The transfer requires the completion of a transaction confirmation challenge before it can be submitted.
          - SUBMITTED: The transfer has been submitted to the sending financial institution for processing.
          - REJECTED: The transfer that was submitted was rejected.
          - APPROVED: The transfer that was submitted has been approved and is being processed by the sending financial institution.
          - FAILED: There was an issue with the transfer, and the transaction has failed.
          - COMPLETED: The requested funds have been sent from the source instrument.
          - RETURNED: The transfer has been returned to the sender.
          - SCHEDULED: The transfer will be executed at the scheduled time.
          - CANCELLED: The scheduled transfer has been cancelled.
          - PENDING_CONFIRMATION: The transfer requires a manual confirmation by the user before proceeding.
      type: string
      enum:
        - INVALID
        - PENDING_CHALLENGE
        - SUBMITTED
        - REJECTED
        - APPROVED
        - FAILED
        - COMPLETED
        - RETURNED
        - SCHEDULED
        - CANCELLED
        - PENDING_CONFIRMATION
    BeneficiaryBatchState:
      type: string
      enum:
        - INITIALISED
        - FAILED
        - PENDING_CHALLENGE
        - CHALLENGE_FAILED
        - CHALLENGE_COMPLETED
        - COMPLETED
    BeneficiaryBatchOperation:
      type: string
      enum:
        - CREATE
        - REMOVE
    RbacRole:
      type: object
      properties:
        id:
          type: string
          pattern: ^[0-9]+$
        name:
          type: string
        description:
          type: string
    Mobile:
      required:
