openapi: 3.1.0
info:
  version: v3
  title: Weavr Multi Product API
  x-logo:
    url: https://storage.googleapis.com/weavr-cdn/weavr_logo-new.png
    backgroundColor: '#FFFFFF'
    altText: Weavr
  description: >
    Weavr Multi API provides a simple and flexible way to issue cards and
    accounts to your customers.


    By integrating Weavr Multi API in your application you can embed banking
    capabilities within your app and provide a seamless experience for your
    customers.


    # Authentication


    Each request to the Multi API must include an `api-key` that represents your
    account. You can obtain an API Key by registering for a Multi account
    [here](https://portal.weavr.io).


    Almost all endpoints require a secondary authentication token `auth_token`
    that represents the user for whom the request is being executed.
  contact:
    name: Weavr
    url: https://weavr.io
servers:
  - description: Weavr Sandbox Environment
    url: https://sandbox.weavr.io/multi
tags:
  - name: Corporates
    description: >-
      Corporates are identities representing companies. Once on-boarded,
      Corporates can create and manage their own instruments via your
      application.
  - name: Consumers
    description: >-
      Consumers are identities representing individuals. Once on-boarded,
      Consumers can create and manage their own instruments via your
      application.
  - name: Setup
    description: >
      Register and manage the lifecycle of users that can access an identity,
      including authorised users invited by a Corporate or Consumer root user.
  - name: Sign-in
    description: Sign users in using passwords, biometrics, or third-party auth providers.
  - name: Step-up Challenges
    description: Issue and verify step-up challenges that elevate an existing user token.
  - name: Confirmation Challenges
    description: >-
      Issue and verify confirmation challenges used to authorise lists of
      resources.
  - name: Authentication Factors
    description: >
      Manage user authentication factors, including passwords and device-based
      factors (OTP and push).
  - name: Access Tokens
    description: Acquire and revoke access tokens.
  - name: Customer Data & Due Diligence
    description: >-
      Manage customer profile data and KYC/KYB due diligence flows for
      corporates and consumers.
  - name: Authorised Signatories
    description: >-
      Verify the email of root users who act as authorised signatories of a
      Corporate or Consumer identity.
  - name: Trusted Payees
    description: >
      Manage a list of trusted payees for Outgoing wire transfers and Sends.


      Aside from convenience and a reduced chance of making errors when making
      transactions,

      this allows for the introduction an SCA exemption, where the account
      holder can request

      that transactions to `TRUSTED` payees to be exempted from the requirement
      to pass

      an SCA challenge every time.
  - name: Managed Accounts
    description: >
      Managed Accounts are a type of financial instrument offered by Weavr.


      They hold funds for their owner, and can be upgraded to IBANs so as to
      receive and send funds to instruments outside of the Weavr Platform, via
      Wire Transfers.


      Managed accounts can also be used as source and destination instruments in
      the `transfer` and `send` transactions.
  - name: Managed Cards
    description: >
      Managed Cards are a type of financial instrument offered by Weavr.


      You can create virtual or physical cards that are issued to the consumer
      or corporate identity.


      A card created in prepaid mode has its own balance, whereas a card created
      in debit mode does not have its own balance but taps into the balance of
      its parent managed account.
  - name: Transfers
    description: >
      The Transfer transaction is used to transfer funds between managed
      accounts and managed cards belonging to same identity.
  - name: Transaction Activity
    description: Retrieve the consolidated transaction activity across instruments.
  - name: Incoming Wire Transfers
    description: >
      Incoming wire transfers received from external bank accounts to managed
      accounts with IBANs.
  - name: Outgoing Wire Transfers
    description: >
      The Outgoing Wire Transfer transaction is used to transfer funds from
      managed accounts to an external bank account.
  - name: Correspondent Bank Transfers
    description: >
      Correspondent bank transfers allow financial institutions to initiate wire
      transfers on behalf of originators (third parties).

      These transfers comply with travel rule requirements by capturing and
      transmitting originator information.
  - name: Card Payments
    description: >-
      Retrieve card payment activity, including authorisations, settlements, and
      related events.
  - name: Spend Controls
    description: >-
      Manage spend rules and authorisation forwarding to approve or reject card
      payments in real time.
  - name: Sends
    description: >
      The Send transaction is used to send funds between managed accounts and
      managed cards belonging to different identities.
  - name: Fees
    description: Charge and retrieve in-platform fees.
  - name: Manage
    description: >
      Manage bulk processes that group together multiple operations to be
      executed asynchronously.
x-tagGroups:
  - name: Customer Registration
    tags:
      - Corporates
      - Consumers
  - name: Users & User Authentication
    tags:
      - Setup
      - Sign-in
      - Step-up Challenges
      - Confirmation Challenges
      - Authentication Factors
  - name: Access
    tags:
      - Access Tokens
  - name: Customer Settings
    tags:
      - Customer Data & Due Diligence
      - Authorised Signatories
      - Trusted Payees
  - name: Instruments
    tags:
      - Managed Accounts
      - Managed Cards
  - name: Funds Management
    tags:
      - Transfers
      - Transaction Activity
  - name: External Payments
    tags:
      - Incoming Wire Transfers
      - Outgoing Wire Transfers
      - Correspondent Bank Transfers
  - name: Card Payments
    tags:
      - Card Payments
      - Spend Controls
  - name: In-Platform Payments
    tags:
      - Sends
      - Fees
  - name: Bulk Operations
    tags:
      - Operations
      - Manage
components:
  securitySchemes:
    api-key:
      type: apiKey
      description: >-
        An API key defined in your User API Client  (or Delegate API Client -
        this feature is available only to customers enabled with delegation
        functionality).  API Clients are as managed in the Embedder Portal
      name: api-key
      in: header
    auth_token:
      type: http
      description: >-
        The authentication token representing the user. This will be included in
        the login response object.
      scheme: bearer
      bearerFormat: JWT
    webhooks_key:
      type: apiKey
      description: >-
        The Webhooks key can be found in the API Credentials tab in your Portal
        Page.
      name: webhooks-key
      in: header
  parameters:
    idempotency-ref:
      name: idempotency-ref
      in: header
      description: >-
        A unique call reference generated by the caller that, taking into
        consideration the payload as well as the operation itself, helps avoid
        duplicate operations. Idempotency reference uniqueness is maintained for
        at least 24 hours.
      required: false
      schema:
        type: string
    channel:
      name: channel
      in: path
      required: true
      description: The unique identifier for the channel.
      schema:
        $ref: '#/components/schemas/SCAOtpChannel'
    scaPushChannel:
      name: channel
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SCAPushChannel'
    userId:
      name: user_id
      in: path
      required: true
      description: The unique identifier for the user.
      schema:
        $ref: '#/components/schemas/UserId'
    authFactorsPushChannel:
      name: channel
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/AuthSCAPushChannel'
    offset:
      name: offset
      in: query
      required: false
      description: >-
        The offset value for paging, indicating the initial item number to be
        returned from the data set satisfying the given criteria. Leave out to
        fetch the first page of results.
      schema:
        minimum: 0
        type: integer
        format: int32
    limit:
      name: limit
      in: query
      required: false
      description: >-
        The limit of the results for paging, starting at the offset. Limit is
        always capped at 100.
      schema:
        maximum: 100
        minimum: 1
        type: integer
        format: int32
    active:
      name: active
      in: query
      required: false
      description: Filter for active or deactivated users. Leave out to fetch all users.
      schema:
        type: boolean
    email:
      name: email
      in: query
      required: false
      description: Filter by the email address of the user.
      schema:
        $ref: '#/components/schemas/Email'
    tag:
      name: tag
      in: query
      required: false
      description: >-
        Filter by the managed account/card tag. The exact tag must be provided,
        as wildcards are not supported. Leave out to fetch all managed
        accounts/card.
      schema:
        type: string
    bulkProcessStatus:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/BulkProcessStatus'
    bulkId:
      name: bulk_id
      in: path
      required: true
      description: The bulk id of the bulk process.
      schema:
        $ref: '#/components/schemas/BulkId'
    sequence:
      name: sequence
      in: query
      required: false
      schema:
        type: integer
        format: int64
    bulkProcessOperationStatus:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/BulkProcessOperationStatus'
    userIdExplode:
      name: user_id
      in: path
      required: true
      description: The unique identifier for the user.
      style: simple
      explode: false
      schema:
        $ref: '#/components/schemas/UserId'
    creationTimestampFrom:
      name: creationTimestampFrom
      in: query
      required: false
      description: >-
        Filter for transactions created after this timestamp. Epoch timestamp
        using millisecond precision.
      schema:
        type: integer
        format: int64
    creationTimestampTo:
      name: creationTimestampTo
      in: query
      required: false
      description: >-
        Filter for transactions created before this timestamp. Epoch timestamp
        using millisecond precision.
      schema:
        type: integer
        format: int64
    sortOrder:
      name: sortOrder
      in: query
      required: false
      description: |
        Sort order for the results:
          - ASC: Ascending order, oldest first.
          - DESC: Descending order, most recent first.
      schema:
        type: string
        enum:
          - ASC
          - DESC
    profileId:
      name: profileId
      in: query
      required: false
      description: >-
        Filter by the managed account/card profile. Leave out to fetch all
        managed accounts/card.
      schema:
        $ref: '#/components/schemas/ProfileId'
    friendlyName:
      name: friendlyName
      in: query
      required: false
      description: >
        Filter by the managed account/card friendly name. Leave out to fetch all
        managed accounts/card.


        The exact name must be provided, as wildcards are not supported.
      schema:
        minLength: 1
        maxLength: 50
        type: string
    state:
      name: state
      in: query
      required: false
      schema:
        type: array
        uniqueItems: true
        items:
          $ref: '#/components/schemas/InstrumentState'
    currency:
      name: currency
      in: query
      required: false
      description: >
        Filter by the managed account/card currency.


        Currencies are expressed as an ISO 4217 code. Leave out to fetch all
        managed accounts/card.
      schema:
        $ref: '#/components/schemas/Currency'
    createdFrom:
      name: createdFrom
      in: query
      required: false
      description: >-
        Filter for managed accounts/cards created after `createdFrom` timestamp.
        Timestamp is expressed in Epoch timestamp using millisecond precision.
        Leave out to fetch all managed accounts/cards.
      schema:
        type: integer
        format: int64
    createdTo:
      name: createdTo
      in: query
      required: false
      description: >-
        Filter for managed accounts/cards created before `createdTo` timestamp.
        Timestamp is expressed in Epoch timestamp using millisecond precision.
        Leave out to fetch all managed accounts/cards.
      schema:
        type: integer
        format: int64
    verificationRunState:
      name: state
      in: query
      required: false
      schema:
        type: array
        uniqueItems: true
        items:
          $ref: '#/components/schemas/LinkedAccountVerificationRunState'
    state_blockedReason:
      name: state.blockedReason
      in: query
      required: false
      schema:
        type: array
        uniqueItems: true
        items:
          $ref: '#/components/schemas/BlockedReason'
    state_destroyedReason:
      name: state.destroyedReason
      in: query
      required: false
      schema:
        type: array
        uniqueItems: true
        items:
          $ref: '#/components/schemas/DestroyedReason'
    accept:
      name: accept
      in: header
      description: >
        A request parameter specifying the type of response the client would
        like. Must be one of `application/json`, `application/pdf` or
        `text/csv`.


        The default response type (`application/json`) will be returned if
        specified incorrectly or not specified.
      required: false
      schema:
        type: string
    statementLimit:
      name: statementLimit
      in: query
      required: false
      description: >-
        The limit of the results for statements paging, starting at the offset.
        Limit is capped at 500.
      schema:
        maximum: 500
        minimum: 1
        type: integer
        format: int32
    orderByTimestamp:
      name: orderByTimestamp
      in: query
      required: false
      description: |
        Orders the result in ascending or descending order.
          - ASC: Ascending order, oldest transactions first.
          - DESC: Descending order, most recent transactions first.

        If not specified, the transactions will be returned in descending order.
      schema:
        type: string
        enum:
          - ASC
          - DESC
    fromTimestamp:
      name: fromTimestamp
      in: query
      required: false
      description: >-
        Filter for transactions having transaction timestamp after
        `fromTimestamp`. Timestamp is expressed in Epoch timestamp using
        millisecond precision. If omitted, all matching transactions up to the
        present will be included.
      schema:
        type: integer
        format: int64
    toTimestamp:
      name: toTimestamp
      in: query
      required: false
      description: >-
        Filter for transactions having transaction timestamp before
        `toTimestamp`. Timestamp is expressed in Epoch timestamp using
        millisecond precision. If omitted, all matching transactions up to the
        present will be included. If both `fromTimestamp` and `toTimestamp` are
        provided, `toTimestamp` must be greater than `fromTimestamp`.
      schema:
        type: integer
        format: int64
    showFundMovementsOnly:
      name: showFundMovementsOnly
      in: query
      required: false
      description: |
        Deprecated. Use singleEntryPerTransaction instead.

        Returns only the entries which contain fund movements.
      schema:
        type: boolean
    singleEntryPerTransaction:
      name: singleEntryPerTransaction
      in: query
      required: false
      description: >
        Returns transactions that span multiple movements as a single entry.

        Only includes transactions that have been completed.

        Defaults to true for PDF statements, false otherwise.

        Note: due to the fact that only completed transactions are included,
        some

        transactions that are in progress and have modified the balance of the
        instrument

        will not be shown, which could lead to seemingly inconsistent balance
        being displayed.
      schema:
        type: boolean
    statementTransactionType:
      name: transactionType
      in: query
      required: false
      description: Filter by the transaction type. Leave out to fetch all entries.
      schema:
        type: array
        uniqueItems: true
        items:
          $ref: '#/components/schemas/StatementTransactionType'
    apiVersion:
      name: x-api-version
      in: header
      description: >
        Opts the call in to the latest version of the endpoint. Set to `LATEST`
        to be routed to the newest implementation; omit to retain the default
        routing for your tenant.
      required: false
      schema:
        type: string
        enum:
          - LATEST
    statementResponseLimit:
      name: limit
      in: query
      required: false
      description: >-
        The maximum number of statement entries to return. Limit is capped at
        500.
      schema:
        maximum: 500
        minimum: 1
        type: integer
        format: int32
    startPeriod:
      name: startPeriod
      in: query
      required: false
      description: >-
        Start of the statement period. Epoch timestamp using millisecond
        precision.
      schema:
        type: integer
        format: int64
    endPeriod:
      name: endPeriod
      in: query
      required: false
      description: >-
        End of the statement period. Epoch timestamp using millisecond
        precision.
      schema:
        type: integer
        format: int64
    statementSortOrder:
      name: sortOrder
      in: query
      required: false
      description: |
        Sort order for the results:
          - ASC: Ascending order, oldest first (default for statements).
          - DESC: Descending order, most recent first.
      schema:
        $ref: '#/components/schemas/InstrumentStatementSortOrder'
    statementResponseTransactionType:
      name: transaction.type
      in: query
      required: false
      description: Filter statement entries by one or more transaction types.
      schema:
        type: array
        uniqueItems: true
        items:
          $ref: '#/components/schemas/StatementResponseEntryTransactionType'
    statementResponseExecutingAccessInstrumentId:
      name: executingAccessInstrument.id
      in: query
      required: false
      description: >-
        Filter statement entries by the ID of the access instrument that
        initiated the transaction.
      schema:
        type: string
        pattern: ^[0-9]+$
    statementResponseExecutingAccessInstrumentType:
      name: executingAccessInstrument.type
      in: query
      required: false
      description: >-
        Filter statement entries by the type of access instrument that initiated
        the transaction (managed cards or IBANs).
      schema:
        type: array
        uniqueItems: true
        items:
          $ref: '#/components/schemas/AccessInstrumentType'
    transactionActivityType:
      name: type
      in: query
      required: false
      description: Filter by one or more transaction activity types.
      schema:
        type: array
        items:
          $ref: '#/components/schemas/TransactionActivityType'
    transactionActivityStatus:
      name: status
      in: query
      required: false
      description: Filter by one or more normalised transaction statuses.
      schema:
        type: array
        items:
          $ref: '#/components/schemas/TransactionActivityStatus'
    transactionActivityDirection:
      name: direction
      in: query
      required: false
      description: Filter by transaction direction (CREDIT or DEBIT).
      schema:
        $ref: '#/components/schemas/TransactionActivityDirection'
    lastUpdatedTimestampFrom:
      name: lastUpdatedTimestampFrom
      in: query
      required: false
      description: >-
        Filter for transactions last updated after this timestamp. Useful for
        pulling recently changed transactions. Epoch timestamp using millisecond
        precision.
      schema:
        type: integer
        format: int64
    lastUpdatedTimestampTo:
      name: lastUpdatedTimestampTo
      in: query
      required: false
      description: >-
        Filter for transactions last updated before this timestamp. Epoch
        timestamp using millisecond precision.
      schema:
        type: integer
        format: int64
    transactionActivitySortBy:
      name: sortBy
      in: query
      required: false
      description: >-
        The field to sort transaction activity results by. Defaults to
        `creationTimestamp`.
      schema:
        $ref: '#/components/schemas/TransactionActivitySortBy'
    card_type:
      name: type
      in: query
      required: false
      description: Filter by the type of the card.
      schema:
        type: string
        enum:
          - VIRTUAL
          - PHYSICAL
    card_renewal_type:
      name: renewalType
      in: query
      required: false
      description: Filter by the renewal type of the card.
      schema:
        type: string
        enum:
          - RENEW
          - NO_RENEW
    userIdQuery:
      name: userId
      in: query
      required: false
      description: The unique identifier for the user.
      schema:
        $ref: '#/components/schemas/UserId'
    cardPaymentCardId:
      name: cardId
      in: query
      required: false
      description: Filter by the managed card the payment belongs to.
      schema:
        type: string
        pattern: ^[0-9]+$
    cardPaymentStatus:
      name: status
      in: query
      required: false
      explode: false
      description: Filter by one or more card payment statuses.
      schema:
        type: array
        items:
          $ref: '#/components/schemas/CardPaymentStatus'
    cardPaymentType:
      name: type
      in: query
      required: false
      explode: false
      description: Filter by one or more card payment types.
      schema:
        type: array
        items:
          $ref: '#/components/schemas/CardPaymentType'
    cardPaymentSubtype:
      name: subtype
      in: query
      required: false
      explode: false
      description: >-
        Filter by one or more event subtypes (joined against the events
        timeline).
      schema:
        type: array
        items:
          $ref: '#/components/schemas/CardPaymentSubtype'
    cardPaymentMerchantName:
      name: merchantName
      in: query
      required: false
      description: Partial, case-insensitive match against merchant name.
      schema:
        type: string
    cardPaymentAmountFrom:
      name: amountFrom
      in: query
      required: false
      description: Filter for `displayAmount.amount >= amountFrom`.
      schema:
        type: integer
        format: int64
    cardPaymentAmountTo:
      name: amountTo
      in: query
      required: false
      description: Filter for `displayAmount.amount <= amountTo`.
      schema:
        type: integer
        format: int64
    cardPaymentRelatedCardPaymentId:
      name: relatedCardPaymentId
      in: query
      required: false
      description: Filter for card payments related to the given parent id.
      schema:
        type: string
        pattern: ^[0-9]+$
    cardPaymentCreationTimestampFrom:
      name: creationTimestampFrom
      in: query
      required: false
      schema:
        type: integer
        format: int64
    cardPaymentCreationTimestampTo:
      name: creationTimestampTo
      in: query
      required: false
      schema:
        type: integer
        format: int64
    cardPaymentLastUpdatedTimestampFrom:
      name: lastUpdatedTimestampFrom
      in: query
      required: false
      schema:
        type: integer
        format: int64
    cardPaymentLastUpdatedTimestampTo:
      name: lastUpdatedTimestampTo
      in: query
      required: false
      schema:
        type: integer
        format: int64
    cardPaymentSortOrder:
      name: sortOrder
      in: query
      required: false
      description: Sort order on `creationTimestamp`. ASC = oldest first.
      schema:
        type: string
        enum:
          - ASC
          - DESC
    cardPaymentId:
      name: id
      in: path
      required: true
      description: The unique identifier of a card payment.
      schema:
        type: string
        pattern: ^[0-9]+$
    cardPaymentEventCardPaymentId:
      name: cardPaymentId
      in: query
      required: false
      description: Filter events to a single card payment.
      schema:
        type: string
        pattern: ^[0-9]+$
    cardPaymentEventCardId:
      name: cardId
      in: query
      required: false
      description: Filter events to those on a single managed card.
      schema:
        type: string
        pattern: ^[0-9]+$
    cardPaymentEventType:
      name: type
      in: query
      required: false
      explode: false
      description: Filter by one or more event types.
      schema:
        type: array
        items:
          $ref: '#/components/schemas/CardPaymentEventType'
    cardPaymentEventSubtype:
      name: subtype
      in: query
      required: false
      explode: false
      description: Filter events by one or more network subtypes.
      schema:
        type: array
        items:
          $ref: '#/components/schemas/CardPaymentSubtype'
    cardPaymentEventReversal:
      name: reversal
      in: query
      required: false
      description: Filter events by reversal flag.
      schema:
        type: boolean
    cardPaymentEventTimestampFrom:
      name: timestampFrom
      in: query
      required: false
      schema:
        type: integer
        format: int64
    cardPaymentEventTimestampTo:
      name: timestampTo
      in: query
      required: false
      schema:
        type: integer
        format: int64
    cardPaymentEventSortOrder:
      name: sortOrder
      in: query
      required: false
      description: Sort order on event timestamp. ASC = oldest first (default DESC).
      schema:
        type: string
        enum:
          - ASC
          - DESC
    transferProfileId:
      name: profileId
      in: query
      required: false
      description: >-
        Filter by the transfer profile. Leave out to fetch all transfer
        transactions.
      schema:
        $ref: '#/components/schemas/ProfileId'
    instrumentId:
      name: instrumentId
      in: query
      required: false
      description: Filter by the source instrument id.
      schema:
        $ref: '#/components/schemas/InstrumentId'
    transactionState:
      name: state
      in: query
      required: false
      description: Filter by the transfer transaction state. Leave out to fetch all states.
      schema:
        type: array
        uniqueItems: true
        items:
          $ref: '#/components/schemas/TransactionState'
    transferCreatedFrom:
      name: createdFrom
      in: query
      required: false
      description: >-
        Filter for transfer transactions created after `createdFrom` timestamp.
        Timestamp is expressed in Epoch timestamp using millisecond precision.
        Leave out to fetch all transfers.
      schema:
        type: integer
        format: int64
    transferCreatedTo:
      name: createdTo
      in: query
      required: false
      description: >-
        Filter for transfer transactions created before `createdTo` timestamp.
        Timestamp is expressed in Epoch timestamp using millisecond precision.
        Leave out to fetch all transfers.
      schema:
        type: integer
        format: int64
    transferExecutedFrom:
      name: executedFrom
      in: query
      required: false
      description: >-
        Filter for transfer transactions executed after `executedFrom`
        timestamp. Timestamp is expressed in Epoch timestamp using millisecond
        precision. Leave out to fetch all transfers.
      schema:
        type: integer
        format: int64
    transferExecutedTo:
      name: executedTo
      in: query
      required: false
      description: >-
        Filter for transfer transactions executed before `executedTo` timestamp.
        Timestamp is expressed in Epoch timestamp using millisecond precision.
        Leave out to fetch all transfers.
      schema:
        type: integer
        format: int64
    transferTag:
      name: tag
      in: query
      required: false
      description: >-
        Filter by the transfer tag. The exact tag must be provided, as wildcards
        are not supported. Leave out to fetch all entries.
      schema:
        type: string
    sendProfileId:
      name: profileId
      in: query
      required: false
      description: Filter by the Send profile. Leave out to fetch all entries.
      schema:
        $ref: '#/components/schemas/ProfileId'
    sourceId:
      name: source.id
      in: query
      required: false
      description: >-
        Filter by the source instrument id. Must be specified when `source.type`
        is provided.
      schema:
        $ref: '#/components/schemas/Id'
    sourceType:
      name: source.type
      in: query
      required: false
      description: >-
        Filter by the source instrument type. Must be specified when `source.id`
        is provided.
      schema:
        $ref: '#/components/schemas/InstrumentType'
    sendState:
      name: state
      in: query
      required: false
      description: Filter by the Send transaction state. Leave out to fetch all states.
      schema:
        type: array
        uniqueItems: true
        items:
          $ref: '#/components/schemas/SendState'
    sendCreatedFrom:
      name: createdFrom
      in: query
      required: false
      description: >-
        Filter for send transactions created after `createdFrom` timestamp.
        Timestamp is expressed in Epoch timestamp using millisecond precision.
        Leave out to fetch all Send transactions.
      schema:
        type: integer
        format: int64
    sendCreatedTo:
      name: createdTo
      in: query
      required: false
      description: >-
        Filter for send transactions created before `createdTo` timestamp.
        Timestamp is expressed in Epoch timestamp using millisecond precision.
        Leave out to fetch all Send transactions.
      schema:
        type: integer
        format: int64
    sendExecutedFrom:
      name: executedFrom
      in: query
      required: false
      description: >-
        Filter for send transactions executed after `executedFrom` timestamp.
        Timestamp is expressed in Epoch timestamp using millisecond precision.
        Leave out to fetch all Send transactions.
      schema:
        type: integer
        format: int64
    sendExecutedTo:
      name: executedTo
      in: query
      required: false
      description: >-
        Filter for send transactions executed before `executedTo` timestamp.
        Timestamp is expressed in Epoch timestamp using millisecond precision.
        Leave out to fetch all Send transactions.
      schema:
        type: integer
        format: int64
    sendTag:
      name: tag
      in: query
      required: false
      description: >-
        Filter by the send tag. The exact tag must be provided, as wildcards are
        not supported. Leave out to fetch all entries.
      schema:
        type: string
    iwtState:
      name: state
      in: query
      required: false
      description: Filter incoming wire transfers by state.
      schema:
        type: array
        items:
          $ref: '#/components/schemas/IncomingWireTransferMultiState'
    sourceInstrument_id:
      name: sourceInstrument.id
      in: query
      required: false
      description: >-
        Filter by the source instrument id. Must be specified when `source.type`
        is provided.
      schema:
        $ref: '#/components/schemas/Id'
    sourceInstrument_type:
      name: sourceInstrument.type
      in: query
      required: false
      description: >-
        Filter by the source instrument type. Must be specified when `source.id`
        is provided.
      schema:
        $ref: '#/components/schemas/SourceInstrumentType'
    owtState:
      name: state
      in: query
      required: false
      description: >-
        Filter by the outgoing wire transfer state. Leave out to fetch all
        states.
      schema:
        type: array
        uniqueItems: true
        items:
          $ref: '#/components/schemas/OutgoingWireTransferState'
    request-ref:
      name: request-ref
      in: header
      description: >-
        A unique call reference included in every call, that enables the
        receiver to avoid duplicate handling of a webhook request (e.g. webhook
        was resent).
      required: false
      schema:
        type: string
    published-timestamp:
      name: published-timestamp
      in: header
      description: >-
        The timestamp, expressed in Epoch timestamp using millisecond precision,
        when this event was published.
      required: true
      style: simple
      explode: false
      schema:
        type: integer
        format: int64
    signature:
      name: signature
      in: header
      description: >-
        The signature to verify the authenticity of this request.  This is the
        base64 hash (HmacSHA256) of the `published-timestamp` using your API
        key.
      required: true
      style: simple
      explode: false
      deprecated: true
      schema:
        type: string
    signature-v2:
      name: signature-v2
      in: header
      description: >-
        The signature to verify the authenticity of this request.  This is the
        base64 hash (HmacSHA256) of the `call-ref + payload +
        published-timestamp` using your API key.
      required: true
      style: simple
      explode: false
      schema:
        type: string
    call-ref:
      description: >-
        A call reference generated by the caller and unique to the caller to
        provide correlation between the caller and system with a maximum length
        of 255
      in: header
      name: call-ref
      required: false
      schema:
        type: string
  headers:
    request-ref:
      description: >-
        A request identifier. Providing this reference when contacting our
        support team will help us investigate your query.
      required: true
      schema:
        type: string
    x-ratelimit-limit:
      description: >
        Example: `20, 10;w=60, 20;w=3600, 200;w=86400`

        The first number (20) is the limit that has been exceeded.

        The remaining numbers are the limits that are in force, with 'w' meaning
        'window in seconds'. In this example `20;w=3600` was exceeded. 20 calls
        in 3600secs (1hr)
      required: true
      schema:
        type: string
    x-ratelimit-reset:
      description: The number of seconds until the window is reset.
      required: true
      schema:
        minimum: 0
        type: integer
        format: int32
  requestBodies:
    LoginWithPasswordRequest:
      required: true
      content:
        application/json:
          schema:
            required:
              - email
              - password
            type: object
            properties:
              email:
                $ref: '#/components/schemas/Email'
              password:
                $ref: '#/components/schemas/SensitivePassword'
    LoginViaBiometricsRequest:
      required: true
