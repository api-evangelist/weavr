          $ref: '#/components/schemas/ConsumerSourceOfFunds'
        sourceOfFundsOther:
          type: string
          description: Description of source of funds in case `OTHER` was chosen.
          deprecated: true
    CardAuthorisationEvent:
      required:
        - cardId
        - authorisationType
        - merchantData
        - owner
        - sourceAmount
        - transactionAmount
        - totalTransactionCost
        - transactionId
        - transactionTimestamp
      type: object
      properties:
        cardId:
          type: string
          pattern: ^[0-9]+$
          description: >-
            The unique identifier of the card on which an authorisation is being
            performed
        transactionId:
          type: string
          pattern: ^[0-9]+$
          description: The id of this transaction, for reference.
        authorisationType:
          $ref: '#/components/schemas/CardAuthorisationDetailsAuthorisationType'
          description: The type of authorisation (Debit or Credit)
        sourceAmount:
          description: The amount in the currency of the merchant.
          $ref: '#/components/schemas/CurrencyAmount'
        transactionAmount:
          $ref: '#/components/schemas/CurrencyAmount'
          description: The amount in the currency of the card.
        totalTransactionCost:
          $ref: '#/components/schemas/CurrencyAmount'
          description: >-
            The total amount to be deducted in the currency of the card. This is
            the summation of the transaction amount, forex padding and forex
            fees.
        transactionTimestamp:
          type: integer
          description: >-
            The timestamp of the transaction, using epoch timestamp with
            millisecond precision.
          format: int64
        merchantData:
          $ref: '#/components/schemas/MerchantData'
          description: Merchant related information
        owner:
          $ref: '#/components/schemas/IdentityId'
          description: The owner of the card
        cardholderPresent:
          $ref: '#/components/schemas/CardHolderPresent'
          description: >-
            Optional detail indicating if the card holder was present when the
            authorisation occurred.
        cardPresent:
          type: boolean
          description: >-
            Optional detail indicating if the card was present when the
            authorisation occurred.
        authCode:
          maxLength: 6
          minLength: 1
          type: string
          description: The authorisation code associated with this authorisation.
        forexPadding:
          description: >-
            The forex padding amount, if any, that has been included in the
            transactionAmount.  Forex padding is extra amount blocked to cater
            for currency fluctuation.
          $ref: '#/components/schemas/CurrencyAmount'
        forexFee:
          description: The forex fee, if set, that is included in the transactionAmount.
          $ref: '#/components/schemas/CurrencyAmount'
        mode:
          type: string
          description: >
            The card can be created in prepaid mode or debit mode.


            - A prepaid mode card has its own balance and can have funds
            transferred to or from it.

            - A debit mode card does not have its own balance but will be able
            to spend funds belonging to its parent managed account, subject to a
            configurable spend limit.
        transactionType:
          $ref: '#/components/schemas/CardAuthorisationDetailsTransactionType'
          description: >-
            The fine-grained transaction classification, e.g. ATM cash
            withdrawal, account funding transaction, original credit
            transaction.
      discriminator:
        propertyName: mode
        mapping:
          PREPAID_MODE: '#/components/schemas/PrepaidModeCardAuthorisationEvent'
          DEBIT_MODE: '#/components/schemas/DebitModeCardAuthorisationEvent'
    SensitivePassword:
      type: object
      description: >
        The user's password or passcode used to log in a user.

        Passwords must be:
          - minimum 8 characters for end-users (Consumers and Corporates); 12 characters for others
          - maximum 30 characters
          - include a lowercase character
          - include an uppercase character
          - include a digit and a special character
          - different from any of the 5 last such passwords used.

        For non-PCI compliant integrations, the password submitted must be
        **tokenised**.
      required:
        - value
      properties:
        value:
          maxLength: 100
          type: string
          format: password
