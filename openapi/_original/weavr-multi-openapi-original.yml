            userExchangeRate:
              description: >-
                Rate applied to convert `transactionAmount` into `userAmount`.
                Presentation-only.
              $ref: '#/components/schemas/ScaledAmount'
            authCode:
              type: string
              description: >-
                Issuer authorisation code (ISO 8583 DE 38) echoed from the
