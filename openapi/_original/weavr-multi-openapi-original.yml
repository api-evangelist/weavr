        source:
          description: The source managed account or card from where the funds were sent.
          $ref: '#/components/schemas/InstrumentId'
        sourceFee:
          allOf:
            - $ref: '#/components/schemas/CurrencyAmount'
            - type: object
              description: The fee applied to the source.
        destination:
          description: >-
            The destination managed account or card to where the funds were
            sent.
          oneOf:
            - $ref: '#/components/schemas/InstrumentId'
            - $ref: '#/components/schemas/BeneficiaryId'
        destinationAmount:
          description: >-
            The amount, in same currency as source and destination, that was
            sent from the source to the destination instrument.
          $ref: '#/components/schemas/CurrencyAmount'
        destinationFee:
          allOf:
            - $ref: '#/components/schemas/CurrencyAmount'
            - type: object
              description: The fee applied to the destination.
        transactionAmount:
          allOf:
            - $ref: '#/components/schemas/CurrencyAmount'
            - type: object
              description: The original transaction amount before any fees were deducted.
        description:
          type: string
          description: The description details that are passed to the beneficiary.
          maxLength: 255
          pattern: ^[a-zA-Z0-9\/\-?:().$_,'+\s#=!"%&*<>;\{@\r\n]*$
        state:
          $ref: '#/components/schemas/SendState'
        challengeExemptionReason:
          $ref: '#/components/schemas/ChallengeExemptionReason'
        creationTimestamp:
          type: integer
          format: int64
          description: >-
            The time when the transaction was created, expressed in Epoch
            timestamp using millisecond precision.
        scheduledTimestamp:
          $ref: '#/components/schemas/ScheduledTimestamp'
        executionTimestamp:
          $ref: '#/components/schemas/ExecutionTimestamp'
        cancellationReason:
          $ref: '#/components/schemas/TransactionCancellationReason'
    IncomingWireTransferList:
      type: object
      description: A paginated list of incoming wire transfers.
      properties:
        incomingWireTransfers:
          type: array
          items:
            $ref: '#/components/schemas/IncomingWireTransfer'
        count:
          type: integer
          format: int64
        responseCount:
          type: integer
          format: int64
    IncomingWireTransfer:
      type: object
      required:
        - id
        - state
        - amount
        - destinationInstrument
        - createdAt
      description: An incoming wire transfer received from an external bank account.
      properties:
        id:
          type: string
          pattern: ^[0-9]+$
          description: The unique identifier of the incoming wire transfer.
        profileId:
          $ref: '#/components/schemas/ProfileId'
        state:
          $ref: '#/components/schemas/IncomingWireTransferMultiState'
        amount:
          description: >-
            The amount credited (or to be credited) to the destination
            instrument, in the instrument's currency.
          $ref: '#/components/schemas/CurrencyAmount'
        fee:
          description: >-
            The fee charged on this incoming wire transfer. Omitted when no fee
            was charged.
          $ref: '#/components/schemas/CurrencyAmount'
        destinationInstrument:
          description: The managed account (with IBAN) that received the funds.
          $ref: '#/components/schemas/InstrumentId'
        paymentNetwork:
          type: string
          enum:
            - SEPA
            - FASTER_PAYMENTS
            - SWIFT
            - RIX
            - BACS
            - CHAPS
            - TARGET
          description: The payment network over which the transfer was received.
        senderName:
          type: string
          description: The name of the sender.
        senderIban:
          type: string
          description: The IBAN of the sender.
        senderReference:
          type: string
          description: The payment reference provided by the sender.
        forex:
          $ref: '#/components/schemas/TransactionForex'
        isInstant:
          type: boolean
          description: Whether this was an instant payment.
        createdAt:
          type: integer
          format: int64
          description: >-
            When the IWT was received, expressed in Epoch timestamp using
            millisecond precision.
        executedAt:
          type: integer
          format: int64
          description: >-
            When the IWT was settled, expressed in Epoch timestamp using
            millisecond precision.
    OutgoingWireTransfer:
      required:
        - id
        - profileId
        - creationTimestamp
        - sourceInstrument
        - transferAmount
        - state
      type: object
      properties:
        id:
          type: string
          pattern: ^[0-9]+$
          description: The unique identifier of an Outgoing Wire Transfer transaction.
        profileId:
          $ref: '#/components/schemas/ProfileId'
        tag:
          $ref: '#/components/schemas/Tag'
        sourceInstrument:
          required:
            - type
            - id
          type: object
          description: The source managed account from where the funds were taken.
          properties:
            type:
              type: string
              enum:
                - managed_accounts
            id:
              type: string
              pattern: ^[0-9]+$
        transferAmount:
          description: >-
            The amount, in same currency as source and destination, that was
            transferred from the source.
          $ref: '#/components/schemas/CurrencyAmount'
        fee:
          description: >-
            The fee charged on this outgoing wire transfer. Omitted when no fee
            was charged.
          $ref: '#/components/schemas/CurrencyAmount'
        purpose:
          type: string
          maxLength: 255
          description: The purpose of the payment.
        description:
          maxLength: 50
          type: string
          description: ' Transaction description.'
        type:
          $ref: '#/components/schemas/OutgoingWireTransferType'
        destination:
          oneOf:
            - $ref: '#/components/schemas/OutgoingWireTransferBeneficiary'
            - $ref: '#/components/schemas/SEPABeneficiary'
            - $ref: '#/components/schemas/SWIFTBeneficiary'
            - $ref: '#/components/schemas/RIXBeneficiary'
            - $ref: '#/components/schemas/FasterPaymentsBeneficiary'
            - $ref: '#/components/schemas/BeneficiaryId'
            - $ref: '#/components/schemas/ExternalAccountId'
        state:
          $ref: '#/components/schemas/OutgoingWireTransferState'
        rejectedInfo:
          $ref: '#/components/schemas/OutgoingWireTransferRejectedInfo'
        challengeExemptionReason:
          $ref: '#/components/schemas/ChallengeExemptionReason'
        creationTimestamp:
          type: integer
          format: int64
          description: >-
            The time when the transaction was created, expressed in Epoch
            timestamp using millisecond precision.
        scheduledTimestamp:
          $ref: '#/components/schemas/ScheduledTimestamp'
        executionTimestamp:
          $ref: '#/components/schemas/ExecutionTimestamp'
        cancellationReason:
          $ref: '#/components/schemas/TransactionCancellationReason'
        validationOutcomes:
          type: array
          items:
            $ref: '#/components/schemas/OutgoingWireTransferValidationOutcome'
    OutgoingWireTransferUpdateBeneficiaryNameConflict:
      type: object
      properties:
        errorCode:
          $ref: >-
            #/components/schemas/OutgoingWireTransferUpdateBeneficiaryNameConflictSchemaErrorCode
    OutgoingWireTransferPaymentConfirmationConflict:
      type: object
      required:
        - errorCode
      properties:
        errorCode:
          $ref: >-
            #/components/schemas/OutgoingWireTransferPaymentConfirmationConflictErrorCode
    CorrespondentBankingOwt:
      required:
        - id
        - profileId
        - creationTimestamp
        - sourceInstrument
        - amount
        - originator
        - beneficiary
        - purpose
        - state
      type: object
      properties:
        id:
          type: string
          pattern: ^[0-9]+$
          description: The unique identifier of the Correspondent Banking OWT.
        profileId:
          $ref: '#/components/schemas/ProfileId'
        tag:
          $ref: '#/components/schemas/Tag'
        sourceInstrument:
          required:
            - type
            - id
          type: object
          description: The source managed account from where the funds were taken.
          properties:
            type:
              type: string
              enum:
                - managed_accounts
            id:
              type: string
              pattern: ^[0-9]+$
        amount:
          description: The amount transferred.
          $ref: '#/components/schemas/CurrencyAmount'
        originator:
          oneOf:
            - $ref: '#/components/schemas/CorrespondentBankingIndividualOriginator'
            - $ref: '#/components/schemas/CorrespondentBankingBusinessOriginator'
        beneficiary:
          oneOf:
            - $ref: '#/components/schemas/CorrespondentBankingSEPABeneficiary'
            - $ref: '#/components/schemas/CorrespondentBankingRIXBeneficiary'
            - $ref: >-
                #/components/schemas/CorrespondentBankingFasterPaymentsBeneficiary
        purpose:
          type: string
          maxLength: 255
          description: The purpose of the payment.
        description:
          maxLength: 35
          type: string
          description: >
            These details are passed to the beneficiary as the `reference`. This
            field is mandatory for wire transfers executed over `SEPA`. The
            allowed length is dependent on the payment type:


            `SEPA` <= `35` characters. An extended character set is accepted to
            cater for all European languages. If `SEPA` does not support a
            particular character, it is automatically converted to an acceptable
            alternative, in line with `SEPA` scheme guidance.


            `Faster Payments` <= `18` characters
        externalData:
          type: array
          description: Additional external data as key-value pairs.
          items:
            $ref: '#/components/schemas/CorrespondentBankingExternalData'
        state:
          $ref: '#/components/schemas/CorrespondentBankingOwtState'
        creationTimestamp:
          type: integer
          format: int64
          description: >-
            The time when the transaction was created, expressed in Epoch
            timestamp using millisecond precision.
        scheduledTimestamp:
          $ref: '#/components/schemas/ScheduledTimestamp'
        cancellationReason:
          $ref: '#/components/schemas/TransactionCancellationReason'
        validationOutcomes:
          type: array
          items:
            $ref: '#/components/schemas/CorrespondentBankingOwtValidationOutcome'
    BeneficiaryBatch:
      type: object
      required:
        - operationBatchId
        - state
      properties:
        operationBatchId:
          $ref: '#/components/schemas/BeneficiaryOperationBatchId'
        tag:
          $ref: '#/components/schemas/Tag'
        state:
          $ref: '#/components/schemas/BeneficiaryBatchState'
    Beneficiary:
      allOf:
        - $ref: '#/components/schemas/BasicBeneficiary'
        - type: object
          required:
