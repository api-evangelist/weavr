      description: >
        Starts the verification process for a list of resources in which a push
        notification is sent to a device belonging to the logged-in user that
        was previously enrolled through the
        `/authentication_factors/push/{channel}` endpoint.


        This endpoint can be used to challenge _Outgoing Wire Transfers_ &
        _Sends_.


        You should only start this process if the resource `state` is
        `PENDING_CHALLENGE`.
      summary: Issue a push notification that can be used to verify a list of resources
