    FasterPaymentsBeneficiary:
      required:
        - name
        - type
        - accountNumber
        - sortCode
      type: object
      description: Beneficiary details for Faster Payments wire transfers.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 140
          pattern: ^[a-zA-Z0-9\/\-?:().,'+\s#=!"%&*<>;\{@\r\n]*$
          description: >
            The beneficiary's full name. >= 1 character and <= 140 characters.

            Note: the ' symbol is the unicode value U+2019 (right single
            quotation mark)

            and not the unicode value U+0027 (apostrophe).
        type:
          type: string
          description: The type of beneficiary account. Required for Faster Payments.
          enum:
            - PERSONAL
            - BUSINESS
        accountNumber:
          type: string
          pattern: ^[0-9]{8}$
          description: Account number, required for wire transfer over Faster Payments.
        sortCode:
          type: string
          pattern: ^[0-9]{6}$
          description: Sort code, required for wire transfer over Faster Payments.
        secondaryReference:
          type: string
          description: Optional secondary reference for accounts without unique sort codes.
        address:
          maxLength: 150
          minLength: 1
          type: string
          description: The beneficiary's address.
        bankName:
          type: string
          description: The beneficiary's bank name.
        bankAddress:
          maxLength: 150
          minLength: 1
          type: string
          description: The beneficiary's bank address.
        bankCountry:
          type: string
          description: The beneficiary's bank country in ISO 3166 alpha-2 format.
          maxLength: 2
          minLength: 2
          pattern: ^[A-Z]{2}$
        nationality:
          $ref: '#/components/schemas/Nationality'
        dateOfBirth:
          $ref: '#/components/schemas/DateOfBirth'
    ExternalAccountId:
      type: object
      description: >-
        The id of an external account, such as a Linked Account, registered with
        the Weavr Platform.
      required:
        - type
        - id
      properties:
        type:
          $ref: '#/components/schemas/ExternalAccountType'
        id:
          type: string
          pattern: ^[0-9]+$
    AccountType:
      type: string
      description: |
        An account can be of two types, Personal or Business:
          - PERSONAL means that the account held at the external bank or PSP is registered under the ownership of a natural person or consumer identity;
          - BUSINESS means that the account held at the external bank or PSP is registered under the ownership of a corporate entity.
      enum:
        - BUSINESS
        - PERSONAL
    AccountNumberAndSortCode:
      required:
        - accountNumber
        - sortCode
      type: object
      description: Bank details
      properties:
        accountNumber:
          type: string
          pattern: ^[0-9]{8}$
          description: Account number
        sortCode:
          type: string
          pattern: ^[0-9]{6}$
          description: Sort code
        secondaryReference:
          type: string
          description: Optional secondary reference for accounts without unique sort codes.
    Iban:
      required:
        - iban
      type: object
      description: Bank details
      properties:
        iban:
          type: string
          minLength: 15
          maxLength: 34
          pattern: ^[A-Z]{2}[0-9]{2}[A-Z0-9]{11,30}$
          description: International Bank Account Number, required for wire transfer.
        bankIdentifierCode:
          type: string
          minLength: 8
          maxLength: 11
          pattern: ^[a-zA-Z0-9]{4}[a-zA-Z]{2}[a-zA-Z0-9]{2}[a-zA-Z0-9]{0,3}$
          description: BIC, for wire transfer over SEPA or RIX.
    AccountDescriptor:
      required:
        - accountDescriptor
      type: object
      description: >-
        Identifier or account number which does not follow either the IBAN or
        Faster Payment (sort code and account number) format, such as a US bank
        account identifier.
      properties:
        accountDescriptor:
          type: string
    LinkedAccountState:
      type: string
      description: >
        The state of the linked account:
          - **PENDING_VERIFICATION**: The Linked Account is pending the completion of the required verification steps.
          - **ACTIVE**: The Linked Account is verified and active, ready to be used for self-to-self wire transfers.
          - **BLOCKED**: The Linked Account is temporarily blocked, preventing any use of this external account in self-to-self wire transfers. A Linked Account can be unblocked by calling the Multi API endpoint `POST /linked_accounts/{id}/unblock`.
          - **REMOVED**: The Linked Account has been removed from the platform and can no longer be used for self-to-self wire transfers unless a new verification is completed in future.
          - **REJECTED**: The Linked Account failed the verification process and cannot be used for self-to-self wire transfers unless a new verification is completed in future.
        A Linked Account can transition through these different overall states,
        starting at the `PENDING_VERIFICATION` state until all verification
        steps are followed through.
      enum:
        - PENDING_VERIFICATION
        - BLOCKED
        - ACTIVE
        - REJECTED
        - REMOVED
    StringWrappedTypeId:
      required:
        - type
        - id
