  /challenges/{scaChallengeId}/otp/{channel}/verify:
    post:
      tags:
        - Confirmation Challenges
      description: >
        Completes the verification process for a list of resources.


        This endpoint can be used to challenge _Outgoing Wire Transfers_ &
        _Sends_.


        If the outcome of the verification is successful, the resource is
        executed.


        If not verified challenge expires after 5 minutes and the number of
        incorrect OTP attempts is limited to reduce the risk of fraud.


        _Note that on the Sandbox Environment, text messages are not sent and
        the `verificationCode` is always \"123456\"._
      summary: Verify a list of resources using a one-time password
      operationId: multipleSCAVerify
      parameters:
        - $ref: '#/components/parameters/idempotency-ref'
        - name: scaChallengeId
          in: path
          required: true
          description: The unique identifier of the SCA challenge.
          schema:
            type: string
            pattern: ^[0-9]+$
        - $ref: '#/components/parameters/channel'
      requestBody:
        $ref: '#/components/requestBodies/MultipleSCAVerifyRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
