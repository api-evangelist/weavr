    CardPaymentList:
      type: object
      description: Paginated list of CardPayments.
      properties:
        cardPayments:
          type: array
          items:
            $ref: '#/components/schemas/CardPayment'
        count:
          type: integer
          format: int64
        responseCount:
          type: integer
          format: int64
    CardPayment:
      type: object
      description: >
        One card transaction's full lifecycle — authorisation, settlement,
        refunds — as a single resource that the platform keeps up to date as
        scheme events arrive.


        Designed for two audiences:
          - **Building UI?** Read the top-level summary fields (`displayAmount`, `status`, `type`, `merchant`, `card`). They are platform-maintained — show them as-is. No need to understand auth-vs-clearing, reversals, or scheme messages. The debit/credit direction is implicit from `type` (purchases / cash withdrawals / account funding debit the card; refunds / original credits credit it). For the issuer authorisation code, walk `events[]` — every event in the lifecycle carries it.
          - **Need scheme-level detail?** Walk `events[]` for the full per-step audit trail — every authorisation, clearing, reversal, and refund step — with original scheme amounts (merchant + card currency, with exchange rates), reason codes, and fees attached to the event that triggered them.

        Each card payment corresponds to one card-scheme lifecycle (Visa
        Transaction Identifier / Mastercard TLID). Related-but-separate
        transactions (refunds, tips, recurring follow-ups) are separate card
        payments linked via `relatedCardPaymentId` (direct parent).
      required:
        - id
        - type
        - card
        - merchant
        - displayAmount
        - status
        - events
        - creationTimestamp
      properties:
        id:
          type: string
          pattern: ^[0-9]+$
          description: Stable identifier across the entire payment lifecycle.
        profileId:
          $ref: '#/components/schemas/ProfileId'
        type:
          description: >-
            The high-level type of card payment. For finer-grained
            classification (e.g. distinguishing a sale-purchase from a sale with
            cashback), see the per-event `subtype` field.
          $ref: '#/components/schemas/CardPaymentType'
        card:
          description: The managed card used for this payment.
          $ref: '#/components/schemas/Card'
        merchant:
          $ref: '#/components/schemas/Merchant'
        displayAmount:
          description: >
            Platform-maintained headline amount of the card payment, in the
            cardholder's preferred display currency (which matches the card
            billing currency unless a specific `userCurrency` was set when the
            card was created). The amount is derived from card payment events
            and can be displayed in your transaction activity UI as the amount
            of the card payment.


            As a headline amount, it reflects the intended amount of the
            payment.
              - In the case of a full reversal or cancellation and within-lifecycle dispute swings it stays stable. For example, an auth-50 → settle-50 → reverse-50 cycle still reads as 50 here, even though the net ledger impact is zero.
              - In the case of a partial reversal it reflects the net amount, so the display amount of the card payment reflects the revised amount. For example, an auth-50 (displayAmount 50) → settle-40 with a release of the remaining auth of 10, displayAmount updated to 40.

            To compute the actual net (for accounting), sum the amounts of your
            chosen type, from all the events, yourself.


            Magnitude is always positive. The debit/credit direction is implicit
            from `type` (purchases debit, refunds and OCTs credit). For the
            lifecycle phase, read `status`. For amounts in the merchant's
            currency (transaction currency) or the card's currency (if different
            from your preferred currency), read `events[]`.
          $ref: '#/components/schemas/CurrencyAmount'
        status:
          $ref: '#/components/schemas/CardPaymentStatus'
        relatedCardPaymentId:
          type: string
          pattern: ^[0-9]+$
          description: >
            Direct parent linkage — id of the single prior card payment that
            this payment derives from. Set on:
              - `REFUND` payments referring to the original purchase
              - `ORIGINAL_CREDIT` payments referring to the prior purchase being credited
              - Tip / add-on payments referring to the original ride / fare / service
              - Installment / recurring payments referring to the initial setup transaction

            Corresponds to Visa's "Original Transaction ID" linkage and
            Mastercard's DE 105 subelement 002 (Economically Related Transaction
            Identifier). Not used for messages that share a single lifecycle —
            those are events on the same card payment.
        events:
          type: array
          description: >-
            Ordered event stream — every scheme message in this card payment's
            lifecycle. For headline display use `displayAmount`; walk this when
            you need scheme-level detail (per-event amounts, fees, reason codes,
            reversals).
          items:
            $ref: '#/components/schemas/CardPaymentEvent'
        creationTimestamp:
          type: integer
          format: int64
          description: When the first event for this payment was received, Epoch millis.
        lastUpdatedTimestamp:
          type: integer
          format: int64
          description: >-
            When the most recent event for this payment was received, Epoch
            millis.
