    CardPaymentRefundEventDetail:
      description: >-
        Refund event with parent card-payment context — used by `GET
        /card_payment_events` so each row is self-contained.
      allOf:
        - $ref: '#/components/schemas/CardPaymentEventDetail'
        - $ref: '#/components/schemas/CardPaymentRefundEvent'
