    DigitalWalletType:
      type: string
      description: The digital wallet type.
      enum:
        - GOOGLE_PAY
        - APPLE_PAY
        - MERCHANT_TOKEN
    CardAccessInstrument:
      description: >-
        An access instrument that is a managed card (e.g. a debit-mode card
        initiating a transaction on its parent managed account).
      allOf:
        - $ref: '#/components/schemas/StatementResponseEntryExecutingAccessInstrument'
        - type: object
          properties:
            friendlyName:
              description: The friendly name of the card.
              type: string
            cardBrand:
              description: The card brand (e.g. VISA, MASTERCARD).
              type: string
            cardNumberFirstSix:
              description: The first six digits of the card number.
              type: string
            cardNumberLastFour:
              description: The last four digits of the card number.
              type: string
    IbanAccessInstrument:
      description: An access instrument that is an IBAN attached to a managed account.
      allOf:
        - $ref: '#/components/schemas/StatementResponseEntryExecutingAccessInstrument'
        - type: object
          properties:
            friendlyName:
              description: The friendly name of the access instrument.
              type: string
            handle:
              description: The IBAN or account number.
              type: string
    CardPaymentEventResult:
      type: string
      description: Outcome of an authorisation event.
      enum:
        - APPROVED
        - DECLINED
    AuthorisationCategory:
      type: string
      description: The category of the authorisation.
      enum:
        - PRE_AUTH
        - FINAL_AUTH
    CardPaymentAuthForwardingDetails:
      type: object
      description: Details of auth-forwarding handling on the authorisation.
      properties:
        triggered:
          type: boolean
          description: True if auth forwarding was triggered for this authorisation.
        decisionOutcome:
          description: Default decision applied if the innovator did not respond in time.
          $ref: '#/components/schemas/CardPaymentAuthForwardingDecisionOutcome'
        innovatorTimedOut:
          type: boolean
          description: >-
            True if the innovator failed to respond within the configured
            timeout and the default decision was applied.
    CardPaymentDeclineReason:
      type: string
      description: >-
        Reason an authorisation was declined; populated only when `result =
        DECLINED`. Mirrors the legacy authorisation webhook's decline reason
        values.
      enum:
        - NO_REASON
        - PHYSICAL_NOT_ACTIVATED
        - INSUFFICIENT_BALANCE
        - CVV_CHECKS_FAILED
        - CVV_RETRIES_EXCEEDED
        - CARD_STATUS_NOT_ALLOWED
        - PIN_CHECKS_FAILED
        - PIN_RETRIES_EXCEEDED
        - CARD_EXPIRY_CHECKS_FAILED
        - AVS_CHECKS_FAILED
        - ATM_WITHDRAWAL_LIMIT_EXCEEDED
        - SCA_REQUIRED
        - AUTH_RULE_CHECKS_FAILED
        - TRANSACTION_NOT_PERMITTED
        - TIMEOUT
        - SINGLE_SPEND
    CardPaymentForex:
      type: object
      description: >-
        Auth-time FX context: the rate applied at authorisation and the cushion
        blocked to cater for rate movement before settlement. Surfaced as a pair
        on `AUTHORISATION` events only — on settlement/refund/oct the rate sits
        at the event top-level (it modifies that event's amounts directly) and
        padding has already been absorbed or released at clearing time.
      properties:
        exchangeRate:
          description: >-
            Rate applied to convert `transactionAmount` into `billingAmount` at
            authorisation time. Populated on cross-currency authorisations.
          $ref: '#/components/schemas/ScaledAmount'
        padding:
          description: >-
            Extra amount blocked at authorisation time to cater for currency
            fluctuation between auth and settlement. Already included in the
            event's `transactionAmount`; surfaced separately so the embedder can
            show the cardholder how much of the charge is the FX cushion.
            Released or absorbed at clearing time.
          $ref: '#/components/schemas/CurrencyAmount'
    CardPaymentFee:
      type: object
      description: |
        A fee accrued on a specific card payment event. Discriminated by `type`:
          - `PLATFORM_FEE` → `CardPaymentPlatformFee` — fee charged by the platform; points at the underlying `FeeTransaction`.
          - `FOREX_FEE` → `CardPaymentForexFee` — forex padding + forex fee captured at authorisation on a cross-currency event.
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/CardPaymentFeeType'
      discriminator:
        propertyName: type
        mapping:
          PLATFORM_FEE: '#/components/schemas/CardPaymentPlatformFee'
          FOREX_FEE: '#/components/schemas/CardPaymentForexFee'
    CardPaymentSettlementState:
      type: string
      description: Processing state of a settlement event at the scheme.
      enum:
        - PENDING
        - COMPLETED
    CardPaymentEventContext:
      type: object
      description: >-
        Parent card-payment context attached to standalone (`*EventDetail`)
        variants so each event row returned by `GET /card_payment_events` is
        self-contained — no need to fetch the parent card payment separately to
        render a history entry.
      required:
        - cardPaymentId
        - card
        - merchant
      properties:
        cardPaymentId:
          type: string
          pattern: ^[0-9]+$
          description: Id of the parent `CardPayment` this event belongs to.
        card:
          $ref: '#/components/schemas/Card'
        merchant:
          $ref: '#/components/schemas/Merchant'
    StatementCardPaymentSubtype:
      type: string
      description: Subtype of a card payment statement entry.
      enum:
        - sale_purchases
        - cash_withdrawals
        - sales_with_cashback
        - mail_or_telephone_orders
        - purchase_refund_reversals
        - original_credit_transaction_reversals
        - cash_withdrawal_reversals
        - purchase_refunds
        - purchase_reversals
        - original_credit_transactions
        - first_chargebacks
        - first_chargeback_reversals
        - first_representments
        - first_representment_reversals
        - second_chargebacks
        - second_chargeback_reversals
        - second_representments
        - arbitration_chargebacks
    StatementOutgoingWireTransferSubtype:
      type: string
      description: Subtype of an outgoing wire transfer statement entry.
      enum:
        - redemptions
        - returns
    StatementIncomingWireTransferSubtype:
      type: string
      description: Subtype of an incoming wire transfer statement entry.
      enum:
        - fundings
    StatementCorrespondentBankTransferSubtype:
      type: string
      description: Subtype of a correspondent bank transfer statement entry.
      enum:
        - returns
    CardPaymentAuthForwardingDecisionOutcome:
      type: string
      description: >-
        Default decision applied if the innovator does not respond in time
        during auth-forwarding.
      enum:
        - APPROVE
        - DECLINE
    CardPaymentFeeType:
      type: string
      enum:
        - PLATFORM_FEE
        - FOREX_FEE
    CardPaymentPlatformFee:
      description: >-
        A fee charged by the platform on this card payment event (a
        `FeeTransaction` posted against the cardholder's instrument). The `id`
        points at the underlying fee transaction, retrievable in full via the
        Transaction Activity API.
      allOf:
        - $ref: '#/components/schemas/CardPaymentFee'
        - type: object
          required:
            - id
            - subtype
            - amount
          properties:
            id:
              type: string
              pattern: ^[0-9]+$
              description: Identifier of the underlying `FeeTransaction`.
            subtype:
              description: Category of fee.
              $ref: '#/components/schemas/CardPaymentFeeSubtype'
            amount:
              description: >-
                Fee amount, in the currency of the instrument the fee was
                applied to.
              $ref: '#/components/schemas/CurrencyAmount'
    CardPaymentForexFee:
      description: >-
        Forex fee charged on a cross-currency event. Already included in the
        event's `transactionAmount` — surfaced here so the embedder can show the
        cardholder how much of the charge was the forex fee.
      allOf:
        - $ref: '#/components/schemas/CardPaymentFee'
        - type: object
          properties:
            amount:
              description: >-
                The forex fee charged on this event, in the currency of the
                instrument the fee was applied to.
              $ref: '#/components/schemas/CurrencyAmount'
    CardPaymentFeeSubtype:
      type: string
      description: >-
        The category of a platform fee accrued on a card payment event.
        Restricted to subtypes that can fire on card payments.
      enum:
        - purchase_fees
        - refund_fees
        - atm_withdrawal_fees
        - withdrawal_fees
        - chargeback_fees
        - fee_reversals
        - custom_fees
        - other_fees
paths:
  /login_with_password:
    post:
      tags:
        - Sign-in
      description: >
        Authenticate a user with the `email` and `password` that they provided
        when registering.


        Given that the user credentials are correct, this returns a `token` that
        can then be used to authorise

        other secured operations. In case the password is expired, a temporary
        `token` is returned, which can be used

        solely for updating the password.


        The token returned is valid for 5 minutes from last activity.
      summary: Sign in with password
      operationId: loginWithPassword
      requestBody:
        $ref: '#/components/requestBodies/LoginWithPasswordRequest'
      responses:
        '200':
          $ref: '#/components/responses/LoginWithPasswordResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The authentication credentials are not found or are incorrect.
        '404':
          $ref: '#/components/responses/NotFoundToken'
        '409':
          $ref: '#/components/responses/LoginWithPasswordConflict'
        '410':
          $ref: '#/components/responses/TokenExpired'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Error'
      security:
        - api-key: []
  /login_via_biometrics:
    post:
      tags:
        - Sign-in
      description: >
        Trigger a push notification and subsequent biometric authentication of a
        user, by providing the email that was 

        used in the enrolment process of biometrics.


        This endpoint can be used in conjunction with your application to
        authenticate a user and receive a stepped-up 

        token in a single action, for use in-session for any endpoints or UI
        components that require step-up 

        authentication.


        Given that the user credentials are correct, a push notification is sent
        to the user requesting them to complete

        biometric authentication. On successful completion of authentication, a
        token will be shared that can be used 

        for endpoints or UI components that require a stepped-up token.
      summary: Sign in via biometrics
      operationId: loginViaBiometrics
      requestBody:
        $ref: '#/components/requestBodies/LoginViaBiometricsRequest'
      responses:
        '200':
          $ref: '#/components/responses/LoginViaBiometricsResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The authentication credentials are not found or are incorrect.
        '409':
          $ref: '#/components/responses/LoginViaBiometricsConflict'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Error'
      security:
        - api-key: []
  /stepup/challenges/otp/{channel}:
    post:
      tags:
        - Step-up Challenges
      description: >
        Initiates the step-up token process by sending an SMS with an
        one-time-password to a device belonging to the logged-in user that was
        previously enrolled through `/authentication_factors/otp/{channel}`
        endpoint.


        This process is required for endpoints that require a step-up token to
        complete the call.


        _Note that on the Sandbox Environment, text messages are not sent and
        the one-time-password is always \"123456\"._
      summary: Issue a one-time password that can be used to step-up a token
      operationId: stepupSCAChallenge
      parameters:
        - $ref: '#/components/parameters/idempotency-ref'
        - $ref: '#/components/parameters/channel'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/StepUpSCAChallengeConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Error'
      security:
        - auth_token: []
          api-key: []
  /stepup/challenges/otp/{channel}/verify:
    post:
      tags:
        - Step-up Challenges
      description: >
        Completes the verification process for a step up token.

        The challenge expires after 5 minutes and the number of incorrect OTP
        attempts is limited to reduce the risk of fraud, in that case challenge
        has to be issued again.


        _Note that on the Sandbox Environment, text messages are not sent and
        the `verificationCode` is always \"123456\"._
      summary: Verify a step-up token using a one-time password
      operationId: stepupSCAVerify
      parameters:
        - $ref: '#/components/parameters/idempotency-ref'
        - $ref: '#/components/parameters/channel'
      requestBody:
        $ref: '#/components/requestBodies/SCAVerifyRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/StepUpSCAVerifyConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Error'
      security:
        - auth_token: []
          api-key: []
  /stepup/challenges/push/{channel}:
    post:
      tags:
        - Step-up Challenges
      description: >
        Initiates the step-up token process by submitting a push notification to
        a device belonging to the logged-in user that was previously enrolled
        through the `/authentication_factors/push/{channel}` endpoint.


        You should only start this process if the token step-up isn't already in
        flight.
      summary: Issue a push notification that can be used to step-up a token
      operationId: stepupSCAChallengePush
      parameters:
        - $ref: '#/components/parameters/idempotency-ref'
        - $ref: '#/components/parameters/scaPushChannel'
      responses:
        '200':
          $ref: '#/components/responses/StepUpSCAChallengePushResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/StepUpSCAChallengePushConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Error'
      security:
        - auth_token: []
          api-key: []
  /logout:
    post:
      tags:
        - Sign-in
      deprecated: true
      description: >-
        Logs out the user and terminates the session identified by the
        `auth_token` in the Authorization Header.
      summary: Logout
      operationId: logout
      responses:
        '200':
          $ref: '#/components/responses/LogoutResponse'
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Error'
      security:
        - auth_token: []
          api-key: []
  /passwords/{user_id}/create:
    post:
      tags:
        - Authentication Factors
      description: >-
        Create a new password for the user identified by the `user_id` path
        parameter.
      summary: Create a password
      operationId: passwordCreate
      parameters:
        - $ref: '#/components/parameters/userId'
      requestBody:
        $ref: '#/components/requestBodies/PasswordCreateRequest'
      responses:
        '200':
          $ref: '#/components/responses/PasswordResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFoundToken'
        '409':
          $ref: '#/components/responses/CreatePasswordConflict'
        '410':
          $ref: '#/components/responses/TokenExpired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Error'
      security:
        - api-key: []
  /passwords/update:
    post:
      tags:
        - Authentication Factors
      description: Update the password for the logged-in user.
      summary: Update a password
      operationId: passwordUpdate
      requestBody:
        $ref: '#/components/requestBodies/PasswordUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/PasswordResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFoundToken'
        '409':
          $ref: '#/components/responses/PasswordUpdateConflict'
        '410':
          $ref: '#/components/responses/TokenExpired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Error'
      security:
        - auth_token: []
          api-key: []
  /passwords/validate:
    post:
      tags:
        - Authentication Factors
      description: Check that a password adheres to all complexity checks.
      summary: Validate a password
      operationId: passwordValidate
      requestBody:
        $ref: '#/components/requestBodies/PasswordValidateRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFoundToken'
        '409':
          $ref: '#/components/responses/PasswordValidateConflict'
        '410':
          $ref: '#/components/responses/TokenExpired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Error'
      security:
        - api-key: []
  /passwords/lost_password/start:
    post:
      tags:
        - Authentication Factors
      description: >
        Initiate the lost password process.


        If the email address provided is associated with an active user, an
        email will be sent, containing a URL that redirects the user to change
        their password.

        The URL contains request parameters for all of the parameters required
        to change the password for the user via the
        `/passwords/lost_password/resume` POST endpoint.
      summary: Initiate lost password process
      operationId: lostPasswordInitiate
      requestBody:
        $ref: '#/components/requestBodies/EmailRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/LostPasswordInitiateConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Error'
      security:
        - api-key: []
  /passwords/lost_password/resume:
    post:
      tags:
        - Authentication Factors
      description: >-
        This is the second and final step in updating the password of a user who
        forgot their password.
      summary: Resume lost password process
      operationId: lostPasswordResume
      requestBody:
        $ref: '#/components/requestBodies/LostPasswordResumeRequest'
      responses:
        '200':
          $ref: '#/components/responses/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFoundToken'
        '409':
          $ref: '#/components/responses/LostPasswordResumeConflict'
        '410':
          $ref: '#/components/responses/TokenExpired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Error'
      security:
        - api-key: []
  /authentication_factors:
    get:
      tags:
        - Authentication Factors
      description: >-
        Retrieves the list of authentication factors that can be used to verify
        the logged-in user.
      summary: Get user authentication factors
      operationId: authFactorsGet
      responses:
        '200':
          $ref: '#/components/responses/AuthFactorsGetResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Error'
      security:
        - auth_token: []
          api-key: []
  /authentication_factors/otp/{channel}:
    post:
      tags:
        - Authentication Factors
      description: >
        This is the first step in enrolling the logged-in user's mobile device,
        where a one-time password is sent to the device.


        _Note that on the Sandbox Environment, text messages are not sent and
        the one-time-password is always \"123456\"._
      summary: Enrol a user device for authentication using one-time passwords
      operationId: enrolDeviceUsingOtpStepOne
      parameters:
        - $ref: '#/components/parameters/idempotency-ref'
        - $ref: '#/components/parameters/channel'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/EnrolDeviceUsingOtpStepOneConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Error'
      security:
        - api-key: []
          auth_token: []
  /authentication_factors/otp/{channel}/verify:
    post:
      tags:
        - Authentication Factors
      description: >
        The second step in enrolling the logged-in user (root or authorised
        user) to use one-time-passwords to enable verification of transactions.

        The challenge expires after 5 minutes and the number of incorrect OTP
        attempts is limited to reduce the risk of fraud, in that case challenge
        has to be issued again.


        _Note that on the Sandbox Environment, text messages are not sent and
        the `verificationCode` is always set to \"123456\"._
      summary: >-
        Verify enrolment of a user device for authentication using one-time
        passwords
      operationId: enrolDeviceUsingOtpStepTwo
      parameters:
        - $ref: '#/components/parameters/idempotency-ref'
        - $ref: '#/components/parameters/channel'
      requestBody:
        $ref: '#/components/requestBodies/SCAVerifyRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/EnrolDeviceUsingOtpStepTwoConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Error'
      security:
        - api-key: []
          auth_token: []
  /authentication_factors/push/{channel}:
    post:
      tags:
        - Authentication Factors
      description: >
        This is the first step in enrolling the logged-in user's mobile device,
        where a push notification is sent to the device.
      summary: Enrol a user device for authentication using push notifications
      operationId: enrolDeviceUsingPush
      parameters:
        - $ref: '#/components/parameters/idempotency-ref'
        - $ref: '#/components/parameters/authFactorsPushChannel'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InstrumentForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/EnrolDeviceUsingPushConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Error'
      security:
        - api-key: []
          auth_token: []
    delete:
      tags:
        - Authentication Factors
      description: Unlink a user device for authentication using push notifications
      summary: Unlink a user device for authentication using push notifications
      operationId: unlinkDeviceUsingPush
      parameters:
        - $ref: '#/components/parameters/idempotency-ref'
        - $ref: '#/components/parameters/scaPushChannel'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InstrumentForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/UnlinkDeviceUsingPushConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Error'
      security:
        - api-key: []
          auth_token: []
  /challenges/otp/{channel}:
    post:
      tags:
        - Confirmation Challenges
      description: >
        Starts the verification process for a list of resources in which a
        one-time password is sent to a device belonging to the logged-in user
        that was previously enrolled through the
        `/authentication_factors/otp/{channel}` endpoint. 


        This endpoint can be used to challenge _Outgoing Wire Transfers_,
        _Sends_, and _Linked Account Declarations_.


        You should only start this process if the operation `state` is
        `PENDING_CHALLENGE`.


        _Note that on the Sandbox Environment, text messages are not sent and
        the one-time-password is always \"123456\"._
      summary: Issue a one-time password that can be used to verify a list of resources
      operationId: multipleSCAChallenge
      parameters:
        - $ref: '#/components/parameters/idempotency-ref'
