        bankName:
          type: string
          maxLength: 150
          description: The beneficiary's bank name.
        bankAddress:
          maxLength: 150
          minLength: 1
          type: string
          description: The beneficiary's bank address.
        bankCountry:
          type: string
          description: The beneficiary's bank country in ISO 3166 alpha-2 format.
          maxLength: 2
          minLength: 2
          pattern: ^[A-Z]{2}$
        nationality:
          $ref: '#/components/schemas/Nationality'
        dateOfBirth:
          $ref: '#/components/schemas/DateOfBirth'
    CorrespondentBankingRIXBeneficiary:
      required:
        - name
        - iban
        - address
      type: object
      description: >-
        CBT-specific beneficiary details for RIX wire transfers with Banking
        Circle FI-to-FI field limits.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 35
          description: >
            The beneficiary's full name. >= 1 character and <= 35 characters.

            An extended character set is accepted to cater for all European
            languages.

            If RIX does not support a particular character, it is automatically

            converted to an acceptable alternative.
        iban:
          type: string
          minLength: 15
          maxLength: 34
          pattern: ^[A-Z]{2}[0-9]{2}[A-Z0-9]{11,30}$
          description: >-
            International Bank Account Number, required for wire transfer over
            RIX.
        bankIdentifierCode:
          type: string
          minLength: 8
          maxLength: 11
          pattern: ^[a-zA-Z0-9]{4}[a-zA-Z]{2}[a-zA-Z0-9]{2}[a-zA-Z0-9]{0,3}$
          description: BIC (Bank Identifier Code) for wire transfer over RIX.
        address:
          maxLength: 105
          minLength: 1
          type: string
          description: >
            The beneficiary's address. Required for correspondent banking
            transfers.

            Maximum 105 characters (split into 3x35-char lines by the provider).
        bankName:
          type: string
          maxLength: 150
          description: The beneficiary's bank name.
        bankAddress:
          maxLength: 150
          minLength: 1
          type: string
          description: The beneficiary's bank address.
        bankCountry:
          type: string
          description: The beneficiary's bank country in ISO 3166 alpha-2 format.
          maxLength: 2
          minLength: 2
          pattern: ^[A-Z]{2}$
        nationality:
          $ref: '#/components/schemas/Nationality'
        dateOfBirth:
          $ref: '#/components/schemas/DateOfBirth'
    CorrespondentBankingFasterPaymentsBeneficiary:
      required:
        - name
        - type
        - accountNumber
        - sortCode
        - address
      type: object
      description: >-
        CBT-specific beneficiary details for Faster Payments wire transfers with
        Banking Circle FI-to-FI field limits.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 35
          pattern: ^[a-zA-Z0-9\/\-?:().,'+\s#=!"%&*<>;\{@\r\n]*$
          description: >
            The beneficiary's full name. >= 1 character and <= 35 characters.

            Note: the ' symbol is the unicode value U+2019 (right single
            quotation mark)

            and not the unicode value U+0027 (apostrophe).
        type:
          type: string
          description: The type of beneficiary account. Required for Faster Payments.
          enum:
            - PERSONAL
            - BUSINESS
        accountNumber:
          type: string
          pattern: ^[0-9]{8}$
          description: Account number, required for wire transfer over Faster Payments.
        sortCode:
          type: string
          pattern: ^[0-9]{6}$
          description: Sort code, required for wire transfer over Faster Payments.
        secondaryReference:
          type: string
          description: Optional secondary reference for accounts without unique sort codes.
        address:
          maxLength: 105
          minLength: 1
          type: string
          description: >
            The beneficiary's address. Required for correspondent banking
            transfers.

            Maximum 105 characters (split into 3x35-char lines by the provider).
        bankName:
          type: string
          maxLength: 150
          description: The beneficiary's bank name.
        bankAddress:
          maxLength: 150
          minLength: 1
          type: string
          description: The beneficiary's bank address.
        bankCountry:
          type: string
          description: The beneficiary's bank country in ISO 3166 alpha-2 format.
          maxLength: 2
          minLength: 2
          pattern: ^[A-Z]{2}$
        nationality:
          $ref: '#/components/schemas/Nationality'
        dateOfBirth:
          $ref: '#/components/schemas/DateOfBirth'
    CorrespondentBankingExternalData:
      type: object
      description: External data key-value pair.
      required:
        - name
        - value
      properties:
        name:
          type: string
          maxLength: 50
          description: Name/key of the external data.
        value:
          type: string
          maxLength: 255
          description: Value of the external data.
    BeneficiaryTrustLevel:
      type: string
      description: The value that determines whether a Beneficiary is trusted or not.
      enum:
        - TRUSTED
    BusinessBeneficiaryType:
      required:
        - businessName
      type: object
      properties:
        businessName:
          type: string
          description: >
            The business beneficiary name. The allowed length and pattern is
            dependent on the beneficiary details type:


            `InstrumentDetailsBeneficiary` or `BankAccountDetailsBeneficiary`
            with `IBANDetails`: >= `1` character and <= `150` characters


            `BankAccountDetailsBeneficiary` with
            `FasterPaymentsBankDetailsOrBACSBankDetails`: >= `1` character and
            <= `140` characters with a pattern of
            `^[a-zA-Z0-9\/\-?:().,’+\s#=!"%&*<>;\{@\r\n]*$`

            (please note that the `’` symbol is the unicode value U+2019 (right
            single quotation mark) and not the unicode value U+0027
            (apostrophe))
    ConsumerBeneficiaryType:
      required:
        - fullName
      type: object
      properties:
        nationality:
          type: string
          description: >-
            The nationality of the consumer. Must be a valid ISO 3166-1 alpha-2
            country code (e.g., 'GB', 'FR').
          pattern: ^[A-Z]{2}$
        dateOfBirth:
          type: string
          description: >-
            The date of birth of the consumer. Must be a valid date in ISO 8601
            format (YYYY-MM-DD) and should not be a future date.
          format: date
        fullName:
          type: string
          description: >
            The person beneficiary name. The allowed length and pattern is
            dependent on the beneficiary details type:


            `InstrumentDetailsBeneficiary` or `BankAccountDetailsBeneficiary`
            with `IBANDetails`: >= `1` character and <= `150` characters


            `BankAccountDetailsBeneficiary` with
            `FasterPaymentsBankDetailsOrBACSBankDetails`: >= `1` character and
            <= `140` characters with a pattern of
            `^[a-zA-Z0-9\/\-?:().,’+\s#=!"%&*<>;\{@\r\n]*$`

            (please note that the `’` symbol is the unicode value U+2019 (right
            single quotation mark) and not the unicode value U+0027
            (apostrophe))
    InstrumentDetailsBeneficiary:
      required:
        - instrument
      type: object
      description: >-
        Represents a Weavr beneficiary instrument typically used in Send
        transactions.
      properties:
        instrument:
          $ref: '#/components/schemas/InstrumentId'
    BankAccountDetailsBeneficiary:
      required:
        - bankAccountDetails
      type: object
      description: >-
        Represent the beneficiary bank account typically used in Outgoing Wire
        Transfer transactions.
      properties:
        address:
          maxLength: 150
          minLength: 1
          type: string
          description: The beneficiary's address.
        bankName:
          type: string
          description: The beneficiary's bank name.
        bankAddress:
          maxLength: 150
          minLength: 1
          type: string
          description: The beneficiary's bank address.
        bankCountry:
          type: string
          description: The beneficiary's bank country in ISO 3166 alpha-2 format.
          maxLength: 2
          minLength: 2
          pattern: ^[A-Z]{2}$
        bankAccountDetails:
          description: >-
            Details of the beneficiary bank account, depending on the type of
            transfer chosen.
          oneOf:
            - $ref: '#/components/schemas/IBANDetails'
            - $ref: '#/components/schemas/FasterPaymentsBankDetailsOrBACSBankDetails'
    SCAChallengeType:
      type: string
      enum:
        - OTP
        - PUSH
        - BIOMETRIC
      description: >
        - "OTP": The OTP is sent as a text message

        - "PUSH": The authorisation request is sent as a push notification

        - "BIOMETRIC": The push notification is sent via Firebase to a mobile
        application
    SCAFactorStatus:
      type: string
      description: >
        The state of the factor type.

        - `PENDING_VERIFICATION` : The user has started the enrolment process
        but still hasn't completed enrolment. Challenges cannot be used before
        they are verified.

        - `ACTIVE` : The user has successfully completed enrolment and the
        challenge can be used to verify transactions.

        - `INACTIVE` : The user has rejected the enrolment.
      enum:
        - PENDING_VERIFICATION
        - ACTIVE
        - INACTIVE
    SCAChannel:
      type: string
      enum:
        - SMS
        - AUTHY
        - BIOMETRIC
      description: |
        - "SMS": The one-time-password is sent as a text message
        - "AUTHY": The push notification is sent to an Authy application
        - "BIOMETRIC": The push notification is sent to an innovator application
    BulkProcessConflictErrorCode:
      enum:
        - VALIDATION_FAILED
        - USER_VALIDATION_FAILED
        - ALREADY_SUBMITTED
        - DUPLICATE_OPERATION_TYPE
        - NO_CONFIG_FOUND
        - INVALID_STATE
        - TOO_MANY_REQUESTS
      type: string
    BulkProcessOperationStatusCounts:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/BulkProcessOperationStatus'
        count:
          type: integer
    BulkProcessOperation:
      type: object
      properties:
        operationId:
          description: >-
            Id of a specific bulk operation. Useful only if you need to refer to
            a specific operation when reporting an issue
          type: string
        sequence:
          description: >-
            The operations submitted in a Bulk Processes are executed in
            sequence. This field indicates the position of this specific
            operation in the context of such sequence
          format: int32
          type: integer
        method:
          description: >-
            HTTP request method used for the executed operation within the Bulk
            process
          type: string
        path:
          description: The endpoint path for the Operation
          type: string
        status:
          description: >
            The execution status of the operation within the Bulk Process. This
            can be one of: "SUBMITTED" "RUNNING" "COMPLETED" "FAILED"
            "CANCELLED"
          $ref: '#/components/schemas/BulkProcessOperationStatus'
        requestPayload:
          description: >-
            This is the payload for the execution of an operation within the
            context of a Bulk Process
          type: string
        responsePayload:
          description: The response for the execution of the operation
          type: string
    UserIdentity:
      required:
        - id
        - name
      type: object
      properties:
        id:
          description: The unique identifier of the Corporate Identity.
          $ref: '#/components/schemas/IdentityId'
        name:
          type: string
          description: The name of the company.
    CreatedCorporateRootUser:
      allOf:
        - $ref: '#/components/schemas/CorporateRootUser'
        - type: object
          required:
            - passwordAlreadySet
          properties:
            passwordAlreadySet:
              type: boolean
              description: >-
                When the corporate root user is a single email multiple
                identities user, this field returns true, indicating that there
                is no need to call the `passwordCreate` operation for this user.
    TransactionId:
      required:
        - type
        - id
      type: object
      properties:
        type:
          enum:
            - AUTHORISATION
            - SETTLEMENT
            - MANUAL_TRANSACTION
            - TRANSFER
            - SEND
            - DEPOSIT
            - AUTHORISATION_REVERSAL
            - AUTHORISATION_EXPIRY
            - AUTHORISATION_DECLINE
            - AUTHORISATION_MANUAL_CLOSE
            - MERCHANT_REFUND
            - MERCHANT_REFUND_REVERSAL
            - ORIGINAL_CREDIT_TRANSACTION
            - SETTLEMENT_REVERSAL
            - ADJUSTMENT
            - CHARGE_FEE
            - WITHDRAWAL_RESERVE
            - WITHDRAWAL_RELEASE
            - FEE_REVERSAL
            - OUTGOING_WIRE_TRANSFER
            - AUTHORISATION_CANCELLATION
            - SYSTEM_TRANSACTION
            - OUTGOING_DIRECT_DEBIT_COLLECTION
            - OUTGOING_DIRECT_DEBIT_REFUND
            - LINKED_ACCOUNT_VERIFICATION_TRANSFER
            - INCOMING_WIRE_TRANSFER
            - FUNDING
            - TEST_FUNDING
            - CORRESPONDENT_BANK_TRANSFER
          type: string
          x-enumDescriptions:
            AUTHORISATION: ''
            SETTLEMENT: ''
            MANUAL_TRANSACTION: >
              For a manual transaction, the `additionalFields`: `note` will
              contain a description with the reason for the transaction. This
              will start with one of the following prefixes:


              - Account Closure

              - Chargebacks - Represented

              - Chargebacks - Won

              - Deleted Card - Transfer from

              - Deleted Card - Transfer to

              - Duplicate Authorisation Issue

              - Duplicate Settlement Issue

              - Expired Card - Transfer from

              - Expired Card - Transfer to

              - Forex Padding Release Issue

              - Funds Redemption & Account Closure

              - Manual Auth Expiry

              - Missing Settlement Issue

              - Negative Card Balance

              - Reversal - Duplicate Transaction

              - Reversal - Manual Auth Expiry

              - Reversal - Manual Transaction

              - Amend Balance - Auth Expiry

              - Balance Adjustment

              - Completing Deposit

              - Duplicate Deposit
            TRANSFER: ''
            SEND: ''
            DEPOSIT: ''
            AUTHORISATION_REVERSAL: ''
            AUTHORISATION_EXPIRY: ''
            AUTHORISATION_DECLINE: ''
            AUTHORISATION_MANUAL_CLOSE: ''
            MERCHANT_REFUND: ''
            MERCHANT_REFUND_REVERSAL: ''
            ORIGINAL_CREDIT_TRANSACTION: ''
            SETTLEMENT_REVERSAL: ''
            ADJUSTMENT: ''
            CHARGE_FEE: ''
            WITHDRAWAL_RESERVE: ''
            WITHDRAWAL_RELEASE: ''
            FEE_REVERSAL: ''
            OUTGOING_WIRE_TRANSFER: ''
            AUTHORISATION_CANCELLATION: ''
            SYSTEM_TRANSACTION: ''
            OUTGOING_DIRECT_DEBIT_COLLECTION: ''
            OUTGOING_DIRECT_DEBIT_REFUND: ''
        id:
          type: string
          pattern: ^[0-9]+$
    FeeTransaction:
      type: object
      required:
        - id
        - feeType
        - amount
        - instrument
        - status
        - creationTimestamp
      description: >
        A fee charged or reversed on an instrument. Surfaced through `GET
        /fees`,

        `GET /transactions` (Transaction Activity), and as line items on
        statements.
      properties:
        id:
          type: string
          pattern: ^[0-9]+$
          description: The unique identifier of the fee transaction.
        feeType:
          $ref: '#/components/schemas/FeeSubtype'
        amount:
          description: The fee amount in the instrument's currency.
          $ref: '#/components/schemas/CurrencyAmount'
        instrument:
          description: The instrument the fee was charged against.
          $ref: '#/components/schemas/InstrumentId'
        status:
          $ref: '#/components/schemas/FeeTransactionStatus'
        description:
          type: string
          maxLength: 255
        relatedTransactionId:
          type: string
          pattern: ^[0-9]+$
          description: The parent transaction this fee relates to, if any.
        creationTimestamp:
          type: integer
          format: int64
        lastUpdatedTimestamp:
          type: integer
          format: int64
    LinkedAccountVerificationStep:
      type: string
      enum:
        - TRANSFER_INSTRUCTION
        - USER_DECLARATION_SCA_CHALLENGE
        - INTERNAL_CHECKS
        - MICRO_DEPOSIT
    LinkedAccountVerificationTransferInstruction:
      type: object
      required:
        - amount
        - reference
      properties:
        amount:
          $ref: '#/components/schemas/CurrencyAmount'
        reference:
          type: string
        destination:
          type: object
          properties:
            accountOwnerName:
              type: string
            accountType:
              $ref: '#/components/schemas/AccountType'
            accountReference:
              oneOf:
                - $ref: '#/components/schemas/Iban'
                - $ref: '#/components/schemas/AccountNumberAndSortCode'
                - $ref: '#/components/schemas/AccountDescriptor'
    LinkedAccountMicroDepositVerification:
      type: object
      required:
        - amount
      properties:
        amount:
          $ref: '#/components/schemas/CurrencyAmount'
        senderName:
          type: string
    LinkedAccountVerificationStepStatus:
      type: string
      enum:
        - PENDING_USER
        - PENDING_REVIEW
        - PENDING_EXECUTION
        - REJECTED
        - COMPLETED
    IBANDetails:
      required:
        - iban
      type: object
      description: Bank details used in case the wire transfer is executed over SEPA or RIX
      properties:
        iban:
          type: string
          minLength: 15
          maxLength: 34
          pattern: ^[A-Z]{2}[0-9]{2}[A-Z0-9]{11,30}$
          description: >-
            International Bank Account Number, required for wire transfer over
            SEPA or RIX
        bankIdentifierCode:
          type: string
          minLength: 8
          maxLength: 11
          pattern: ^[a-zA-Z0-9]{4}[a-zA-Z]{2}[a-zA-Z0-9]{2}[a-zA-Z0-9]{0,3}$
          description: BIC, for wire transfer over SEPA or RIX
    FasterPaymentsBankDetailsOrBACSBankDetails:
      required:
        - accountNumber
        - sortCode
      type: object
      description: >-
        Bank details used in case the wire transfer is executed over Faster
        Payments.
      properties:
        accountNumber:
          type: string
          pattern: ^[0-9]{8}$
          description: Account number, required for wire transfer over Faster Payments.
        sortCode:
          type: string
          pattern: ^[0-9]{6}$
          description: Sort code, required for wire transfer over Faster Payments.
        secondaryReference:
          type: string
    SwiftBankDetails:
      required:
        - iban
        - code
      type: object
      description: Bank details used in case the wire transfer is executed over SWIFT.
      properties:
        iban:
          type: string
          minLength: 15
          maxLength: 34
          pattern: ^[A-Z]{2}[0-9]{2}[A-Z0-9]{11,30}$
          description: >-
            International Bank Account Number, required for wire transfer over
            SWIFT.
        code:
          type: string
          minLength: 8
          maxLength: 11
          pattern: ^[a-zA-Z0-9]{4}[a-zA-Z]{2}[a-zA-Z0-9]{2}[a-zA-Z0-9]{0,3}$
          description: >-
            SWIFT code, identifying a particular bank or branch, required for
            wire transfer over SWIFT.
    StatementEntryState:
      type: string
      description: |
        The transaction entry state, as follows:
          - PENDING: The transaction has started and some of the fund movements have completed, however additional fund movements are still pending to finalise the transaction.
          - COMPLETED: All fund movements for a transaction have completed.
      enum:
        - PENDING
        - COMPLETED
    ScaledAmount:
      type: object
      properties:
        value:
          type: integer
          format: int64
        scale:
          maximum: 127
          minimum: -128
          type: integer
          format: int32
      description: >-
        A floating point number, represented as a value and its scale. Its
        actual value can be obtained using the equation: value * pow(10,
        -scale).
    UserCurrencyTransactionDetails:
      required:
        - userTransactionAmount
        - userExchangeRate
      type: object
      properties:
        userTransactionAmount:
          $ref: '#/components/schemas/CurrencyAmount'
        userExchangeRate:
          type: string
      description: >-
        The object representing the user transaction's currency, amount and
        rate.
    StatementResponseEntry:
      type: object
      required:
        - entryId
        - balanceAdjustment
        - balanceAfter
        - timestamp
        - transaction
      description: >
        A single entry in an instrument statement. Each entry represents a
        posted transaction

        that caused the actual balance of the instrument to change.
      properties:
        entryId:
          type: string
          pattern: ^[0-9]+$
          description: The unique identifier of this statement entry.
        transaction:
          $ref: '#/components/schemas/StatementResponseEntryTransaction'
        description:
          type: string
          maxLength: 255
          description: Human-readable description or reference for the entry.
        timestamp:
          type: integer
          format: int64
          description: >-
            When the transaction was posted to the statement, expressed in Epoch
            timestamp using millisecond precision.
        balanceAdjustment:
          description: >-
            The amount credited (positive) or debited (negative) on the actual
            balance of the instrument.
          $ref: '#/components/schemas/CurrencyAmount'
        balanceAfter:
          description: The balance of the instrument after this entry was posted.
          $ref: '#/components/schemas/CurrencyAmount'
        counterparty:
          oneOf:
            - $ref: '#/components/schemas/MerchantCounterparty'
            - $ref: '#/components/schemas/InstrumentCounterparty'
            - $ref: '#/components/schemas/BankAccountCounterparty'
        fee:
          $ref: '#/components/schemas/FeeSummary'
        forex:
          $ref: '#/components/schemas/TransactionForex'
        relatedEntryId:
          type: string
          pattern: ^[0-9]+$
          description: >-
            The ID of a related statement entry (e.g. a fee entry linked to its
            parent transaction entry).
        executingAccessInstrument:
          $ref: '#/components/schemas/StatementResponseEntryExecutingAccessInstrument'
    FeeSummary:
      type: object
      required:
        - id
        - type
        - amount
      properties:
        id:
          description: >-
            Identifier of the fee — same value used as entryId on the
            corresponding fees-type entry, and as the fee transaction id in the
            Transaction Activity API.
          type: string
          pattern: ^[0-9]+$
        type:
          description: Always `fees`. Aligns with the top-level transaction type.
          type: string
          enum:
            - fees
        amount:
          description: Fee amount in the instrument's currency.
          $ref: '#/components/schemas/CurrencyAmount'
        subtype:
          description: Categorises the fee — derived from the parent transaction type.
          $ref: '#/components/schemas/FeeSubtype'
    SystemTransaction:
      type: object
      required:
        - id
        - amount
        - instrument
        - status
        - creationTimestamp
      description: >
        A system-generated transaction applied to an instrument by the platform
        (balance adjustments,

        account closures, dispute outcomes, replacement balance transfers,
        etc.). Only surfaced

        through Transaction Activity.
      properties:
        id:
          type: string
          pattern: ^[0-9]+$
          description: The unique identifier of the system transaction.
        subtype:
          $ref: '#/components/schemas/SystemTransactionSubtype'
        amount:
          description: The transaction amount in the instrument's currency.
          $ref: '#/components/schemas/CurrencyAmount'
        instrument:
          description: The instrument the transaction was applied to.
          $ref: '#/components/schemas/InstrumentId'
        status:
          $ref: '#/components/schemas/TransactionActivityStatus'
        reason:
          type: string
          maxLength: 255
          description: Operational reason or context for the system transaction.
        relatedTransactionId:
          type: string
          pattern: ^[0-9]+$
          description: >-
            A related transaction this system event corrects or compensates, if
            any.
        creationTimestamp:
          type: integer
          format: int64
        lastUpdatedTimestamp:
          type: integer
          format: int64
    SensitiveCardNumber:
      type: object
      description: >
        The full card number of the card.


        Unless you are PCI-DSS compliant and have opted to switch off Weavr's
        security model, the card number will be tokenised.


        To show the full unredacted card number to your user, you need to embed
        the Card number UI Component in your application. This accepts the
        tokenised card number and shows the unredacted card number to the user
        on screen.


        In addition, it is returned only when the current session is stepped-up.
      properties:
        value:
          maxLength: 16
          type: string
    SensitiveCvv:
      type: object
      description: >
        The CVV of the card.


        Unless you are PCI-DSS compliant and have opted to switch off Weavr's
        security model, the card's CVV will be tokenised.


        To show the card's CVV to your user, you need to embed the CVV UI
        Component in your application. This accepts the tokenised CVV and shows
        the plain text CVV number to the user on screen.


        In addition, it is returned only when the current session is stepped-up.
      properties:
        value:
          maxLength: 3
          type: string
    PhysicalCardDetails:
      required:
        - pendingActivation
      type: object
      properties:
        bulkDelivery:
          $ref: '#/components/schemas/BulkCardDelivery'
        productReference:
          type: string
          description: >-
            The unique reference indicating the configuration of the physical
            card. Example the card design.
        carrierType:
          type: string
        pendingActivation:
          type: boolean
          description: >-
            Indicates if the physical card is activated for physical usage such
            as with physical terminals.
        pinBlocked:
          type: boolean
          description: >-
            Indicates if the physical card is blocked due to providing incorrect
            PINs.
        manufacturingState:
          $ref: '#/components/schemas/ManufacturingState'
        replacement:
          deprecated: true
          type: object
          description: Indicates if the physical card is replaced by another card.
          properties:
            replacementReason:
              type: string
              description: |
                The reason why the physical card was replaced.
                  - DAMAGED: The physical card was damaged and cannot be used at a physical terminal.
                  - LOST_STOLEN: The physical card was either lost or stolen and cannot be used.
                  - EXPIRED: The physical card expired.
              enum:
                - DAMAGED
                - LOST_STOLEN
                - EXPIRED
            replacementId:
              type: string
              pattern: ^[0-9]+$
              description: The unique identifier of the new card that replaces this card.
        deliveryAddress:
          $ref: '#/components/schemas/DeliveryAddress'
        deliveryMethod:
          $ref: '#/components/schemas/DeliveryMethod'
        deliveryTrackingCode:
          $ref: '#/components/schemas/DeliveryTrackingCode'
        deliveryTrackingMethod:
          $ref: '#/components/schemas/DeliveryTrackingMethod'
        deliveryTrackingUrl:
          $ref: '#/components/schemas/DeliveryTrackingUrl'
        nameOnCardLine2:
          deprecated: true
          maxLength: 27
          pattern: >-
            ^[a-zA-Z0-9ßÀÁÂÃÄÅǍÆÇÈÉÊËÌÍÎÏÒÓÔÕÖØŠÙÚÛÜŸÝĄĆČĎĘĹĽŁŃŇÑŐŔŚȘȚŤŰŹŻŽàáâãäåǎæçèéêëìíîïòóôõöøšùúûüÿýąćčďęĺľłńňñőŕśșțťűźżž\-^.
            '-]*$
          type: string
          description: >-
            Line 2 of the 'name on card' field. For Physical cards, this field
            will be printed on the card. The maximum characters allowed will
            depend on the design chosen and will be provided to you by Weavr
            when setting up your plastic cards. This field is deprecated
    ManagedCardReplacement:
      description: Indicates if the card is replaced by another card.
      type: object
      required:
        - id
        - reason
      properties:
        id:
          description: The id of the replacement card
          pattern: ^[0-9]+$
          type: string
        reason:
          description: |
            The reason why the card was replaced.
              - DAMAGED: The physical card was damaged and cannot be used at a physical terminal.
              - LOST_STOLEN: The physical card was either lost or stolen and cannot be used.
              - EXPIRED: The card expired.
              - COMPROMISED: The virtual card was compromised; the virtual card details have been exposed or accessed without authorization.
          type: string
          enum:
            - DAMAGED
            - LOST_STOLEN
            - EXPIRED
            - COMPROMISED
    PrepaidModeCard:
      allOf:
        - $ref: '#/components/schemas/ManagedCard'
        - type: object
          properties:
            balances:
              $ref: '#/components/schemas/ManagedInstrumentBalance'
    DebitModeCard:
      allOf:
        - $ref: '#/components/schemas/ManagedCard'
        - type: object
          required:
            - parentManagedAccountId
          properties:
            parentManagedAccountId:
              type: string
              pattern: ^[0-9]+$
              description: >-
                Id of the managed account holding funds which the managed card
                will access, up to a configurable spend limit.
            userCurrency:
              $ref: '#/components/schemas/SupportedUserCurrency'
            availableToSpend:
              description: >-
                The amount of funds from the parent managed account that are
                available to be spent through the card, in a given time
                interval.
              type: array
              items:
                $ref: '#/components/schemas/AvailableToSpend'
    Card:
      type: object
      required:
        - id
        - type
      description: >-
        Information about a managed card — used wherever a card appears (the
        card on a card payment, or the access instrument that initiated a
        transaction).
      properties:
        id:
          type: string
          pattern: ^[0-9]+$
          description: The unique identifier of the managed card.
        type:
          type: string
          enum:
            - managed_cards
        mode:
          type: string
          enum:
            - prepaid
            - debit
          description: |
            The mode the card was created in.
              - `prepaid`: The card has its own balance and can have funds transferred to or from it.
              - `debit`: The card has no balance of its own; it draws on its parent managed account up to a configurable spend limit.
        friendlyName:
          type: string
          description: The friendly name chosen for the card.
        nameOnCard:
          type: string
          description: The cardholder name printed on the card.
        cardBrand:
          type: string
          enum:
            - MASTERCARD
            - VISA
          description: >-
            The scheme of the card. Restricted to schemes supported by card
            payments.
        cardNumberFirstSix:
          type: string
          pattern: ^[0-9]{6}$
          description: The first six digits of the card number (BIN range).
        cardNumberLastFour:
          type: string
          pattern: ^[0-9]{4}$
          description: The last four digits of the card number.
        linkedUserId:
          type: string
          pattern: ^[0-9]+$
          description: >-
            Identifier of the authorised user the card is assigned to. Populated
            only when the card has been assigned to a specific user.
        parentManagedAccountId:
          type: string
          pattern: ^[0-9]+$
          description: >-
            Identifier of the managed account this card draws funds from.
            Populated only when `mode` is `debit`.
    Merchant:
      type: object
      description: >-
        Information about a merchant — used wherever a merchant appears in
        card-payment flows, statement entries, and transaction activity.
      required:
        - id
        - name
      properties:
        id:
          type: string
          description: >-
            Merchant identifier (MID) — the acquirer-assigned code that
            identifies the merchant on card-scheme messages (ISO 8583 DE 42 Card
            Acceptor Identification Code).
        name:
          type: string
          description: Merchant name (DBA name).
        nameOther:
          type: string
          description: >-
            Alternative merchant name as supplied by the card network, when
            present.
        networkId:
          type: string
          description: Identifier assigned by the acquirer or scheme to the merchant.
        categoryCode:
          type: string
          description: ISO 18245 merchant category code (MCC).
        description:
          type: string
          description: Free-text description of the merchant.
        street:
          type: string
          description: Street address of the merchant terminal.
        city:
          type: string
          description: City of the merchant terminal.
        state:
          type: string
          description: Subdivision (state, province, region) of the merchant terminal.
        postalCode:
          type: string
          description: Postal code of the merchant terminal.
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code of the merchant terminal.
        telephone:
          type: string
          description: Merchant telephone.
        url:
          type: string
          description: Merchant website.
        contact:
          type: string
          description: Merchant contact (name or email of a representative, when present).
        reference:
          type: string
          description: >-
            Merchant-supplied reference for the transaction (the merchant's own
            identifier for what they billed).
        logoUrl:
          type: string
          description: Merchant logo URL, when available.
    CardPaymentEvent:
      type: object
      description: >
        An event in a card payment's lifecycle, lean — used **nested** inside
        `CardPayment.events[]`. The parent card payment provides
        `cardPaymentId`, `card`, and `merchant`, so the lean variants don't
        repeat them. Each event carries its own `authCode`. Four variants
        discriminated by `type`:

          - `AUTHORISATION` → `CardPaymentAuthorisationEvent`
          - `SETTLEMENT` → `CardPaymentSettlementEvent`
          - `REFUND` → `CardPaymentRefundEvent`
          - `ORIGINAL_CREDIT` → `CardPaymentOriginalCreditEvent` (Visa OCT / Mastercard MoneySend)

        For the **standalone** version returned by `GET /card_payment_events` —
        which carries `cardPaymentId`, `card`, and `merchant` so each row is
        self-contained — see `CardPaymentEventDetail`.
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/CardPaymentEventType'
      discriminator:
        propertyName: type
        mapping:
          AUTHORISATION: '#/components/schemas/CardPaymentAuthorisationEvent'
          SETTLEMENT: '#/components/schemas/CardPaymentSettlementEvent'
          REFUND: '#/components/schemas/CardPaymentRefundEvent'
          ORIGINAL_CREDIT: '#/components/schemas/CardPaymentOriginalCreditEvent'
    CardPaymentEventDetail:
      type: object
      description: >
        Standalone card payment event — same four variants as
        `CardPaymentEvent`, but each row also carries the parent `CardPayment`
        context (`cardPaymentId`, `card`, `merchant`) so embedders can render an
        event-centric history feed without fetching each parent card payment.


        Used as the item type of `GET /card_payment_events`. For the lean nested
        version (inside `CardPayment.events[]`), see `CardPaymentEvent`.
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/CardPaymentEventType'
      discriminator:
        propertyName: type
        mapping:
          AUTHORISATION: '#/components/schemas/CardPaymentAuthorisationEventDetail'
          SETTLEMENT: '#/components/schemas/CardPaymentSettlementEventDetail'
          REFUND: '#/components/schemas/CardPaymentRefundEventDetail'
          ORIGINAL_CREDIT: '#/components/schemas/CardPaymentOriginalCreditEventDetail'
    SpendLimit:
      type: object
      required:
        - value
        - interval
      properties:
        startTimestamp:
          description: >-
            The start timestamp of the spend limit, expressed in Epoch timestamp
            using millisecond precision.
          type: integer
          format: int64
        value:
          description: The spend limit, as amount and currency, (for the given interval).
          $ref: '#/components/schemas/CurrencyAmount'
        interval:
          $ref: '#/components/schemas/SpendLimitInterval'
    ProfileLevelSpendRules:
      allOf:
        - $ref: '#/components/schemas/CommonLevelSpendRules'
        - type: object
          properties:
            authForwardingEnabled:
              type: boolean
              description: Indicates if auth forwarding is enabled on profile level
    IdentityLevelSpendRules:
      allOf:
        - $ref: '#/components/schemas/CommonLevelSpendRules'
        - type: object
          properties:
            minTransactionAmount:
              type: integer
              minimum: 0
              format: int64
              description: >-
                The minimum transaction amount, in card currency, that is
                allowed. If the transaction amount is less than this value, then
                the transaction will be declined. Omit this, or set to 0 if no
                maximum transaction amount is to be set.
            maxTransactionAmount:
              type: integer
              minimum: 0
              format: int64
              description: >-
                The maximum transaction amount, in card currency, that is
                allowed. If the transaction amount is greater than this value,
                then the transaction will be declined.
    ExecutionTimestamp:
      pattern: ^[0-9]+$
      type: string
      description: >-
        The epoch timestamp at which the transaction was executed, transitioning
        to a final state such as COMPLETED, REJECTED, or FAILED.
    TransactionCancelResponse:
      required:
        - id
        - state
      type: object
      properties:
        id:
          type: string
          pattern: ^[0-9]+$
          description: The id of the transaction.
        state:
          type: string
          enum:
            - SUCCESS
            - ERROR
        errorCode:
          type: string
          description: >
            Indicates the reason why the cancel operation could not be executed.

            May be included in the response if the state is "ERROR".


            - "GENERIC": A generic error has occurred.

            - "TRANSACTION_NOT_SCHEDULED": The transaction is not in state
            SCHEDULED.

            - "FORBIDDEN": The current user is not allowed to access this
            transaction.

            - "NOT_FOUND": The transaction does not exist.
          enum:
            - GENERIC
            - TRANSACTION_NOT_SCHEDULED
            - FORBIDDEN
            - NOT_FOUND
    ChallengeExemptionReason:
      type: string
      enum:
        - LOW_VALUE
        - TRUSTED_BENEFICIARY
      description: The Reason the transaction was exempted from SCA verification
    TransactionForex:
      type: object
      description: >-
        Foreign exchange details when the transaction involved currency
        conversion.
      properties:
        originalAmount:
          description: >-
            The original amount in the source or merchant currency before
            conversion.
          $ref: '#/components/schemas/CurrencyAmount'
        exchangeRate:
          description: The exchange rate applied to the conversion.
          $ref: '#/components/schemas/ScaledAmount'
        paddingAmount:
          description: The forex padding amount held during authorisation.
          $ref: '#/components/schemas/CurrencyAmount'
        feeAmount:
          description: The forex markup fee amount.
          $ref: '#/components/schemas/CurrencyAmount'
    OutgoingWireTransferType:
      type: string
      description: The wire transfer rails used, from SEPA, Faster Payments, SWIFT or RIX.
      enum:
        - SEPA
        - FASTER_PAYMENTS
        - SWIFT
        - RIX
    OutgoingWireTransferRejectedInfo:
      description: >
        Additional info when the outgoing wire transfer has been rejected, as
        follows:
          - SYSTEM: The wire transfer was rejected by the system.
          - USER: The wire transfer was rejected by the user.
      type: string
      enum:
        - SYSTEM
        - USER
    OutgoingWireTransferValidationOutcome:
      type: object
      required:
        - category
        - categoryResult
      properties:
        category:
          type: string
          enum:
            - UK_CONFIRMATION_OF_PAYEE
            - SEPA_VERIFICATION_OF_PAYEE
        categoryResult:
          oneOf:
            - $ref: '#/components/schemas/UKConfirmationOfPayeeResult'
            - $ref: '#/components/schemas/SEPAVerificationOfPayeeResult'
    OutgoingWireTransferUpdateBeneficiaryNameConflictSchemaErrorCode:
      type: string
      enum:
        - INVALID_STATE
        - CONFLICT_BENEFICIARYID_NAME
        - CONFLICT_EXTERNALACCOUNTID_NAME
        - MODEL_CONSTRAINTS_VIOLATED
        - NO_NAME_TO_ACCEPT
    OutgoingWireTransferPaymentConfirmationConflictErrorCode:
      type: string
      enum:
        - TRANSFER_NOT_COMPLETED
    CorrespondentBankingOwtValidationOutcome:
      type: object
      required:
        - category
        - categoryResult
      properties:
        category:
          type: string
          enum:
            - SEPA_VERIFICATION_OF_PAYEE
            - UK_CONFIRMATION_OF_PAYEE
        categoryResult:
          oneOf:
            - $ref: '#/components/schemas/SEPAVerificationOfPayeeResult'
            - $ref: '#/components/schemas/UKConfirmationOfPayeeResult'
    BeneficiaryOperationBatchId:
      required:
        - batchId
        - operation
      type: object
      properties:
        batchId:
          description: The unique identifier of a Beneficiary.
          type: string
          pattern: ^[0-9]+$
        operation:
          description: Describes the operation that has occurred on a beneficiary batch.
          $ref: '#/components/schemas/BeneficiaryBatchOperation'
    BeneficiaryState:
      type: string
      enum:
        - INITIALISED
        - INVALID
        - PENDING_CHALLENGE
        - CHALLENGE_FAILED
        - ACTIVE
        - REMOVED
    BeneficiaryValidationFailure:
      type: string
      enum:
        - INSTRUMENT_DETAILS_NOT_FOUND
        - BENEFICIARY_DETAILS_ALREADY_EXIST
        - BENEFICIARY_BELONGS_TO_SAME_IDENTITY
    TransactionActivityItem:
      type: object
      required:
        - id
        - type
        - status
        - amount
        - instrument
        - creationTimestamp
      description: >
        A transaction activity entry returned by the cross-instrument
        `/transactions` endpoint.

        Common fields are surfaced at the top level for easy filtering and
        sorting without inspecting

        the nested `transaction`. The full transaction object (Transfer, Send,
        OWT, CBT, IWT, CardPayment,

        FeeTransaction, SystemTransaction) is available under `transaction` for
        detailed consumption.
      properties:
        id:
          type: string
          pattern: ^[0-9]+$
          description: The transaction identifier.
        type:
          $ref: '#/components/schemas/TransactionActivityType'
        status:
          $ref: '#/components/schemas/TransactionActivityStatus'
        direction:
          $ref: '#/components/schemas/TransactionActivityDirection'
        amount:
          description: The primary transaction amount in the instrument's currency.
          $ref: '#/components/schemas/CurrencyAmount'
        instrument:
          description: The instrument this transaction belongs to.
          $ref: '#/components/schemas/InstrumentId'
        fee:
          description: The fee linked to this transaction, if any.
          $ref: '#/components/schemas/FeeSummary'
        creationTimestamp:
          type: integer
          format: int64
        lastUpdatedTimestamp:
          type: integer
          format: int64
        transaction:
          description: The full transaction object. Schema matches the value of `type`.
          oneOf:
            - $ref: '#/components/schemas/Transfer'
            - $ref: '#/components/schemas/Send'
            - $ref: '#/components/schemas/OutgoingWireTransfer'
            - $ref: '#/components/schemas/CorrespondentBankingOwt'
            - $ref: '#/components/schemas/IncomingWireTransfer'
            - $ref: '#/components/schemas/CardPayment'
            - $ref: '#/components/schemas/FeeTransaction'
            - $ref: '#/components/schemas/SystemTransaction'
    DateOfBirth:
      type: string
      format: date
      description: The date of birth in ISO 8601 format (YYYY-MM-DD).
    ExternalAccountType:
      type: string
      enum:
        - linked_accounts
    AddressWithNoRequiredFields:
      type: object
      description: The address, with none of the separate fields being set as required.
      properties:
        addressLine1:
          type: string
          description: The first line of the address.
        addressLine2:
          type: string
          description: The second line of the address.
        city:
          type: string
          description: The city of the address.
        postCode:
          maxLength: 10
          pattern: ^[A-Za-z0-9 -]*$
          type: string
          description: The post code associated with the address.
        state:
          maxLength: 50
          type: string
          description: The state of the address.
        country:
          maxLength: 2
          minLength: 2
          pattern: ^[A-Z]+$
          type: string
          description: The country of the address expressed in ISO 3166 alpha-2 format.
    AvailableToSpend:
      type: object
      properties:
        value:
          description: >-
            The amount and currency that is available to spend, (for the given
            interval).
          $ref: '#/components/schemas/CurrencyAmount'
        interval:
          $ref: '#/components/schemas/SpendLimitInterval'
    SupportedUserCurrency:
      enum:
        - JPY
        - BGN
        - CZK
        - DKK
        - HUF
        - PLN
        - RON
        - SEK
        - CHF
        - ISK
        - NOK
        - TRY
        - AUD
        - BRL
        - CAD
        - CNY
        - HKD
        - IDR
        - ILS
        - INR
        - KRW
        - MXN
        - MYR
        - NZD
        - PHP
        - SGD
        - THB
        - ZAR
        - EUR
        - USD
        - GBP
      type: string
    CommonLevelSpendRules:
      type: object
      properties:
        allowedMerchantCategories:
          type: array
          maxItems: 200
          items:
            type: string
          description: >-
            Whitelist MCC: A list of allowed merchant category codes (MCCs). If
            the MCC does not match, then the transaction will be declined. If an
            MCC is also in the blocked list, the blocked list will take
            precedence.
        blockedMerchantCategories:
          type: array
          maxItems: 200
          items:
            type: string
          description: >-
            Blacklist MCC: A list of disallowed merchant category codes (MCCs).
            If the MCC matches, then the transaction will be declined. If an MCC
            is also in the allowed list, the blocked list will take precedence.
        allowedMerchantIds:
          type: array
          maxItems: 200
          items:
            type: string
          description: >-
            Whitelist Merchant Id: A list of allowed merchant IDs. If the
            Merchant Id does not match, then the transaction will be declined.
            If a Merchant Id is also provided in the blocked list, the blocked
            list will take precedence.
        blockedMerchantIds:
          type: array
          maxItems: 200
          items:
            type: string
          description: >-
            Blacklist Merchant Id: A list of disallowed merchant IDs. If the
            Merchant Id matches, then the transaction will be declined. If a
            Merchant Id is also in the allowed list, the blocked list will take
            precedence.
        allowedMerchantCountries:
          type: array
          maxItems: 50
          items:
            maxLength: 2
            minLength: 2
            pattern: ^[A-Z]{2}$
            type: string
          description: >-
            Whitelist Merchant Country: A list of allowed merchant countries, in
            ISO 3166-1 alpha-2 format. If the Merchant country does not match,
            then the transaction will be declined. If a Merchant Country is also
            provided in the blocked list, the blocked list will take precedence.
        blockedMerchantCountries:
          type: array
          maxItems: 50
          items:
            maxLength: 2
            minLength: 2
            pattern: ^[A-Z]{2}$
            type: string
          description: >-
            Blacklist Merchant Country: A list of disallowed merchant countries,
            in ISO 3166-1 alpha-2 format. If the Merchant country matches, then
            the transaction will be declined. If a Merchant Country is also in
            the allowed list, the blocked list will take precedence.
        allowContactless:
          type: boolean
          description: Indicates if a contactless transaction is allowed on the card.
        allowAtm:
          type: boolean
          description: Indicates if an ATM Withdrawal transaction is allowed on the card.
        allowECommerce:
          type: boolean
          description: Indicates if an online transaction is allowed on the card.
        allowCashback:
          type: boolean
          description: >-
            Indicates if a cashback transaction at a physical terminal is
            allowed on the card.
        allowCreditAuthorisations:
          type: boolean
          description: Indicates if a the card can receive a credit transaction.
        rolloverPolicy:
          $ref: '#/components/schemas/RolloverPolicy'
    CorrespondentBankingBankAccountDetails:
      required:
        - account
        - financialInstitution
      type: object
      description: Bank account details for the originator.
      properties:
        account:
          type: string
          minLength: 1
          maxLength: 34
          pattern: ^[a-zA-Z0-9]{1,34}$
          description: >-
            Can be either an account number or an International Bank Account
            Number (IBAN).
        financialInstitution:
          type: string
          minLength: 8
          maxLength: 11
          pattern: ^[a-zA-Z0-9]{8,11}$
          description: >-
            Bank Identifier Code (BIC) of the originator's financial
            institution.
    CorrespondentBankingIndividualAddressAndIdInfo:
      required:
        - documentType
        - documentNumber
      type: object
      description: Personal identification for an individual originator.
      properties:
        documentType:
          type: string
          enum:
            - NATIONAL_ID
            - PASSPORT
            - TAX_ID
            - OTHER
          description: Type of personal identification document.
        documentNumber:
          type: string
          maxLength: 35
          description: Personal identification document number.
    CorrespondentBankingIndividualAddressAndBirthInfo:
      required:
        - dateOfBirth
        - placeOfBirth
      type: object
      description: Birth information for an individual originator.
      properties:
        dateOfBirth:
          type: string
          format: date
          description: Date of birth in YYYY-MM-DD format.
        placeOfBirth:
          type: string
          maxLength: 140
          description: Place of birth - city and country.
    CorrespondentBankingBusinessAddressAndIdInfo:
      required:
        - documentType
        - documentNumber
      type: object
      description: Business identification for a business originator.
      properties:
        documentType:
          type: string
          enum:
            - LEI
            - REGISTRATION_NUMBER
            - TAX_ID
            - OTHER
          description: Type of business identification document.
        documentNumber:
          type: string
          maxLength: 35
          description: >-
            Business identification document number (e.g. LEI code, company
            registration number).
    FeeSubtype:
      type: string
      description: >-
        The category of fee — indicates the activity or instrument-lifecycle
        event the fee relates to.
      enum:
        - fee_reversals
        - incoming_wire_fees
        - withdrawal_fees
        - purchase_fees
        - refund_fees
        - atm_withdrawal_fees
        - chargeback_fees
        - transfer_fees
        - send_fees
        - outgoing_wire_transfer_fees
        - custom_fees
        - other_fees
        - instrument_delete_fees
        - funds_redemption_fees
        - system_transaction_fees
    FeeTransactionStatus:
      type: string
      description: |
        Lifecycle status of a fee transaction:
          - PENDING: Fee accompanies a transaction that is still processing; it may still be cancelled.
          - COMPLETED: Fee was charged and posted to the instrument balance.
          - CANCELLED: Fee was cancelled before being charged.
          - REVERSED: Fee was previously charged and has been reversed.
      enum:
        - PENDING
        - COMPLETED
        - CANCELLED
        - REVERSED
    StatementResponseEntryTransaction:
      type: object
      required:
        - id
        - type
      description: >-
        Reference to the transaction this statement entry records. The concrete
        shape is identified by the `type` discriminator — see the per-type
        variants for the available subtypes.
      discriminator:
        propertyName: type
        mapping:
          card_payments: '#/components/schemas/StatementCardPaymentTransaction'
          transfers: '#/components/schemas/StatementTransferTransaction'
          sends: '#/components/schemas/StatementSendTransaction'
          outgoing_wire_transfers: '#/components/schemas/StatementOutgoingWireTransferTransaction'
          incoming_wire_transfers: '#/components/schemas/StatementIncomingWireTransferTransaction'
          correspondent_bank_transfers: '#/components/schemas/StatementCorrespondentBankTransferTransaction'
          fees: '#/components/schemas/StatementFeeTransaction'
          system_transactions: '#/components/schemas/StatementSystemTransaction'
      properties:
        id:
          type: string
          pattern: ^[0-9]+$
    MerchantCounterparty:
      type: object
      required:
        - name
      description: Counterparty for a card transaction — a merchant.
      properties:
        name:
          description: The name of the merchant.
          type: string
        id:
          description: The unique merchant identifier.
          type: string
        categoryCode:
          description: The ISO 18245 merchant category code.
          type: string
        country:
          description: ISO 3166-1 alpha-2 country code of the merchant terminal.
          type: string
        digitalWalletTypeUsed:
          description: >-
            The digital wallet (if any) used to initiate the card transaction at
            the merchant.
          $ref: '#/components/schemas/DigitalWalletType'
    InstrumentCounterparty:
      type: object
      required:
        - id
        - type
      description: >-
        Counterparty that is an internal platform instrument (managed account,
        managed card).
      properties:
        id:
          description: The unique identifier of the counterparty instrument.
          type: string
          pattern: ^[0-9]+$
        type:
          $ref: '#/components/schemas/InstrumentType'
        friendlyName:
          description: The friendly name of the counterparty instrument.
          type: string
        owner:
          description: The identity that owns the counterparty instrument.
          type: object
          properties:
            id:
              description: The identity identifier.
              type: string
              pattern: ^[0-9]+$
            type:
              description: The type of identity.
              type: string
              enum:
                - consumers
                - corporates
            name:
              description: The name of the identity.
              type: string
    BankAccountCounterparty:
      type: object
      description: Counterparty that is a bank account (for wire transfers).
      properties:
        name:
          description: The beneficiary or sender name.
          type: string
        iban:
          description: The IBAN of the bank account (SEPA/SWIFT).
          type: string
        sortCode:
          description: The UK sort code of the bank account (FasterPayments).
          type: string
        accountNumber:
          description: The UK account number of the bank account (FasterPayments).
          type: string
        bic:
          description: The BIC/SWIFT code of the bank (SEPA/SWIFT).
          type: string
        bankCode:
          description: >-
            Deprecated: legacy overloaded field carrying either the BIC or the
            sort code. Prefer bic/sortCode on new integrations.
          type: string
        reference:
          description: The sender or beneficiary reference.
          type: string
    StatementResponseEntryExecutingAccessInstrument:
      type: object
      required:
        - id
        - type
      description: >-
        The access instrument that initiated the transaction. The concrete shape
        is identified by the `type` discriminator.
      discriminator:
        propertyName: type
        mapping:
          managed_cards: '#/components/schemas/CardAccessInstrument'
          ibans: '#/components/schemas/IbanAccessInstrument'
      properties:
        id:
          description: The unique identifier of the access instrument.
          type: string
          pattern: ^[0-9]+$
    SystemTransactionSubtype:
      type: string
      description: The specific kind of system-generated transaction.
      enum:
        - account_closures
        - chargebacks_represented
        - chargebacks_won
        - manual_auth_expiries
        - negative_card_balances
        - balance_adjustments
        - lost_stolen_replacement_balance_transfers
    DeliveryTrackingCode:
      type: string
      description: >-
        The delivery tracking code for tracking the physical card's delivery
        status. This may not always be available on the first dispatched event,
        and so you will receive an additional dispatched notification with the
        delivery tracking code populated as soon as it is available.
    DeliveryTrackingMethod:
      type: string
      description: >-
        The delivery tracking method for tracking the physical card's delivery
        status.
    DeliveryTrackingUrl:
      type: string
      description: >-
        The delivery tracking URL for tracking the physical card's delivery
        status.
    CardPaymentAuthorisationEvent:
      description: >-
        An authorisation lifecycle event — the merchant asked the bank for
        funds, or an existing hold was adjusted / released. No money moves until
        clearing. Used inside `CardPayment.events[]`; the parent card payment
        provides `cardPaymentId`, `card`, and `merchant` so this lean variant
        doesn't repeat them. For a standalone version with that context
        attached, see `CardPaymentAuthorisationEventDetail`.
      allOf:
        - $ref: '#/components/schemas/CardPaymentEvent'
        - type: object
          required:
            - id
            - subtype
            - timestamp
          properties:
            id:
              type: string
              pattern: ^[0-9]+$
            subtype:
              type: string
              description: >-
                Card-scheme network classification of the underlying
                transaction, representing the type of activity the authorisation
                is for. Reversal-vs-original lives on the separate `reversal`
                field.
              enum:
                - sale_purchases
                - cash_withdrawals
                - sales_with_cashback
                - mail_or_telephone_orders
                - account_funding
            reversal:
              type: boolean
              description: >-
                True when this event is a reversal of a prior authorisation in
                the same lifecycle (e.g. merchant void, expiry, explicit
                cancellation). False for originals.
            result:
              description: >-
                Approved or declined by the issuer. Populated on originals;
                omitted on reversals.
              $ref: '#/components/schemas/CardPaymentEventResult'
            authorisationCategory:
              description: >-
                Pre-auth (provisional hold, will clear separately) or final auth
                (estimated amount equals final amount).
              $ref: '#/components/schemas/AuthorisationCategory'
            authForwardingDetails:
              description: >-
                When the card is configured for auth forwarding, the forwarding
                context for this event.
              $ref: '#/components/schemas/CardPaymentAuthForwardingDetails'
            declineReason:
              description: Present when `result` is `DECLINED`.
              $ref: '#/components/schemas/CardPaymentDeclineReason'
            authRuleFailedReason:
              type: string
              description: >-
                The specific auth rule that caused the decline. Present when
                `declineReason` is `AUTH_RULE_CHECKS_FAILED`. Mirrors the legacy
                authorisation webhook's `authRuleFailedReason`.
            cancellationReason:
              type: string
              maxLength: 255
              description: >-
                Free-text reason for an explicit cancellation of an
                authorisation hold. Populated on `reversal: true` events driven
                by explicit cancellation rather than network reversal.
            transactionAmount:
              description: >-
                The amount for this event, in the merchant's currency (ISO 8583
                DE 4).
              $ref: '#/components/schemas/CurrencyAmount'
            billingAmount:
              description: >-
                The amount applied to the card, in the card's currency (ISO 8583
                DE 6).
              $ref: '#/components/schemas/CurrencyAmount'
            forex:
              description: >-
                Auth-time FX context — `exchangeRate` and `padding`. Populated
                on cross-currency authorisations.
              $ref: '#/components/schemas/CardPaymentForex'
            userAmount:
              description: >-
                Presentation-only amount to be shown to the cardholder in their
                app. The `userAmount` will only differ from the `billingAmount`
                if a `userCurrency` was set for the card during card creation.
              $ref: '#/components/schemas/CurrencyAmount'
            userExchangeRate:
              description: >-
                Rate applied to convert `transactionAmount` into `userAmount`.
                Presentation-only.
              $ref: '#/components/schemas/ScaledAmount'
            authCode:
              type: string
              description: >-
                Issuer authorisation code on this scheme message (ISO 8583 DE
                38). Echoed by subsequent settlement, refund, OCT messages in
                the same lifecycle.
            fees:
              type: array
              description: >-
                Fees applied as part of this specific event (e.g. interchange on
                a settlement, forex markup on an authorisation, chargeback fee
                on a dispute step).
              items:
                $ref: '#/components/schemas/CardPaymentFee'
            timestamp:
              type: integer
              format: int64
              description: >-
                When this event occurred at the point-of-interaction, Epoch
                millis.
            processedTimestamp:
              type: integer
              format: int64
              description: When this event was processed by the platform, Epoch millis.
    CardPaymentSettlementEvent:
      description: >-
        A settlement event — money actually moves between the cardholder's
        account and the merchant, or back the other way. *Visa Financial
        Transaction 0220 · Mastercard First Presentment 1240.*
      allOf:
        - $ref: '#/components/schemas/CardPaymentEvent'
        - type: object
          required:
            - id
            - subtype
            - settlementState
            - timestamp
          properties:
            id:
              type: string
              pattern: ^[0-9]+$
            subtype:
              type: string
              description: >-
                Card-scheme network classification of the underlying transaction
                being settled.
              enum:
                - sale_purchases
                - cash_withdrawals
                - sales_with_cashback
                - mail_or_telephone_orders
                - account_funding
            reversal:
              type: boolean
              description: >-
                True when this event reverses a prior settlement; funds return
                to the card. False for originals.
            settlementState:
              description: Processing state of this settlement on the platform.
              $ref: '#/components/schemas/CardPaymentSettlementState'
            transactionAmount:
              description: The amount cleared, in the merchant's currency (ISO 8583 DE 4).
              $ref: '#/components/schemas/CurrencyAmount'
            billingAmount:
              description: >-
                The amount billed against the card, in the card's currency (ISO
                8583 DE 6). May differ from any earlier authorisation due to
                final amount and forex movement.
              $ref: '#/components/schemas/CurrencyAmount'
            exchangeRate:
              description: Forex rate applied at clearing time.
              $ref: '#/components/schemas/ScaledAmount'
            userAmount:
              description: >-
                Presentation-only amount to be shown to the cardholder in their
                app. The `userAmount` will only differ from the `billingAmount`
                if a `userCurrency` was set for the card during card creation.
              $ref: '#/components/schemas/CurrencyAmount'
            userExchangeRate:
              description: >-
                Rate applied to convert `transactionAmount` into `userAmount`.
                Presentation-only.
              $ref: '#/components/schemas/ScaledAmount'
            authCode:
              type: string
              description: >-
                Issuer authorisation code (ISO 8583 DE 38) echoed from the
                originating authorisation.
            fees:
              type: array
              description: >-
                Fees applied as part of this specific event (e.g. interchange on
                a settlement, forex markup on an authorisation, chargeback fee
                on a dispute step).
              items:
                $ref: '#/components/schemas/CardPaymentFee'
            timestamp:
              type: integer
              format: int64
              description: When this settlement event occurred, Epoch millis.
            processedTimestamp:
              type: integer
              format: int64
              description: When this event was processed by the platform, Epoch millis.
    CardPaymentRefundEvent:
      description: A refund credited to the card, tied to an earlier purchase.
      allOf:
        - $ref: '#/components/schemas/CardPaymentEvent'
        - type: object
          required:
            - id
            - timestamp
          properties:
            id:
              type: string
              pattern: ^[0-9]+$
            reversal:
              type: boolean
              description: >-
                True when this event reverses a prior refund (money was returned
                to the cardholder and is now being clawed back). False for an
                original refund credit.
            subtype:
              type: string
              description: >-
                Card-scheme network classification of the refund.
                Reversal-vs-original lives on the separate `reversal` field.
              enum:
                - purchase_refunds
                - purchase_refund_reversals
            reasonCode:
              type: string
              description: >-
                Network reason code accompanying the event, when provided by the
                scheme.
            transactionAmount:
              description: The amount credited / reversed, in the merchant's currency.
              $ref: '#/components/schemas/CurrencyAmount'
            billingAmount:
              description: The amount applied to the card, in the card's currency.
              $ref: '#/components/schemas/CurrencyAmount'
            exchangeRate:
              description: >-
                Forex rate applied to convert `transactionAmount` into
                `billingAmount`.
              $ref: '#/components/schemas/ScaledAmount'
            userAmount:
              description: >-
                Presentation-only amount to be shown to the cardholder in their
                app. The `userAmount` will only differ from the `billingAmount`
                if a `userCurrency` was set for the card during card creation.
              $ref: '#/components/schemas/CurrencyAmount'
            userExchangeRate:
              description: >-
                Rate applied to convert `transactionAmount` into `userAmount`.
                Presentation-only.
              $ref: '#/components/schemas/ScaledAmount'
            authCode:
              type: string
              description: >-
                Issuer authorisation code (ISO 8583 DE 38) echoed from the
                originating authorisation.
            fees:
              type: array
              description: >-
                Fees applied as part of this specific event (e.g. interchange on
                a settlement, forex markup on an authorisation, chargeback fee
                on a dispute step).
              items:
                $ref: '#/components/schemas/CardPaymentFee'
            timestamp:
              type: integer
              format: int64
              description: When this event occurred, Epoch millis.
            processedTimestamp:
              type: integer
              format: int64
              description: When this event was processed by the platform, Epoch millis.
    CardPaymentOriginalCreditEvent:
      description: >-
        A push credit to the card not tied to a prior purchase. *Visa Original
        Credit Transaction (OCT) · Mastercard MoneySend.*
      allOf:
