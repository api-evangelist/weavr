    MultipleSCAChallengeConflict:
      description: Conflict
      content:
        application/json:
          schema:
            type: object
            properties:
              errorCode:
                description: |
                  Error codes:
                    * `STATE_INVALID` - The operation no longer requires additional verification, it was either cancelled or completed.
                    * `CHANNEL_NOT_SUPPORTED` - The channel selected cannot be used to verify this type of operation.
                    * `CHANNEL_NOT_REGISTERED` - The channel selected must be enrolled to receive one-time passwords before it can be used to verify this type of operation.
                    * `RETRY_IN_15_SECS` - The endpoint can be called again in 15 seconds. Once called successfully, a new SMS will be sent (with a different OTP to the original SMS).
                    * `CHALLENGE_LIMIT_EXCEEDED` - No more SMS OTPs can be requested. If verification was not completed, the original action must be started again from the beginning.
                type: string
                enum:
                  - STATE_INVALID
                  - CHANNEL_NOT_SUPPORTED
                  - CHANNEL_NOT_REGISTERED
                  - RETRY_IN_15SEC
                  - CHALLENGE_LIMIT_EXCEEDED
