  /v1/payment_runs/{payment_run_id}/fund:
    get:
      description: >-
        Start the the funding process of a payment run.


        Specify the funding source of the payment run by providing an id to an
        already linked account.


        Depending on the maximum payment amount constraints imposed by the bank
        that is providing the account, the payment run may be split in 2 or more
        groups. Note that you'll need to complete a funding process for each
        instruction returned.



        Required user role: `CONTROLLER`
      operationId: getPaymentRunsIdFund
      summary: Get a payment run funding instructions
      tags:
        - Payment runs
      parameters:
        - name: payment_run_id
          in: path
          required: true
          description: The unique identifier of the payment run.
          schema:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
            readOnly: true
        - name: linkedAccountIds
          in: query
          required: true
          description: >
            The unique identifier of the linked account, that is to be used as
            the funding source for the payment run. 


            *Note that only one linked account per currency is supported.*
          schema:
            type: array
            uniqueItems: true
            items:
              type: string
              pattern: ^[0-9a-fA-F]{24}$
              example: 652d25b73541d8084a88a38d
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                title: PaymentRunFundingInstructions
                allOf:
                  - type: object
                    title: PaginationFields
                    properties:
                      count:
                        type: integer
                        description: >-
                          The total number of records (excluding the paging
                          limit)
                        example: 10
                      responseCount:
                        type: integer
                        description: >-
                          The total number of records returned in this response
                          (always capped at 100).
                        example: 100
                    required:
                      - count
                      - responseCount
                  - type: object
                    properties:
                      fundingInstructions:
                        type: array
                        description: >-
                          One or more instructions required to fund the payment
                          run
                        items:
                          type: object
                          required:
                            - reference
                            - totalAmount
                            - status
                            - payments
                          properties:
                            reference:
                              type: string
                              description: >-
                                The reference to be used to initialise the PIS
                                UX Component
                            totalAmount:
                              description: >-
                                The total amount of the group of payments in the
                                currency of the group.
                              required:
                                - currency
                                - amount
                              type: object
                              properties:
                                currency:
                                  type: string
                                  description: The currency expressed in ISO-4217 code.
                                  maxLength: 3
                                  minLength: 3
                                  enum:
                                    - GBP
                                    - EUR
                                amount:
                                  type: integer
                                  format: int64
                                  example: 454321
                                  description: >
                                    The monetary amount, scaled to the lowest
                                    denomination of the currency.


                                    Example, an amount of 1000 for a GBP
                                    currency is actually 1000 pennies or GBP
                                    10.00.
                            status:
                              type: string
                              description: The status of the funding instruction
                              enum:
                                - PENDING_FUNDING
                                - AWAITING_FUNDS
                                - CANCELLED
                                - EXECUTING
                                - COMPLETED
                                - COMPLETED_WITH_ERRORS
                            fundingDate:
                              type: string
                              format: date-time
                              description: The date of when the group was funded
                            payments:
                              type: array
                              description: >-
                                The group of payments within the payment run
                                that are funded with this funding instruction
                              items:
                                type: object
                                title: Payment
                                required:
                                  - id
                                  - status
                                allOf:
                                  - type: object
                                    properties:
                                      id:
                                        type: string
                                        description: >-
                                          The unique identifier of the payment
                                          line
                                        readOnly: true
                                      status:
                                        type: string
                                        enum:
                                          - QUEUED
                                          - CANCELLED
                                          - COMPLETED
                                          - FAILED
                                          - PENDING_CHALLENGE
                                          - PENDING_CONFIRMATION
                                          - PENDING_FUNDING
                                          - RETURNED
                                          - AWAITING_FUNDS
                                          - EXECUTING
                                          - SCA_FAILED
                                        description: >
                                          The status of the payment


                                          - `QUEUED`: The payment run creation is
                                          an asynchronous process. This status
                                          indicates that the payment run is
                                          currently being validated

                                          - `PENDING_CHALLENGE`: Waiting for the
                                          payment run to complete the SCA
                                          challenge

                                          - `PENDING_FUNDING`: Pending until the
                                          necessary funds are initiated. Initiate
                                          the funding process via the
                                          `/payment_runs/{id}/fund` endpoint

                                          - `AWAITING_FUNDS`: Waiting for the
                                          required funds to be available to
                                          execute payment

                                          - `EXECUTING`: Payment is being executed
                                          and awaiting final status confirmation

                                          - `COMPLETED`: Payment executed
                                          successfully

                                          - `FAILED`: Payment executed, but failed

                                          - `CANCELLED`: Payment cancelled,
                                          because payment run was cancelled

                                          - `PENDING_CONFIRMATION`: Payment run is
                                          pending confirmation by a `CONTROLLER`
                                          user

                                          - `RETURNED`: Payment sent, but was
                                          returned back

                                          - `SCA_FAILED`: Payment run failed due
                                          to SCA either expiring or max attempts
                                          reached. You can restart the payment run
                                          by calling the
