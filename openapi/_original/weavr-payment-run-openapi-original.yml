    patch:
      description: >-
        Update the details of a user identified by the user_id in the the path
        parameter. After calling this endpoint you need to step-up ( issue a
        challenge /stepup/challenges/otp/{channel} ). More details on how to
        step-up a token can be found here
        [Step-Up](https://docs.weavr.io/payment-run/plugin-api/plugin-api-authentication-stepup/)..


        Only the fields that are specified in the request body will be updated.
        All other fields will remain unchanged.


        When patching a mobile number, the new mobile number should be enrolled
        for Additional Factors.



        Required user role: `ADMIN`
      summary: Update a user
      operationId: userUpdate
      tags:
        - Buyer Authorised Users
      parameters:
        - name: user_id
          in: path
          required: true
          description: The unique identifier for the user.
          schema:
            type: string
            pattern: ^[0-9]+$
            example: '110747174434373672'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: UserUpdate
              type: object
              properties:
                name:
                  maxLength: 20
                  type: string
                  description: The first name of the user.
                surname:
                  maxLength: 20
                  type: string
                  description: The last name of the user.
                email:
                  type: string
                  description: E-mail Address of the user
                  format: email
                mobile:
                  type: object
                  description: Mobile number of the user
                  required:
                    - number
                    - countryCode
                  properties:
                    countryCode:
                      maxLength: 6
                      minLength: 1
                      pattern: ^[\+][0-9]{1,5}$
                      type: string
                      description: >-
                        The country code of the Buyer's admin user mobile number
                        (e.g. +44).
                    number:
                      maxLength: 15
                      minLength: 1
                      pattern: ^[0-9]+$
                      type: string
                      description: >-
                        The mobile number of the Buyer's admin user - excluding
                        country code.
                dateOfBirth:
                  description: Date of birth of the authorised user.
                  type: object
                  required:
                    - year
                    - month
                    - day
                  properties:
                    year:
                      type: integer
                      format: int32
                      maximum: 2100
                      minimum: 1900
                    month:
                      type: integer
                      format: int32
                      maximum: 12
                      minimum: 1
                    day:
                      type: integer
                      format: int32
                      maximum: 31
                      minimum: 1
                roles:
                  type: array
                  minItems: 1
                  description: >
                    Roles define the level of access assigned to the user.


                    * `CREATOR`: Users assigned this role can create, view and
                    update payment runs.

                    * `CONTROLLER`: Users assigned this role can view and link
                    their company's bank accounts as well as fund payment runs.
                  items:
                    type: string
                    enum:
                      - CREATOR
                      - CONTROLLER
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - required:
                      - id
                      - email
                      - name
                      - surname
                      - buyerId
                      - active
                    type: object
                    properties:
                      id:
                        type: string
                        pattern: ^[0-9]+$
                        description: The unique identifier of the user.
                      buyerId:
                        type: string
                        pattern: ^[0-9]+$
                        description: The identifier for the identity.
                      name:
                        maxLength: 100
                        type: string
                        description: The first name of the user.
                      surname:
                        maxLength: 100
                        type: string
                        description: The last name of the user.
                      email:
                        type: string
                        description: E-mail Address of the user
                        format: email
                      mobile:
                        type: object
                        description: Mobile number of the user
                        required:
                          - number
                          - countryCode
                        properties:
                          countryCode:
                            maxLength: 6
                            minLength: 1
                            pattern: ^[\+][0-9]{1,5}$
                            type: string
                            description: >-
                              The country code of the Buyer's admin user mobile
                              number (e.g. +44).
                          number:
                            maxLength: 15
                            minLength: 1
                            pattern: ^[0-9]+$
                            type: string
                            description: >-
                              The mobile number of the Buyer's admin user -
                              excluding country code.
                      active:
                        type: boolean
                        description: >-
                          The state of the user. If the `active` attribute is
                          false, then the user will not be able to log in.
                      dateOfBirth:
                        description: Date of birth of the authorised user.
                        type: object
                        required:
                          - year
                          - month
                          - day
                        properties:
                          year:
                            type: integer
                            format: int32
                            maximum: 2100
                            minimum: 1900
                          month:
                            type: integer
                            format: int32
                            maximum: 12
                            minimum: 1
                          day:
                            type: integer
                            format: int32
                            maximum: 31
                            minimum: 1
                  - type: object
                    required:
                      - roles
                    properties:
                      roles:
                        type: array
                        minItems: 1
                        description: >
                          Roles define the level of access assigned to the user.


                          * `CREATOR`: Users assigned this role can create, view
                          and update payment runs.

                          * `CONTROLLER`: Users assigned this role can view and
                          link their company's bank accounts as well as fund
                          payment runs.
                        items:
                          type: string
                          enum:
                            - CREATOR
                            - CONTROLLER
                  - type: object
                    properties:
                      addedBy:
                        type: object
                        required:
                          - roleNames
                          - userId
                        properties:
                          rolesNames:
                            type: array
                            minItems: 1
                            description: >
                              Roles define the level of access assigned to the
                              user.


                              * `ADMIN`: Users assigned to this role can create
                              a business and ensure that systems and processes
                              are effectively managed.
                            items:
                              type: string
                              enum:
                                - ADMIN
                          userId:
                            type: string
                            pattern: ^[0-9]+$
                            description: >-
                              The unique identifier of the user who added this
                              user.
