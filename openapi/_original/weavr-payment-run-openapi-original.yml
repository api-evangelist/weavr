  /v1/login_with_password:
    post:
      operationId: acquireAuthToken
      description: >
        Authenticate a user with the `email` and `password` that they provided
        when registering.


        Given that the user credentials are correct, this returns a `token` that
        can then be used to authorise

        other secured operations. In case the password is expired, a temporary
        `token` is returned, which can be used

        solely for updating the password.


        The token returned is valid for 5 minutes from last activity.
      summary: Acquire auth token
      tags:
        - Tokens
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - email
                - password
              type: object
              properties:
                email:
                  type: string
                  description: E-mail Address of the user
                  format: email
                password:
                  type: object
                  description: >
                    The user's password or passcode used to log in a user.

                    Passwords must be:
                      - between 8 and 30 characters
                      - include a lowercase character
                      - include an uppercase character
                      - include a digit and a special character
                      - different from any of the 5 last such passwords used.

                    For non-PCI compliant integrations, the password submitted
                    must be **tokenised**.
                  required:
                    - value
                  properties:
                    value:
                      minLength: 1
                      maxLength: 100
                      type: string
                      format: password
      responses:
        '200':
          description: OK
          headers:
            request-ref:
