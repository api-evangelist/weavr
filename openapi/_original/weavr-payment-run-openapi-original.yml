x-webhooks:
  buyerKYBWatch:
    post:
      summary: Buyer KYB status update
      description: Notification that the KYB status of a buyer identity has been updated.
      operationId: webhook_buyer_kyb_watch
      security: []
      tags:
        - Buyers Webhooks
      parameters:
        - name: call-ref
          in: header
          description: >
            A call reference generated by the caller and unique to the caller

            to provide correlation between the caller and system with a maximum
            length

            of 255
          required: false
          style: simple
          explode: false
          schema:
            type: string
        - name: published-timestamp
          in: header
          description: >-
            The timestamp, expressed in Epoch timestamp using millisecond
            precision, when this event was published.
          required: true
          style: simple
          explode: false
          schema:
            type: integer
            format: int64
        - name: signature
          in: header
          description: >-
            The signature to verify the authenticity of this request.  This is
            the base64 hash (HmacSHA256) of the `published-timestamp` using your
            API key.
          required: true
          style: simple
          explode: false
          schema:
            type: string
        - name: signature-v2
          in: header
          description: >-
            The signature to verify the authenticity of this request.  This is
            the base64 hash (HmacSHA256) of the `call-ref` header, the request
            body, and the `published-timestamp` header, all concatenated without
            spaces, and signed using your API key.
          required: true
          style: simple
          explode: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum:
                    - buyerKYBWatch
                payload:
                  type: object
                  properties:
                    buyerId:
                      type: string
                      pattern: ^[0-9]+$
                      description: Id of the buyer.
                    status:
                      type: string
                      enum:
                        - NOT_STARTED
                        - INITIATED
                        - PENDING_REVIEW
                        - APPROVED
                        - REJECTED
                      description: Effective KYB status of the buyer.
                    details:
                      type: array
                      description: >-
                        Action which my be required to re-process kyb in case of
                        temporary rejections.
                      items:
                        type: string
                        enum:
                          - BUYER_DETAILS_UNSATISFACTORY
                          - ADMIN_USER_UNMATCHED_TO_DIRECTOR_OR_REPRESENTATIVE
                          - UNDEFINED_REQUIRED_INTERVENTION
                          - DOCUMENTS_UNSATISFACTORY
                          - SUPPLIED_DATA_AND_DOCUMENTS_MISMATCH
                          - LANGUAGE_IN_DOCUMENTS_UNSUPPORTED
                          - SELFIE_UNSATISFACTORY
                          - SELFIE_AND_DOCUMENTS_MISMATCH
                          - BENEFICIARY_DETAILS_UNSATISFACTORY
                          - REPRESENTATIVE_DETAILS_UNSATISFACTORY
                          - OTHER
                          - UNSUPPORTED_COUNTRY
                          - EXPIRED_KYC_DOCUMENTS
                    rejectionComment:
                      type: string
                      description: Reason shown to the user in case of temporary rejection.
                    ongoingStatus:
                      type: string
                      enum:
                        - NOT_STARTED
