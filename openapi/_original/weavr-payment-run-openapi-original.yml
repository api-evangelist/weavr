            A call reference generated by the caller and unique to the caller

            to provide correlation between the caller and system with a maximum
            length

            of 255
          required: false
          style: simple
          explode: false
          schema:
            type: string
        - name: published-timestamp
          in: header
          description: >-
            The timestamp, expressed in Epoch timestamp using millisecond
            precision, when this event was published.
          required: true
          style: simple
          explode: false
          schema:
            type: integer
            format: int64
        - name: signature
          in: header
          description: >-
            The signature to verify the authenticity of this request.  This is
            the base64 hash (HmacSHA256) of the `published-timestamp` using your
            API key.
          required: true
          style: simple
          explode: false
          schema:
            type: string
        - name: signature-v2
          in: header
          description: >-
            The signature to verify the authenticity of this request.  This is
            the base64 hash (HmacSHA256) of the `call-ref` header, the request
            body, and the `published-timestamp` header, all concatenated without
            spaces, and signed using your API key.
          required: true
          style: simple
          explode: false
          schema:
            type: string
      requestBody:
        description: Event triggered when the status of a payment run payment changes
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum:
                    - paymentRunGroupNotFunded
                payload:
                  allOf:
                    - type: object
                      properties:
                        paymentRunId:
                          type: string
                    - type: object
                      required:
                        - reference
                        - totalAmount
                        - status
                        - payments
                      properties:
                        reference:
                          type: string
                          description: >-
                            The reference to be used to initialise the PIS UX
                            Component
                        totalAmount:
                          description: >-
                            The total amount of the group of payments in the
                            currency of the group.
                          required:
                            - currency
                            - amount
                          type: object
                          properties:
                            currency:
                              type: string
                              description: The currency expressed in ISO-4217 code.
                              maxLength: 3
                              minLength: 3
                              enum:
                                - GBP
                                - EUR
                            amount:
                              type: integer
                              format: int64
                              example: 454321
                              description: >
                                The monetary amount, scaled to the lowest
                                denomination of the currency.


                                Example, an amount of 1000 for a GBP currency is
                                actually 1000 pennies or GBP 10.00.
                        status:
                          type: string
                          description: The status of the funding instruction
                          enum:
                            - PENDING_FUNDING
                            - AWAITING_FUNDS
                            - CANCELLED
                            - EXECUTING
                            - COMPLETED
                            - COMPLETED_WITH_ERRORS
                        fundingDate:
                          type: string
                          format: date-time
                          description: The date of when the group was funded
                        payments:
                          type: array
                          description: >-
                            The group of payments within the payment run that
                            are funded with this funding instruction
                          items:
                            type: object
                            title: Payment
                            required:
                              - id
                              - status
                            allOf:
                              - type: object
                                properties:
                                  id:
                                    type: string
                                    description: The unique identifier of the payment line
                                    readOnly: true
                                  status:
                                    type: string
                                    enum:
                                      - QUEUED
                                      - CANCELLED
                                      - COMPLETED
                                      - FAILED
                                      - PENDING_CHALLENGE
                                      - PENDING_CONFIRMATION
                                      - PENDING_FUNDING
                                      - RETURNED
                                      - AWAITING_FUNDS
                                      - EXECUTING
                                      - SCA_FAILED
                                    description: >
                                      The status of the payment


                                      - `QUEUED`: The payment run creation is an
                                      asynchronous process. This status
                                      indicates that the payment run is
                                      currently being validated

                                      - `PENDING_CHALLENGE`: Waiting for the
                                      payment run to complete the SCA challenge

                                      - `PENDING_FUNDING`: Pending until the
                                      necessary funds are initiated. Initiate
                                      the funding process via the
                                      `/payment_runs/{id}/fund` endpoint

                                      - `AWAITING_FUNDS`: Waiting for the
                                      required funds to be available to execute
                                      payment

                                      - `EXECUTING`: Payment is being executed
                                      and awaiting final status confirmation

                                      - `COMPLETED`: Payment executed
                                      successfully

                                      - `FAILED`: Payment executed, but failed

                                      - `CANCELLED`: Payment cancelled, because
                                      payment run was cancelled

                                      - `PENDING_CONFIRMATION`: Payment run is
                                      pending confirmation by a `CONTROLLER`
                                      user

                                      - `RETURNED`: Payment sent, but was
                                      returned back

                                      - `SCA_FAILED`: Payment run failed due to
                                      SCA either expiring or max attempts
                                      reached. You can restart the payment run
                                      by calling the /payment_runs/{id}/restart
                                      endpoint
                                    readOnly: true
                              - type: object
                                title: Payment
                                required:
                                  - amount
                                  - currency
                                  - reference
                                  - payee
                                  - paymentAmount
                                  - supplier
                                properties:
                                  externalRef:
                                    type: string
                                    example: c99cd66c-82fc-4a01-977b-61a2f5a247a1
                                    description: >-
                                      The unique identifier by which you
                                      identify the associated payable on your
                                      system.
                                  paymentRef:
                                    type: string
                                    example: c99cd66c-82fc-4a01-977b-61a2f5a247a1
                                    description: >-
                                      The unique identifier by which you
                                      identify this payment on your system.
                                  paymentAmount:
                                    description: >-
                                      The currency and amount to be paid to the
                                      supplier.
                                    allOf:
                                      - description: >-
                                          The object representing a monetary
                                          amount in a particular currency
                                        required:
                                          - currency
                                          - amount
                                        type: object
                                        properties:
                                          currency:
                                            type: string
                                            description: The currency expressed in ISO-4217 code.
                                            maxLength: 3
                                            minLength: 3
                                            enum:
                                              - GBP
                                              - EUR
                                          amount:
                                            type: integer
                                            format: int64
                                            example: 454321
                                            description: >
                                              The monetary amount, scaled to the
                                              lowest denomination of the currency.


                                              Example, an amount of 1000 for a GBP
                                              currency is actually 1000 pennies or GBP
                                              10.00.
                                      - type: object
                                        properties:
                                          amount:
                                            type: integer
                                            minimum: 1
                                  reference:
                                    type: string
                                    maxLength: 18
                                    minLength: 1
                                    pattern: ^[0-9a-zA-Z.-]{1,18}$
                                    description: >
                                      The long form description of the payment.
                                      This information is also shared with the
                                      supplier. The allowed length is dependent
                                      on the payment type:

                                      `SEPA` and `SWIFT` <= 35 characters

                                      `Faster Payments` <= 18 characters
                                  supplier:
                                    required:
                                      - bankAccountDetails
                                      - name
                                    type: object
                                    description: >-
                                      Represent the supplier bank account
                                      typically used in Outgoing Wire Transfer
                                      transactions.
                                    properties:
                                      name:
                                        type: string
                                        minLength: 1
                                        maxLength: 140
                                        pattern: >-
                                          ^[a-zA-Z0-9\/\-?:().,’+\s#=!"%&*<>;{@\r\n]*$
                                        description: >
                                          The supplier name. The allowed length
                                          and pattern is dependent on the
                                          `bankAccountDetails` type:

                                          * with `SepaBankDetails`: >= `1`
                                          character and <= `150` characters

                                          * with `FasterPaymentsBankDetails`: >=
                                          `1` character and <= `140` characters
                                          with a pattern of
                                          `^[a-zA-Z0-9\/\-?:().,’+\s#=!"%&*<>;{@\r\n]*$`

                                          (please note that the `’` symbol is the
                                          unicode value U+2019 (right single
                                          quotation mark) and not the unicode
                                          value U+0027 (apostrophe))
                                      address:
                                        maxLength: 150
                                        minLength: 1
                                        type: string
                                        description: The supplier's address.
                                      bankName:
                                        type: string
                                        description: The supplier's bank name.
                                      bankAddress:
                                        maxLength: 150
                                        minLength: 1
                                        type: string
                                        description: The supplier's bank address.
                                      bankCountry:
                                        type: string
                                        description: >-
                                          The supplier's bank country in ISO 3166
                                          alpha-2 format.
                                        maxLength: 2
                                        minLength: 2
                                        pattern: ^[A-Z]{2}$
                                      type:
                                        type: string
                                        description: >-
                                          The type of supplier account. Required
                                          only when FasterPaymentsBankDetails are
                                          specified.
                                        enum:
                                          - PERSONAL
                                          - BUSINESS
                                      bankAccountDetails:
                                        description: >-
                                          Details of the supplier bank account,
                                          depending on the type of transfer
                                          chosen.
                                        oneOf:
                                          - title: FasterPaymentsBankDetails
                                            required:
                                              - accountNumber
                                              - sortCode
                                            type: object
                                            description: >-
                                              Bank details used in case the wire
                                              transfer is executed over Faster
                                              Payments.
                                            properties:
                                              accountNumber:
                                                type: string
                                                minLength: 8
                                                maxLength: 8
                                                pattern: ^[0-9]{8}$
                                                description: >-
                                                  Account number, required for wire
                                                  transfer over Faster Payments.
                                              sortCode:
                                                type: string
                                                minLength: 6
                                                maxLength: 6
                                                pattern: ^[0-9]{6}$
                                                description: >-
                                                  Sort code, required for wire transfer
                                                  over Faster Payments.
                                              secondaryReference:
                                                type: string
                                                description: Secondary reference data if applicable.
                                          - title: SepaBankDetails
                                            required:
                                              - iban
                                            type: object
                                            description: >-
                                              Bank details used in case the wire
                                              transfer is executed over SEPA.
                                            properties:
                                              iban:
                                                type: string
                                                minLength: 15
                                                maxLength: 34
                                                pattern: ^[A-Z]{2}[0-9]{2}[A-Z0-9]{11,30}$
                                                description: >-
                                                  International Bank Account Number,
                                                  required for wire transfer over SEPA.
                                              bankIdentifierCode:
                                                type: string
                                                minLength: 8
                                                maxLength: 11
                                                pattern: >-
                                                  ^[a-zA-Z0-9]{4}[a-zA-Z]{2}[a-zA-Z0-9]{2}[a-zA-Z0-9]{0,3}$
                                                description: BIC, for wire transfer over SEPA.
                                  validationOutcomes:
                                    type: array
                                    items:
                                      type: object
                                      properties:
                                        category:
                                          type: string
                                          enum:
                                            - UK_CONFIRMATION_OF_PAYEE
                                        categoryResult:
                                          type: object
                                          properties:
                                            match:
                                              type: string
                                              description: >-
                                                The result of matching performed by the
                                                UK Confirmation of Payee responder
                                              enum:
                                                - EXACT_MATCH
                                                - CLOSE_MATCH
                                                - NO_MATCH
                                            reasonCode:
                                              type: string
                                              description: >
                                                The reason why the matching failed at
                                                the UK Confirmation of Payee responder:

                                                  - ANNM: The CoP responder confirms that the account `name` provided does not match;
                                                  - MBAM: The CoP responder indicates that the account `name` provided closely matches the actual account in its records, the actual account name is returned in the `accountName` field;
                                                  - BANM: The account `type` that the user specified is 'PERSONAL', but the CoP responder indicates that the actual account matching the `name` provided is actually BUSINESS;
                                                  - PANM: The account `type` that the user specified is 'BUSINESS', but the CoP responder indicates that the actual account matching the `name` provided is actually PERSONAL;
                                                  - BAMM: The account `type` that the user specified is 'PERSONAL', but the CoP responder indicates that an account closely matching the `name` provided is BUSINESS;
                                                  - PAMM: The account `type` that the user specified is 'BUSINESS', but the CoP responder indicates that an account closely matching the `name` provided is PERSONAL;
                                                  - AC01: The account does not exist in the CoP responders books, the `accountNumber` specified is likely incorrect; 
                                                  - IVCR: The CoP responder was unable to locate an account based on the `secondaryReference` field;
                                                  - ACNS: The account is not supported for CoP by the CoP responder;
                                                  - OPTO: The owner of the account has opted out of CoP service by the CoP responder;
                                                  - CASS: The account has been switched using the Current Account Switch Service;
                                                  - SCNS: The `sortCode` provided is not supported at endpoint;
                                              enum:
                                                - ANNM
                                                - MBAM
                                                - BANM
                                                - PANM
                                                - BAMM
                                                - PAMM
                                                - AC01
                                                - IVCR
                                                - ACNS
                                                - OPTO
                                                - CASS
                                                - SCNS
                                            accountName:
                                              type: string
                                              description: >-
                                                Returned when there is `match` is a
                                                `CLOSE_MATCH` and the `reasonCode` is
                                                MBAM, BAMM or PAMM
        required: true
      responses:
        '200':
          description: >-
            Return a 200 status to indicate that the data was received
            successfully
security:
  - apiKey: []
    authToken: []
components:
  schemas:
    IdentityId:
      type: object
      required:
        - type
        - id
      properties:
        type:
          enum:
            - CONSUMER
            - CORPORATE
          type: string
          description: Indicates the identity type.
        id:
          type: string
          pattern: ^[0-9]+$
          description: The identifier for the identity.
    Nonce:
      type: string
      description: A randomly generated one-time use code.
      minLength: 6
      maxLength: 6
      pattern: ^[0-9]*$
    PasswordInfo:
      type: object
      required:
        - buyerId
      description: Additional information related to the user's password.
      properties:
        buyerId:
          type: string
          pattern: ^[0-9]+$
          description: The buyer to which the user's password information belongs to.
        expiryDate:
          minimum: 0
          type: integer
          format: int64
          description: >-
            The millisecond timestamp indicating when the password will expire.
            If 0, then this password will not expire.
    SCAOtpChannel:
      type: string
      enum:
        - SMS
      description: '- "SMS": The one-time-password is sent as a text message'
    SensitivePassword:
      type: object
      description: >
        The user's password or passcode used to log in a user.

        Passwords must be:
          - between 8 and 30 characters
          - include a lowercase character
          - include an uppercase character
          - include a digit and a special character
          - different from any of the 5 last such passwords used.

        For non-PCI compliant integrations, the password submitted must be
        **tokenised**.
      required:
        - value
      properties:
        value:
          minLength: 1
          maxLength: 100
          type: string
          format: password
    TransactionState:
      type: string
      description: Status of the transaction.
      enum:
        - INITIALISED
        - COMPLETED
        - REJECTED
        - FAILED
        - PENDING
    UserId:
      type: string
      pattern: ^[0-9]+$
      example: '110747174434373672'
    VerificationCode:
      type: string
      description: >-
        A randomly generated one-time use code used to verify the user's email
        address or mobile number.
      minLength: 6
      maxLength: 6
      pattern: ^[0-9]+$
    BeneficiaryTrustLevel:
      type: string
      description: The value that determines whether a Supplier is trusted or not.
      enum:
        - TRUSTED
    BusinessSupplierType:
      required:
        - businessName
      type: object
      properties:
        businessName:
          type: string
          description: >
            The business supplier name. The allowed length and pattern is
            dependent on the `supplierDetails.bankAccountDetails` type:


            * with `SepaBankDetails`: >= `1` character and <= `150` characters


            * with `FasterPaymentsBankDetails`: >= `1` character and <= `140`
            characters with a pattern of
            `^[a-zA-Z0-9\/\-?:().,’+\s#=!"%&*<>;{@\r\n]*$`

            (please note that the `’` symbol is the unicode value U+2019 (right
            single quotation mark) and not the unicode value U+0027
            (apostrophe))
    ConsumerSupplierType:
      required:
        - fullName
      type: object
      properties:
        fullName:
          type: string
          description: >
            The person supplier name. The allowed length and pattern is
            dependent on the supplier details type:


            `BankAccountDetailsBeneficiary` with `SepaBankDetails`: >= `1`
            character and <= `150` characters


            `BankAccountDetailsBeneficiary` with `FasterPaymentsBankDetails`: >=
            `1` character and <= `140` characters with a pattern of
            `^[a-zA-Z0-9\/\-?:().,’+\s#=!"%&*<>;{@\r\n]*$`

            (please note that the `’` symbol is the unicode value U+2019 (right
            single quotation mark) and not the unicode value U+0027
            (apostrophe))
  securitySchemes:
    apiKey:
      name: api-key
      type: apiKey
      in: header
      description: >-
        The API Key representing your Weavr account. You can find your API Key
        in your Weavr Portal in the API Credentials page.
    authToken:
      type: http
      description: >-
        The authentication token representing the user. This will be included in
        the login response object.
      scheme: bearer
      bearerFormat: JWT
tags:
  - name: Payment runs
    description: >
      A Payment run contains a list of supplier payments. A Payment run can be 

      - created by a user with a `CREATOR` role 

      - confirmed by a user with a `CONTROLLER` role

      - funded by a user with a `CONTROLLER` role


      Note that the Controller user must have their mobile device enrolled to
      SCA. 


      Before a payment run can be executed, it must be funded. Users with the
      `CONTROLLER` role must link their company's bank account(s) that are
      represented as Linked Accounts, which than can be used as the funding
      source for a payment run.


      Depending on the bank's constraints it may not be possible to deposit the
      total amount of funds required for a payment run, in which case the
      payment run will be automatically split into funding groups. All funding
      groups must be funded and executed for the payment run to be marked as
      completed. 


      Note that even if the payment is created successfully, you still need to
      check its status in order to determine if it is `completed` or`failed`.
  - name: Payment runs Webhooks
    description: Notification that the Payment Run and payment statuses have been updated.
    x-displayName: Payment runs
  - name: Buyers
    description: >
      Buyers are identities representing a business


      Once on-boarded, Buyers can create payment runs and pay their suppliers in
      your application.
  - name: Linked Accounts
    description: >-
      Linked accounts represent bank accounts that the buyer has with other
      banks. Once set up, they are used to fund payment runs.
  - name: Institutions
    description: Institutions supported by Embedded Payment Run.
  - name: Buyers Webhooks
    description: >-
      Buyers are identities representing companies. Once on-boarded, Buyers can
      create and manage their own instruments via your application.
    x-displayName: Buyers
  - name: Access Webhooks
    description: Access
    x-displayName: Access
  - name: Tokens Webhooks
    description: Tokens webhooks
    x-displayName: Login
  - name: Stepup Webhooks
    description: Notification that a step-up has been completed or declined.
    x-displayName: Stepup
  - name: Authentication Factors Webhooks
    description: >-
      Notification of the Authentication Factors that are used for the
      `Identity`.
    x-displayName: Authentication Factors
  - name: Linked Accounts Webhooks
    description: Notification that the status of a Linked Account has been updated.
    x-displayName: Linked Accounts
  - name: Simulator
    description: >
      Simulators enable you to trigger processes in Sandbox that in Production
      are triggered from an external action rather than from your application.
      this way you can test scenarios that otherwise you would only encounter in
      the Live environment.


      *Note: These endpoints are only available on Sandbox and won’t work in the
      Live environment.*
  - name: Buyer Authorised Users
    description: >
      Buyers can invite authorised users to access their account. Once
      on-boarded, authorised users can transact on behalf of the identity they
      are on-boarded with.


      Authorised users are typically employees who have access to company's
      banking accounts.


      Note that `/users` endpoints are to be used only for performing operations
      related to authorised users - getting or updating the details of _admin_
      users is to be done via `/buyers` endpoints.
  - name: Transactions Webhooks
    description: Notification that the status of a transaction has been updated.
    x-displayName: Transactions
x-tagGroups:
  - name: Authentication
    tags:
      - Tokens
      - Passwords
  - name: Authorisation
    tags:
      - Additional Factors
      - Step up
  - name: Identities
    tags:
      - Buyers
      - Buyer Authorised Users
  - name: Payment runs
    tags:
      - Payment runs
  - name: Instruments
    tags:
      - Linked Accounts
  - name: Institutions
    tags:
      - Institutions
  - name: Simulators
    tags:
      - Simulator
  - name: Events
    tags:
      - Buyers Webhooks
      - Payment runs Webhooks
      - Linked Accounts Webhooks
      - Tokens Webhooks
      - Stepup Webhooks
      - Authentication Factors Webhooks
      - Transactions Webhooks
