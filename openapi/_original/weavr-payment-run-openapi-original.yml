                                type: string
                            fieldName:
                              type: string
                            error:
                              type: string
                              enum:
                                - REQUIRED
                                - HAS_TEXT
                                - REQUIRES
                                - SIZE
                                - RANGE
                                - IN
                                - NOT_IN
                                - REGEX
                                - EXACTLY
                                - AT_LEAST
                                - AT_MOST
                                - ALL_OR_NONE
        '401':
          description: Unauthorized - Your credentials or access token are invalid.
