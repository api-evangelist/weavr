                adminUser:
                  type: object
                  required:
                    - name
                    - surname
                    - email
                    - mobile
                    - companyPosition
                  description: >
                    The admin user needs to be a director or a legal
                    representative of the buyer that is being onboarded - this
                    user cannot be deactivated.


                    Admin users need to verify their email address and mobile
                    number, as well as complete KYC as part of the Buyer's due
                    diligence process.
