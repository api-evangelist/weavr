                    name:
                      type: string
                      maxLength: 50
                      description: The first name of the admin user.
                    surname:
                      type: string
                      maxLength: 50
                      description: The last name of the admin user.
                    email:
                      type: string
                      description: E-mail Address of the user
                      format: email
                    mobile:
                      type: object
                      description: Mobile number of the user
                      required:
