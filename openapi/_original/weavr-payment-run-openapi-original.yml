  /v1/users/{user_id}/invite:
    post:
      summary: Send a user invite
      operationId: userInviteSend
      tags:
        - Buyer Authorised Users
      description: >-
        Once a user is created using the _userCreate_ operation, the user needs
        to setup his/her password.


        An invitation needs to be sent to the user in order to be able to set up
        the password for the first time. The invitation email, which remains
        valid for 1 month, will contain a URL having all information required to
        setup the password via the _userInviteConsume_.



        Required user role: `ADMIN`
      parameters:
        - name: user_id
          in: path
          required: true
          description: The unique identifier for the user.
          schema:
            type: string
            pattern: ^[0-9]+$
            example: '110747174434373672'
        - in: header
          name: idempotency-ref
          description: >-
            A unique call reference generated by the caller that, taking into
            consideration the payload as well as the operation itself, helps
            avoid duplicate operations. Idempotency reference uniqueness is
            maintained for at least 24 hours.
          required: false
          schema:
            type: string
      responses:
