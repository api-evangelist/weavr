          description: The merchant state address (if available)
        merchantPostalCode:
          type: string
          description: The merchant postal code (if available)
        merchantCountry:
          type: string
          description: The merchant country address
        merchantTelephone:
          type: string
          description: The merchant telephone number
        merchantURL:
          type: string
          description: The merchant URL
        merchantNameOther:
          type: string
          description: The alternative merchant name
        merchantNetworkId:
          type: string
          description: The merchant's network id
        merchantContact:
          type: string
          description: The merchant's contact (if available)
    AuthorisationCategory:
      type: string
      description: The category of the authorisation.
      enum:
        - PRE_AUTH
        - FINAL_AUTH
    CardHolderPresent:
      type: string
      enum:
        - PRESENT
        - NOT_PRESENT
        - PRESENCE_UNKNOWN
    DigitalWalletDetails:
      type: object
      description: Contains information about the digital wallet, if it has been used.
      properties:
        digitalWalletType:
          $ref: '#/components/schemas/DigitalWalletType'
    UserCurrencyTransactionDetails:
      required:
        - userTransactionAmount
        - userExchangeRate
      type: object
      properties:
        userTransactionAmount:
          $ref: '#/components/schemas/CurrencyAmount'
        userExchangeRate:
          type: string
      description: >-
        The object representing the user transaction's currency, amount and
        rate.
    CardAuthorisationDetailsTransactionType:
      enum:
        - SALE_PURCHASE
        - MAIL_OR_TELEPHONE_ORDER
        - CASH_WITHDRAWAL
        - ORIGINAL_CREDIT_TRANSACTION
        - ACCOUNT_FUNDING_TRANSACTION
        - CASH_DISBURSEMENT
        - PURCHASE_REFUND
      type: string
    InstrumentState:
      type: string
      description: >
        The state of the instrument indicating what it can and cannot do as
        follows:
          - ACTIVE: The instrument is in an active state and can be used in transactions.
          - BLOCKED: The instrument is temporarily blocked and cannot be used. Any funds on the instrument are also frozen. The `blockedReason` provides more information as to why it was blocked.
          - DESTROYED: The instrument has been permanently destroyed. The `destroyReason` provides more information as to why it was destroyed.
          - NOT_ENABLED: The instrument is not enabled for use, since the linked user has not completed all necessary verification steps.
      enum:
        - ACTIVE
        - BLOCKED
        - DESTROYED
        - NOT_ENABLED
    BlockedReason:
      type: string
      description: |
        The reason why the instrument has been blocked:
          - USER: The root, or an authorised user, of the identity owning the instrument has temporarily blocked the instrument.
          - SYSTEM: The platform or an administrator of the platform has temporarily blocked the instrument.
          - LOST: The instrument has been blocked because it was marked as lost.
          - SINGLE_SPEND: The instrument has been automatically blocked after its first successful transaction (single-spend card).
      enum:
        - USER
        - SYSTEM
        - LOST
        - SINGLE_SPEND
    DestroyedReason:
      type: string
      description: |
        The reason why the instrument has been destroyed:
          - SYSTEM: The platform or an administrator of the platform has destroyed the instrument.
          - USER: The root, or an authorised user, of the identity owning the instrument has destroyed the instrument.
          - LOST: The instrument was automatically destroyed as it was marked as lost.
          - STOLEN: The instrument was automatically destroyed as it was marked as stolen.
          - EXPIRED: The instrument was automatically destroyed as it expired.
          - COMPROMISED: The instrument was automatically destroyed as it was marked as compromised.
          - SINGLE_SPEND: The instrument was automatically destroyed as it was a single-spend card that was used.
      enum:
        - SYSTEM
        - USER
        - LOST
        - STOLEN
        - EXPIRED
        - COMPROMISED
        - SINGLE_SPEND
    CurrencyAmount:
      required:
        - currency
        - amount
      type: object
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        amount:
          type: integer
          format: int64
          description: >
            The monetary amount, scaled to the lowest denomination of the
            currency.


            Example, an amount of 1000 for a EUR currency is actually 1000 Euro
            cents or EUR 10.00.
