openapi: 3.1.0
info:
  title: Weavr Webhook
  description: >-
    For Verification, create a base64 hash using HmacSHA256 using
    Published-Timestamp header as message and your API key as secret. The result
    should match the Signature header.
  contact:
    name: Weavr
    url: https://weavr.io
  version: v2
  x-logo:
    url: https://storage.googleapis.com/weavr-cdn/weavr_logo-new.png
    backgroundColor: '#FFFFFF'
    altText: Weavr
servers:
  - url: '""'
x-tagGroups:
  - name: Webhooks
    tags:
      - Corporates
      - Consumers
      - Managed Cards
      - Managed Accounts
      - Transfers
      - Sends
      - Outgoing Wire Transfers
      - Correspondent Bank Transfers
      - Manual Transactions
      - Fees
      - Login
      - Stepup
      - Authentication Factors
      - Trusted Payees
      - Bulk Operations
      - Authorised Users
components:
  parameters:
    call-ref:
      description: >-
        A call reference generated by the caller and unique to the caller to
        provide correlation between the caller and system with a maximum length
        of 255
      in: header
      name: call-ref
      required: false
      schema:
        type: string
    published-timestamp:
      name: published-timestamp
      in: header
      description: >-
        The timestamp, expressed in Epoch timestamp using millisecond precision,
        when this event was published.
      required: true
      style: simple
      explode: false
      schema:
        type: integer
        format: int64
    signature:
      name: signature
      in: header
      description: >-
        The signature to verify the authenticity of this request.  This is the
        base64 hash (HmacSHA256) of the `published-timestamp` using your API
        key.
      required: true
      style: simple
      explode: false
      deprecated: true
      schema:
        type: string
    signature-v2:
      name: signature-v2
      in: header
      description: >-
        The signature to verify the authenticity of this request.  This is the
        base64 hash (HmacSHA256) of the `call-ref + payload +
        published-timestamp` using your API key.
      required: true
      style: simple
      explode: false
      schema:
        type: string
    request-ref:
      name: request-ref
      in: header
      description: >-
        A unique call reference included in every call, that enables the
        receiver to avoid duplicate handling of a webhook request (e.g. webhook
        was resent).
      required: false
      schema:
        type: string
  schemas:
    KybEvent:
      type: object
      properties:
        corporateId:
          type: string
          pattern: ^[0-9]+$
          description: Id of the corporate.
        corporateEmail:
          type: string
          description: Email of the corporate.
        status:
          $ref: '#/components/schemas/KyiStatus'
          description: Effective KYB status of the corporate.
        details:
          type: array
          description: >-
            Action which my be required to re-process kyb in case of temporary
            rejections.
          items:
            $ref: '#/components/schemas/CorporateKybFailureReason'
        rejectionComment:
          type: string
          description: Reason shown to the user in case of temporary rejection.
        ongoingStatus:
          $ref: '#/components/schemas/KyiStatus'
          description: Ongoing KYB Status of the corporate.
    CorporateKybFailureReason:
      type: string
      enum:
        - UNDEFINED_REQUIRED_INTERVENTION
        - DOCUMENTS_UNSATISFACTORY
        - SUPPLIED_DATA_AND_DOCUMENTS_MISMATCH
        - LANGUAGE_IN_DOCUMENTS_UNSUPPORTED
        - SELFIE_UNSATISFACTORY
        - SELFIE_AND_DOCUMENTS_MISMATCH
        - CORPORATE_DETAILS_UNSATISFACTORY
        - BENEFICIARY_DETAILS_UNSATISFACTORY
        - REPRESENTATIVE_DETAILS_UNSATISFACTORY
        - OTHER
        - ROOT_USER_UNMATCHED_TO_DIRECTOR_OR_REPRESENTATIVE
        - UNSUPPORTED_COUNTRY
        - EXPIRED_KYC_DOCUMENTS
    BeneficiaryVerifiedEvent:
      type: object
      properties:
        event:
          type: array
          description: >
            The event that triggered this webhook notification. The event

            is structured to describe the parameter that has triggered the event
            followed

            by the action that occurred.
          items:
            $ref: '#/components/schemas/BeneficiaryEventType'
        eventDetails:
          type: array
          description: A reason, if any, describing why this event has occurred.
          items:
            $ref: '#/components/schemas/CorporateKybFailureReason'
        additionalInformation:
          $ref: '#/components/schemas/BeneficiaryVerifiedEventAdditionalInformation'
          description: >-
            Additional information related to the event triggering this
            notification.
        rejectionComment:
          type: string
          description: Reason shown to the user in case of temporary rejection.
    BeneficiaryEventType:
      type: string
      enum:
        - STATUS_UPDATED
        - BENEFICIARY_TYPE_UPDATED
        - FIRST_NAME_UPDATED
        - MIDDLE_NAME_UPDATED
        - LAST_NAME_UPDATED
        - EMAIL_UPDATED
    BeneficiaryVerifiedEventAdditionalInformation:
      type: object
      properties:
        corporateId:
          type: string
          pattern: ^[0-9]+$
          description: The corporate id whose beneficiary has triggered this event.
        corporateName:
          type: string
          description: The corporate name whose beneficiary has triggered this event.
        rootUserEmail:
          type: string
          description: The corporate's root user email.
        kybStatus:
          $ref: '#/components/schemas/KyiStatus'
          description: >-
            The status of the Full Company Verification Checks for the corporate
            entity.
        beneficiary:
          $ref: '#/components/schemas/BeneficiaryInfo'
        documentExpiryDate:
          type: string
          pattern: ^[0-9]+$
          description: Epoch timestamp using millisecond precision.
        identityRestrictionDate:
          type: string
          pattern: ^[0-9]+$
          description: Epoch timestamp using millisecond precision.
    KycEventAdditionalInformation:
      type: object
      properties:
        documentExpiryDate:
          type: string
          pattern: ^[0-9]+$
          description: Epoch timestamp using millisecond precision.
        identityRestrictionDate:
          type: string
          pattern: ^[0-9]+$
          description: Epoch timestamp using millisecond precision.
    BeneficiaryInfo:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/BeneficiaryType'
          description: Type of the beneficiary.
        firstName:
          type: string
          description: First name of the beneficiary.
        middleName:
          type: string
          description: Middle name of the beneficiary.
        lastName:
          type: string
          description: Last name of the beneficiary.
        email:
          type: string
          description: Email of the beneficiary.
        status:
          $ref: '#/components/schemas/KyiStatus'
          description: Effective KYB Status of the beneficiary.
        ongoingKybStatus:
          $ref: '#/components/schemas/KyiStatus'
          description: Ongoing KYB Status of the beneficiary.
    KyiStatus:
      type: string
      enum:
        - UNDEFINED
        - NOT_STARTED
        - INITIATED
        - PENDING_REVIEW
        - APPROVED
        - REJECTED
    BeneficiaryValidationFailure:
      type: string
      enum:
        - INSTRUMENT_DETAILS_NOT_FOUND
        - BENEFICIARY_DETAILS_ALREADY_EXIST
        - BENEFICIARY_BELONGS_TO_SAME_IDENTITY
        - BENEFICIARY_VALIDATION_FAILURE_UNKNOWN
    BeneficiaryType:
      type: string
      enum:
        - UNDEFINED_BENEFICIARY_TYPE
        - UBO
        - DIRECTOR
        - UNKNOWN
        - SHAREHOLDER
        - PARTNER
        - OTHER_DIRECTOR
    IdentityActivatedEvent:
      required:
        - actionDoneBy
        - emailAddress
      type: object
      properties:
        actionDoneBy:
          $ref: '#/components/schemas/ActionDoneBy'
        emailAddress:
          type: string
    ActionDoneBy:
      type: string
      enum:
        - UNDEFINED
        - ADMIN
        - INNOVATOR
    IdentityDeactivatedEvent:
      required:
        - actionDoneBy
        - emailAddress
        - reasonCode
      type: object
      properties:
        actionDoneBy:
          $ref: '#/components/schemas/ActionDoneBy'
        emailAddress:
          type: string
        reasonCode:
          $ref: '#/components/schemas/IdentityDeactivatedReasonCode'
    IdentityDeactivatedReasonCode:
      type: string
      enum:
        - UNDEFINED_REASON
        - ACCOUNT_REVIEW
        - ACCOUNT_SECURITY
        - TEMPORARY
        - ACCOUNT_CLOSURE
        - ACCOUNT_ABANDONED
    KycEvent:
      type: object
      properties:
        consumerId:
          type: string
          pattern: ^[0-9]+$
        consumerEmail:
          type: string
        status:
          $ref: '#/components/schemas/KyiStatus'
        details:
          type: array
          description: >-
            Action which my be required to re-process kyc in case of temporary
            rejections.
          items:
            $ref: '#/components/schemas/KycRejectionReason'
        rejectionComment:
          type: string
          description: Reason shown to the user in case of temporary rejection.
        kycLevel:
          $ref: '#/components/schemas/KycLevel'
        ongoingStatus:
          $ref: '#/components/schemas/KyiStatus'
        ongoingKycLevel:
          $ref: '#/components/schemas/KycLevel'
        eventTimestamp:
          type: string
          pattern: ^[0-9]+$
          description: Epoch timestamp using millisecond precision.
        additionalInformation:
          $ref: '#/components/schemas/KycEventAdditionalInformation'
          description: >-
            Additional information related to the event triggering this
            notification.
    KycRejectionReason:
      type: string
      enum:
        - UNDEFINED_KYC_FAILURE_REASON
        - DOCUMENTS_UNSATISFACTORY
        - SUPPLIED_DATA_AND_DOCUMENTS_MISMATCH
        - LANGUAGE_IN_DOCUMENTS_UNSUPPORTED
        - SELFIE_UNSATISFACTORY
        - SELFIE_AND_DOCUMENTS_MISMATCH
        - OTHER
        - UNSUPPORTED_COUNTRY
        - PEP_STATUS
        - REJECTED_DUPLICATE
        - EXPIRED_KYC_DOCUMENTS
    IbanEvent:
      required:
        - iban
        - publishedTimestamp
        - type
      type: object
      properties:
        iban:
          $ref: '#/components/schemas/IbanInstrument'
        publishedTimestamp:
          type: string
          pattern: ^[0-9]+$
          description: Epoch timestamp using millisecond precision.
        type:
          $ref: '#/components/schemas/IbanEventType'
    LinkedAccountEvent:
      required:
        - linkedAccount
        - publishedTimestamp
        - eventType
      type: object
      properties:
        linkedAccount:
          $ref: '#/components/schemas/LinkedAccount'
        publishedTimestamp:
          type: string
          pattern: ^[0-9]+$
          description: Epoch timestamp using millisecond precision.
        eventType:
          description: >
            The type of event that occurred related to the linked account.
            Possible values are:
              - **PENDING_VERIFICATION**: The linked account is pending verification.
              - **VERIFIED**: The overall verification run was successfully completed. The linked account is now verified.
              - **BLOCKED**: The linked account has been blocked.
              - **UNBLOCKED**: The linked account has been unblocked.
              - **REMOVED**: The linked account has been removed.
              - **REJECTED**: The linked account was rejected.
          $ref: '#/components/schemas/LinkedAccountEventType'
    ManagedAccountEvent:
      required:
        - account
        - publishedTimestamp
        - type
      type: object
      properties:
        account:
          $ref: '#/components/schemas/LegacyManagedAccount'
        publishedTimestamp:
          type: string
          pattern: ^[0-9]+$
          description: Epoch timestamp using millisecond precision.
        type:
          $ref: '#/components/schemas/ManagedAccountEventType'
    ManagedAccountLowBalanceEvent:
      required:
        - id
        - currency
        - availableBalance
        - publishedTimestamp
      type: object
      properties:
        id:
          $ref: '#/components/schemas/InstrumentId'
        currency:
          $ref: '#/components/schemas/Currency'
        availableBalance:
          type: integer
          format: int64
        publishedTimestamp:
          type: string
          pattern: ^[0-9]+$
          description: Epoch timestamp using millisecond precision.
    LegacyManagedAccount:
      required:
        - creationTimestamp
        - currency
        - friendlyName
        - id
        - owner
        - profileId
      type: object
      properties:
        id:
          $ref: '#/components/schemas/InstrumentId'
        profileId:
          type: string
          pattern: ^[0-9]+$
        tag:
          maxLength: 50
          pattern: ^$|^[a-zA-Z0-9_-]+$
          type: string
        owner:
          $ref: '#/components/schemas/StringWrappedTypeId'
        friendlyName:
          maxLength: 50
          minLength: 1
          type: string
        active:
          type: boolean
        currency:
          $ref: '#/components/schemas/Currency'
        balances:
          type: object
          properties:
            availableBalance:
              type: string
              pattern: ^[0-9]+$
            actualBalance:
              type: string
              pattern: ^[0-9]+$
        state:
          $ref: '#/components/schemas/InstrumentStateLegacy'
        creationTimestamp:
          type: string
          pattern: ^[0-9]+$
          description: Epoch timestamp using millisecond precision.
        bankAccountDetails:
          $ref: '#/components/schemas/BankAccountDetails'
          description: >-
            The bank account details to be used when loading funds to this
            managed account.
    LegacyCurrencyAmount:
      required:
        - currency
        - amount
      type: object
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        amount:
          type: string
          pattern: ^[0-9]+$
          description: >-
            The monetary amount, scaled to the lowest denomination of the
            currency.
      description: The object representing a monetary amount in a particular currency.
    InstrumentStateLegacy:
      type: object
      properties:
        blockTypes:
          type: object
          additionalProperties:
            type: integer
            format: int32
        destroyType:
          type: string
    BankAccountDetails:
      type: object
      properties:
        beneficiary:
          type: string
        address:
          type: string
        beneficiaryBank:
          type: string
        bankIdentifierCode:
          type: string
        iban:
          type: string
        accountNumber:
          type: string
        sortCode:
          type: string
        paymentReference:
          type: string
          description: >-
            A reference required by the partner bank to execute a load on this
            managed account.
    IbanEventType:
      type: string
      enum:
        - CREATED
        - UPDATED
        - REQUESTED
        - REJECTED
        - BLOCKED
        - UNBLOCKED
        - DESTROYED
    ManagedAccountEventType:
      type: string
      enum:
        - CREATED
        - UPDATED
        - REQUESTED
        - REJECTED
        - BLOCKED
        - UNBLOCKED
        - DESTROYED
    LinkedAccountEventType:
      type: string
      enum:
        - PENDING_VERIFICATION
        - VERIFIED
        - BLOCKED
        - UNBLOCKED
        - REMOVED
        - REJECTED
    ManagedAccountsDepositEvent:
      required:
        - id
        - owner
        - transactionAmount
        - transactionId
        - transactionTimestamp
      type: object
      properties:
        id:
          $ref: '#/components/schemas/InstrumentId'
          description: >-
            The id of the managed account where an incoming wire transfer has
            been received.
        transactionId:
          type: string
          pattern: ^[0-9]+$
          description: The id of the transaction, for reference.
        transactionAmount:
          $ref: '#/components/schemas/LegacyCurrencyAmount'
          description: The amount of the transaction.
        transactionTimestamp:
          type: string
          pattern: ^[0-9]+$
          description: >-
            The timestamp of the transaction, using epoch timestamp with
            millisecond precision.
        paymentNetwork:
          $ref: '#/components/schemas/TransferType'
          description: >-
            The field specifies the payment system through which the incoming
            wire transfer was processed.
        emailAddress:
          type: string
          description: >-
            The email address of the user who effected the incoming wire
            transfer.
        owner:
          $ref: '#/components/schemas/StringWrappedTypeId'
        senderName:
          type: string
        state:
          $ref: '#/components/schemas/ManagedAccountsIwtEventIwtState'
        senderIban:
          type: string
        senderSortCode:
          type: string
        senderAccountNumber:
          type: string
        senderAccountDescriptor:
          type: string
        transactionFee:
          $ref: '#/components/schemas/LegacyCurrencyAmount'
          description: Any fee amount taken with the incoming wire transfer
        senderReference:
          type: string
          description: A reference provided by the sender of the incoming wire transfer
    ManagedAccountsIwtEventIwtState:
      type: string
      enum:
        - PENDING
        - COMPLETED
        - REJECTED
    ManagedCardsStateChangeEvent:
      required:
        - id
        - timestamp
        - eventType
        - cardType
        - renewalType
      type: object
      properties:
        id:
          $ref: '#/components/schemas/InstrumentId'
          description: null
        timestamp:
          type: string
          pattern: ^[0-9]+$
          description: >-
            The timestamp of the state change, using epoch timestamp with
            millisecond precision.
        eventType:
          $ref: '#/components/schemas/StateChangeEventType'
        state:
          $ref: '#/components/schemas/StateChangeState'
        cardType:
          $ref: '#/components/schemas/CardType'
        renewalType:
          $ref: '#/components/schemas/CardRenewalType'
    ManagedCardsAuthorisationEvent:
      required:
        - authorisationType
        - id
        - merchantData
        - merchantName
        - owner
        - sourceAmount
        - transactionAmount
        - transactionId
        - transactionTimestamp
      type: object
      properties:
        id:
          $ref: '#/components/schemas/InstrumentId'
          description: >-
            The id of the managed card on which an authorisation has been
            performed.
        transactionId:
          type: string
          pattern: ^[0-9]+$
          description: The id of the transaction, for reference.
        transactionAmount:
          $ref: '#/components/schemas/LegacyCurrencyAmount'
          description: The amount in the currency of the card.
        transactionTimestamp:
          type: string
          pattern: ^[0-9]+$
          description: >-
            The timestamp of the transaction, using epoch timestamp with
            millisecond precision.
        sourceAmount:
          $ref: '#/components/schemas/LegacyCurrencyAmount'
          description: The amount in the currency of the merchant.
        merchantData:
          $ref: '#/components/schemas/MerchantData'
          description: Merchant related information
        merchantName:
          type: string
          description: The name of the merchant where the authorisation has been made.
          deprecated: true
        merchantCategoryCode:
          type: string
          description: The merchant category code.
          deprecated: true
        merchantId:
          type: string
          description: The merchant ID.
          deprecated: true
        approved:
          type: boolean
          description: Indicates whether the authorisation has been approved or denied.
        availableBalance:
          $ref: '#/components/schemas/LegacyCurrencyAmount'
          description: >-
            The updated card available balance after this authorisation was
            processed.
        declineReason:
          $ref: '#/components/schemas/AuthDeclineReason'
          description: An indication of why the authorisation was declined
        authRuleFailedReason:
          $ref: '#/components/schemas/AuthRuleChecksFailedReason'
          description: >-
            If the authorisation was declined due to auth rule checks, this
            indicates the auth rule that was violated.
        authorisationType:
          $ref: '#/components/schemas/CardAuthorisationDetailsAuthorisationType'
          description: The type of authorisation that was processed.
        authorisationCategory:
          $ref: '#/components/schemas/AuthorisationCategory'
        relatedAuthorisationId:
          type: string
          pattern: ^[0-9]+$
          description: >-
            The related authorisation id which this authorisation is performing
            further updates on.
          deprecated: true
        relatedAuthorisationIds:
          type: array
          items:
            type: integer
            format: int64
          description: >-
            The list of related authorisation ids which this authorisation is
            related to.
        owner:
          $ref: '#/components/schemas/StringWrappedTypeId'
        cardholderPresent:
          $ref: '#/components/schemas/CardHolderPresent'
          description: >-
            Optional detail indicating if the card holder was present when the
            authorisation occurred.
        cardPresent:
          type: boolean
          description: >-
            Optional detail indicating if the card was present when the
            authorisation occurred.
        details:
          $ref: '#/components/schemas/ManagedCardModeDetails'
        authCode:
          maxLength: 6
          minLength: 1
          type: string
          description: The authorisation code associated with this authorisation.
        forexPadding:
          $ref: '#/components/schemas/LegacyCurrencyAmount'
          description: >-
            The forex padding amount, if any, that has been included in the
            transactionAmount.
        forexFee:
          $ref: '#/components/schemas/LegacyCurrencyAmount'
          description: >-
            The forex fee, if any, that has been included in the
            transactionAmount.
        authForwardingDetails:
          $ref: '#/components/schemas/AuthForwardingDetails'
          description: >-
            Contains information about the authorisations that have been
            forwarded.
        merchantCountryCode:
          type: string
          description: The merchant country code.
          deprecated: true
        digitalWalletDetails:
          $ref: '#/components/schemas/DigitalWalletDetails'
        userCurrencyTransactionDetails:
          $ref: '#/components/schemas/UserCurrencyTransactionDetails'
          description: The object representing the localised transaction's details
        transactionType:
          $ref: '#/components/schemas/CardAuthorisationDetailsTransactionType'
          description: >-
            The fine-grained transaction classification, e.g. ATM cash
            withdrawal, account funding transaction, original credit
            transaction.
    AuthDeclineReason:
      type: string
      enum:
        - NO_REASON
        - PHYSICAL_NOT_ACTIVATED
        - INSUFFICIENT_BALANCE
        - CVV_CHECKS_FAILED
        - CVV_RETRIES_EXCEEDED
        - CARD_STATUS_NOT_ALLOWED
        - PIN_CHECKS_FAILED
        - PIN_RETRIES_EXCEEDED
        - CARD_EXPIRY_CHECKS_FAILED
        - AVS_CHECKS_FAILED
        - ATM_WITHDRAWAL_LIMIT_EXCEEDED
        - SCA_REQUIRED
        - AUTH_RULE_CHECKS_FAILED
        - TRANSACTION_NOT_PERMITTED
        - TIMEOUT
        - SINGLE_SPEND
    CardAuthorisationDetailsAuthorisationType:
      type: string
      enum:
        - AUTHORISED
        - AUTHORISED_CREDIT
        - DECLINED
        - ONLINE_REVERSE
        - EXPIRED
        - MANUAL_CLOSE
        - CANCELLED
    AuthRuleChecksFailedReason:
      type: string
      enum:
        - NONE
        - MERCHANT_CATEGORY_NOT_IN_ALLOWED_LIST
        - MERCHANT_CATEGORY_BLOCKED
        - MERCHANT_ID_NOT_IN_ALLOWED_LIST
        - MERCHANT_ID_BLOCKED
        - ATM_NOT_ALLOWED
        - CONTACTLESS_NOT_ALLOWED
        - ECOMMERCE_NOT_ALLOWED
        - CASHBACK_NOT_ALLOWED
        - CREDIT_AUTHORISATIONS_NOT_ALLOWED
        - SPEND_LIMIT_EXCEEDED
        - MERCHANT_COUNTRY_NOT_IN_ALLOWED_LIST
        - MERCHANT_COUNTRY_BLOCKED
        - MIN_TRANSACTION_AMOUNT_EXCEEDED
        - MAX_TRANSACTION_AMOUNT_EXCEEDED
        - AUTH_FORWARDING
    StateChangeEventType:
      type: string
      enum:
        - ENABLED
        - ACTIVATED
        - BLOCKED
        - UNBLOCKED
        - DESTROYED
    StateChangeState:
      type: object
      properties:
        state:
          $ref: '#/components/schemas/InstrumentState'
        blockedReason:
          $ref: '#/components/schemas/BlockedReason'
        destroyedReason:
          $ref: '#/components/schemas/DestroyedReason'
    ManagedCardModeDetails:
      type: object
      properties:
        prepaidModeDetails:
          $ref: '#/components/schemas/PrepaidModeDetails'
        debitModeDetails:
          $ref: '#/components/schemas/DebitModeDetails'
    PrepaidModeDetails:
      type: object
      properties:
        availableBalance:
          $ref: '#/components/schemas/LegacyCurrencyAmount'
          description: >-
            The updated card available balance after this authorisation was
            processed.
    DebitModeDetails:
      type: object
      properties:
        parentManagedAccountId:
          type: string
          description: >-
            Id of the managed account holding funds which the managed card can
            access, up to a configurable spend limit.
        availableToSpend:
          type: array
          description: >-
            The amount of funds from the parent managed account that are
            available to be spent through the card, in a given time interval,
            after this transaction was performed.
          items:
            type: object
            properties:
              availableAmount:
                type: string
                pattern: ^[0-9]+$
                description: >-
                  The amount and currency that is available to spend, (for the
                  given interval).
                deprecated: true
              value:
                $ref: '#/components/schemas/CurrencyAmount'
                description: The amount in the currency of the card.
              interval:
                $ref: '#/components/schemas/SpendLimitInterval'
    AuthForwardingDetails:
      type: object
      properties:
        authForwardingTriggered:
          type: boolean
          description: Indicates whether the authorisation forwarding was triggered or not.
        authForwardingDecisionOutcome:
          $ref: '#/components/schemas/AuthForwardingDefaultTimeoutDecision'
          description: The default timeout decision outcome that was processed.
        authForwardingInnovatorTimedOut:
          type: boolean
          description: >-
            Indicates whether the authorisation forwarding was timed out while
            expecting a response from the Innovator’s system.
    AuthForwardingDefaultTimeoutDecision:
      type: string
      enum:
        - APPROVE
        - DECLINE
    ManagedCardsAdjustmentEvent:
      required:
        - adjustmentAmount
        - adjustmentType
        - id
        - owner
        - transactionId
        - transactionTimestamp
      type: object
      properties:
        id:
