      deprecated: true
      type: string
      description: >
        The KYC level, which determines what KYC information will be requested
        from the consumer:
          - KYC_LEVEL_1: The most basic level of KYC required. 
          - KYC_LEVEL_2: Full due diligence level 2
      enum:
        - KYC_LEVEL_1
        - KYC_LEVEL_2
    IbanInstrument:
      required:
        - id
        - managedAccountId
        - profileId
        - incomingWireTransferProfileId
        - friendlyName
        - currency
        - creationTimestamp
        - state
      type: object
      properties:
        id:
          type: string
          pattern: ^[0-9]+$
          description: The unique identifier of an Iban
        managedAccountId:
          type: string
          pattern: ^[0-9]+$
          description: The unique identifier of the linked managed account
        profileId:
          $ref: '#/components/schemas/ProfileId'
        incomingWireTransferProfileId:
          $ref: '#/components/schemas/ProfileId'
        tag:
          $ref: '#/components/schemas/Tag'
        friendlyName:
          minLength: 1
          maxLength: 50
          type: string
          description: The friendly name given to the iban.
        currency:
          $ref: '#/components/schemas/Currency'
        state:
          $ref: '#/components/schemas/IbanInstrumentState'
        creationTimestamp:
          type: integer
          format: int64
          description: >-
            The time when the iban was created, expressed in Epoch timestamp
            using millisecond precision.
        bankAccountDetails:
          description: >-
            A list of bank account details associated with the IBAN.

            Multiple details can be provided if multiple IBAN providers are
            supported by your payment model.
          type: array
          items:
            required:
              - beneficiaryNameAndSurname
              - beneficiaryBank
              - beneficiaryBankAddress
              - type
              - details
            type: object
            properties:
              beneficiaryNameAndSurname:
                type: string
                description: >-
                  The beneficiary name and surname details to be used when
                  initiating a deposit onto the IBAN.
              beneficiaryBank:
                type: string
                description: >-
                  The beneficiary bank name to be used when initiating a deposit
                  onto the IBAN.
              beneficiaryBankAddress:
                type: string
                description: >-
                  The beneficiary bank address to be used when initiating a
                  deposit onto the IBAN.
              paymentReference:
                type: string
                description: >
                  A reference required by the partner bank to execute a deposit
                  on the iban.



                  If provided, make sure that this is included as part of the
                  wire transfer details when initiating a deposit.
              details:
                description: >
                  The bank details required to initiate a deposit on the managed
                  account.


                  The details required to deposit on the IBAN vary depending on
                  the wire transfer channel that will be used.
                anyOf:
                  - $ref: '#/components/schemas/IBANDetails'
                  - $ref: >-
                      #/components/schemas/FasterPaymentsBankDetailsOrBACSBankDetails
                  - $ref: '#/components/schemas/SwiftBankDetails'
    LinkedAccount:
      required:
        - id
        - profileId
        - name
        - country
        - state
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the linked account.
          pattern: ^[0-9]+$
        profileId:
          $ref: '#/components/schemas/ProfileId'
        tag:
          $ref: '#/components/schemas/Tag'
        friendlyName:
          minLength: 1
