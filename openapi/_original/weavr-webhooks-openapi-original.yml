        The state of the linked account:
          - **PENDING_VERIFICATION**: The Linked Account is pending the completion of the required verification steps.
          - **ACTIVE**: The Linked Account is verified and active, ready to be used for self-to-self wire transfers.
          - **BLOCKED**: The Linked Account is temporarily blocked, preventing any use of this external account in self-to-self wire transfers. A Linked Account can be unblocked by calling the Multi API endpoint `POST /linked_accounts/{id}/unblock`.
          - **REMOVED**: The Linked Account has been removed from the platform and can no longer be used for self-to-self wire transfers unless a new verification is completed in future.
          - **REJECTED**: The Linked Account failed the verification process and cannot be used for self-to-self wire transfers unless a new verification is completed in future.
        A Linked Account can transition through these different overall states,
        starting at the `PENDING_VERIFICATION` state until all verification
        steps are followed through.
      enum:
        - PENDING_VERIFICATION
        - BLOCKED
        - ACTIVE
        - REJECTED
        - REMOVED
    Id:
      type: string
      pattern: ^[0-9]+$
    InstrumentType:
      type: string
      enum:
        - managed_cards
        - managed_accounts
    DigitalWalletType:
      type: string
      description: The digital wallet type.
      enum:
        - GOOGLE_PAY
        - APPLE_PAY
        - MERCHANT_TOKEN
    BulkCardDelivery:
      type: boolean
      description: >
        Bulk delivery is available for deliveryMethods REGISTERED_MAIL or
        COURIER.

        All cards marked as bulk and ordered within the fulfilment centre’s
        dispatch window will be sent in bulk. Delivery address must be identical
        for all orders. contactNumber in the deliveryAddress object is mandatory
        when bulk is selected. Maximum number of cards delivered in a single
        box/packet is REGISTERED_MAIL = 90, COURIER = 200.
    ManufacturingState:
      type: string
      description: |
        Information on the manufacturing of the physical card, as follows:
          - REQUESTED: The upgrade of the card to physical has been requested.
          - SENT_FOR_FULFILLMENT - The card has been sent for printing.
          - DISPATCHED: The card has been manufactured and dispatched. You may receive a second DISPATCHED event when the manufacturer provides a tracking code.
          - DELIVERED: The card has been received and activated by the recipient.
      enum:
        - REQUESTED
        - SENT_FOR_FULFILLMENT
        - DISPATCHED
        - DELIVERED
    DeliveryAddress:
      required:
        - name
        - surname
        - addressLine1
        - city
        - postCode
        - country
      type: object
      description: The delivery address where the physical card is delivered.
      properties:
        name:
          maxLength: 100
          type: string
        surname:
          maxLength: 100
          type: string
        addressLine1:
          maxLength: 50
          minLength: 1
          type: string
        addressLine2:
          maxLength: 50
          minLength: 1
          type: string
        city:
          maxLength: 50
          type: string
        postCode:
          maxLength: 10
          pattern: ^[A-Za-z0-9 -]*$
          type: string
        state:
          maxLength: 50
          type: string
        country:
          maxLength: 2
          minLength: 2
          pattern: ^[A-Z]+$
          type: string
          description: Country of the identity in ISO 3166 alpha-2 format.
        contactNumber:
          $ref: '#/components/schemas/PhoneNumber'
          description: >-
            Mandatory when bulk delivery is selected. Will be printed on the
            box/packet to assist delivery.
    DeliveryMethod:
      type: string
      description: >
        The delivery methods supported for delivering printed physical cards. If
        not specified, the STANDARD_DELIVERY method will be used.
      enum:
        - STANDARD_DELIVERY
        - REGISTERED_MAIL
        - COURIER
        - FIRST_CLASS_MAIL
    DeliveryTrackingCode:
      type: string
      description: >-
        The delivery tracking code for tracking the physical card's delivery
        status. This may not always be available on the first dispatched event,
        and so you will receive an additional dispatched notification with the
        delivery tracking code populated as soon as it is available.
    DeliveryTrackingMethod:
      type: string
      description: >-
        The delivery tracking method for tracking the physical card's delivery
        status.
    DeliveryTrackingUrl:
      type: string
      description: >-
        The delivery tracking URL for tracking the physical card's delivery
        status.
    CardPaymentType:
      type: string
      description: |
        High-level type of card payment, derived from the first event.

        - `PURCHASE` — standard purchase at a merchant.
        - `REFUND` — refund from a merchant to the cardholder.
        - `ORIGINAL_CREDIT` — push credit to the cardholder (OCT).
        - `ACCOUNT_FUNDING` — load funds onto an account.
        - `CASH_WITHDRAWAL` — cash withdrawn at ATM or scheme cash service.
        - `BALANCE_INQUIRY` — non-financial balance check.
      enum:
        - PURCHASE
        - REFUND
        - ORIGINAL_CREDIT
        - ACCOUNT_FUNDING
        - CASH_WITHDRAWAL
        - BALANCE_INQUIRY
    Card:
      type: object
      required:
        - id
        - type
      description: >-
        Information about a managed card — used wherever a card appears (the
        card on a card payment, or the access instrument that initiated a
        transaction).
      properties:
        id:
          type: string
          pattern: ^[0-9]+$
          description: The unique identifier of the managed card.
        type:
          type: string
          enum:
            - managed_cards
        mode:
          type: string
          enum:
            - prepaid
            - debit
          description: |
            The mode the card was created in.
              - `prepaid`: The card has its own balance and can have funds transferred to or from it.
              - `debit`: The card has no balance of its own; it draws on its parent managed account up to a configurable spend limit.
        friendlyName:
          type: string
          description: The friendly name chosen for the card.
        nameOnCard:
          type: string
          description: The cardholder name printed on the card.
        cardBrand:
          type: string
          enum:
            - MASTERCARD
            - VISA
          description: >-
            The scheme of the card. Restricted to schemes supported by card
            payments.
        cardNumberFirstSix:
          type: string
          pattern: ^[0-9]{6}$
          description: The first six digits of the card number (BIN range).
        cardNumberLastFour:
          type: string
          pattern: ^[0-9]{4}$
          description: The last four digits of the card number.
        linkedUserId:
          type: string
          pattern: ^[0-9]+$
          description: >-
            Identifier of the authorised user the card is assigned to. Populated
            only when the card has been assigned to a specific user.
        parentManagedAccountId:
          type: string
          pattern: ^[0-9]+$
          description: >-
            Identifier of the managed account this card draws funds from.
            Populated only when `mode` is `debit`.
    Merchant:
      type: object
      description: >-
        Information about a merchant — used wherever a merchant appears in
        card-payment flows, statement entries, and transaction activity.
      required:
        - id
        - name
      properties:
        id:
          type: string
          description: >-
            Merchant identifier (MID) — the acquirer-assigned code that
            identifies the merchant on card-scheme messages (ISO 8583 DE 42 Card
            Acceptor Identification Code).
        name:
          type: string
          description: Merchant name (DBA name).
        nameOther:
          type: string
          description: >-
            Alternative merchant name as supplied by the card network, when
            present.
        networkId:
          type: string
          description: Identifier assigned by the acquirer or scheme to the merchant.
        categoryCode:
          type: string
          description: ISO 18245 merchant category code (MCC).
        description:
          type: string
          description: Free-text description of the merchant.
        street:
          type: string
          description: Street address of the merchant terminal.
        city:
          type: string
          description: City of the merchant terminal.
        state:
          type: string
          description: Subdivision (state, province, region) of the merchant terminal.
        postalCode:
          type: string
          description: Postal code of the merchant terminal.
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code of the merchant terminal.
        telephone:
          type: string
          description: Merchant telephone.
        url:
          type: string
          description: Merchant website.
        contact:
          type: string
          description: Merchant contact (name or email of a representative, when present).
        reference:
          type: string
          description: >-
            Merchant-supplied reference for the transaction (the merchant's own
            identifier for what they billed).
        logoUrl:
          type: string
          description: Merchant logo URL, when available.
    CardPaymentStatus:
      type: string
      description: >
        Lifecycle status of a CardPayment.


        - `SETTLEMENT_IN_PROGRESS` — authorised, not yet (or not fully) settled.
        The hold is still on the card.

        - `SETTLED` — fully settled. The customer has been charged.

        - `DECLINED` — the latest authorisation was declined; no money moved.

        - `CANCELLED` — the authorisation was cancelled/reversed before
        settlement; no charge applied.

        - `EXPIRED` — the authorisation timed out without settling.
      enum:
        - SETTLEMENT_IN_PROGRESS
        - SETTLED
        - DECLINED
        - CANCELLED
        - EXPIRED
    CardPaymentEvent:
      type: object
      description: >
        An event in a card payment's lifecycle, lean — used **nested** inside
        `CardPayment.events[]`. The parent card payment provides
        `cardPaymentId`, `card`, and `merchant`, so the lean variants don't
        repeat them. Each event carries its own `authCode`. Four variants
        discriminated by `type`:

          - `AUTHORISATION` → `CardPaymentAuthorisationEvent`
          - `SETTLEMENT` → `CardPaymentSettlementEvent`
          - `REFUND` → `CardPaymentRefundEvent`
          - `ORIGINAL_CREDIT` → `CardPaymentOriginalCreditEvent` (Visa OCT / Mastercard MoneySend)

        For the **standalone** version returned by `GET /card_payment_events` —
        which carries `cardPaymentId`, `card`, and `merchant` so each row is
        self-contained — see `CardPaymentEventDetail`.
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/CardPaymentEventType'
      discriminator:
        propertyName: type
        mapping:
          AUTHORISATION: '#/components/schemas/CardPaymentAuthorisationEvent'
          SETTLEMENT: '#/components/schemas/CardPaymentSettlementEvent'
          REFUND: '#/components/schemas/CardPaymentRefundEvent'
          ORIGINAL_CREDIT: '#/components/schemas/CardPaymentOriginalCreditEvent'
    ExternalAccountType:
      type: string
      enum:
        - linked_accounts
    UKConfirmationOfPayeeResult:
      type: object
      required:
        - match
      properties:
        match:
          type: string
          description: >-
            The result of matching performed by the UK Confirmation of Payee
            responder
          enum:
            - EXACT_MATCH
            - CLOSE_MATCH
            - NO_MATCH
            - NOT_POSSIBLE
        reasonCode:
          type: string
          description: >
            The reason why the matching failed at the UK Confirmation of Payee
            responder:

              - ANNM: The CoP responder confirms that the account `name` provided does not match;
              - MBAM: The CoP responder indicates that the account `name` provided closely matches the actual account in its records, the actual account name is returned in the `accountName` field;
              - BANM: The account `type` that the user specified is 'PERSONAL', but the CoP responder indicates that the actual account matching the `name` provided is actually BUSINESS;
              - PANM: The account `type` that the user specified is 'BUSINESS', but the CoP responder indicates that the actual account matching the `name` provided is actually PERSONAL;
              - BAMM: The account `type` that the user specified is 'PERSONAL', but the CoP responder indicates that an account closely matching the `name` provided is BUSINESS;
              - PAMM: The account `type` that the user specified is 'BUSINESS', but the CoP responder indicates that an account closely matching the `name` provided is PERSONAL;
              - AC01: The account does not exist in the CoP responders books, the `accountNumber` specified is likely incorrect; 
              - IVCR: The CoP responder was unable to locate an account based on the `secondaryReference` field;
              - ACNS: The account is not supported for CoP by the CoP responder;
              - OPTO: The owner of the account has opted out of CoP service by the CoP responder;
              - CASS: The account has been switched using the Current Account Switch Service;
              - SCNS: The `sortCode` provided is not supported at endpoint;
          enum:
            - ANNM
            - MBAM
            - BANM
            - PANM
            - BAMM
            - PAMM
            - AC01
            - IVCR
            - ACNS
            - OPTO
            - CASS
            - SCNS
        accountName:
          type: string
          description: >
            CoP: Returned when the `match` is a `CLOSE_MATCH` and the
            `reasonCode` is MBAM, BAMM or PAMM

            VoP: Returned when the `match` is a `CLOSE_MATCH`
    SEPAVerificationOfPayeeResult:
      type: object
      required:
        - match
      properties:
        match:
          type: string
          description: >-
            The result of the SEPA Verification of Payee check performed by the
            responding PSP.
          enum:
            - MATCH
            - NO_MATCH
            - CLOSE_MATCH
            - NOT_POSSIBLE
        accountName:
          type: string
          description: >
            The name of the account holder as registered with the responding
            PSP.

            Returned when the match result is CLOSE_MATCH to help the payer
            verify the payee.
    CorrespondentBankingIndividualOriginator:
      required:
        - name
        - address
        - country
        - bankAccountDetails
      type: object
      description: >
        An individual (natural person) originator of the transfer.


        Travel Rule Requirements:

        - Mandatory: Full name and account number (via bankAccountDetails)

        - Mandatory: At least one supplementary information type (address +
        birth details, or address + official ID)
      properties:
        tag:
          $ref: '#/components/schemas/Tag'
        name:
          type: string
          maxLength: 140
          description: Full name of the individual as documented on official ID.
        address:
          type: string
          maxLength: 255
          description: Full residential address of the individual.
        country:
          type: string
          minLength: 2
          maxLength: 2
          pattern: ^[A-Z]{2}$
          description: ISO 3166-1 alpha-2 country code.
        bankAccountDetails:
          $ref: '#/components/schemas/CorrespondentBankingBankAccountDetails'
          description: >-
            Account and financial institution details of the originator (travel
            rule mandatory).
        supplementaryInformation:
          oneOf:
            - $ref: >-
                #/components/schemas/CorrespondentBankingIndividualAddressAndIdInfo
            - $ref: >-
                #/components/schemas/CorrespondentBankingIndividualAddressAndBirthInfo
    CorrespondentBankingBusinessOriginator:
      required:
        - name
        - registrationAddress
        - registrationCountry
        - bankAccountDetails
      type: object
      description: >
        A business (legal entity) originator of the transfer.


        Travel Rule Requirements:

        - Mandatory: Full legal name and account number (via bankAccountDetails)

        - Mandatory: Registered address and business identification (LEI,
        registration number, or tax ID)
      properties:
        tag:
          $ref: '#/components/schemas/Tag'
        name:
          type: string
          maxLength: 140
          description: Full legal name of the business entity.
        registrationAddress:
          type: string
          maxLength: 255
          description: Registered address of the business entity.
        registrationCountry:
          type: string
          minLength: 2
          maxLength: 2
          pattern: ^[A-Z]{2}$
          description: ISO 3166-1 alpha-2 country code of registration.
        bankAccountDetails:
          $ref: '#/components/schemas/CorrespondentBankingBankAccountDetails'
          description: >-
            Account and financial institution details of the originator (travel
            rule mandatory).
        supplementaryInformation:
          $ref: '#/components/schemas/CorrespondentBankingBusinessAddressAndIdInfo'
    CorrespondentBankingSEPABeneficiary:
      required:
        - name
        - iban
        - address
      type: object
      description: >-
        CBT-specific beneficiary details for SEPA/IBAN wire transfers with
        Banking Circle FI-to-FI field limits.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 35
          description: >
            The beneficiary's full name. >= 1 character and <= 35 characters.

            An extended character set is accepted to cater for all European
            languages.

            If SEPA does not support a particular character, it is automatically

            converted to an acceptable alternative, in line with SEPA scheme
            guidance.
        iban:
          type: string
          minLength: 15
          maxLength: 34
          pattern: ^[A-Z]{2}[0-9]{2}[A-Z0-9]{11,30}$
          description: >-
            International Bank Account Number, required for wire transfer over
            SEPA.
        bankIdentifierCode:
          type: string
          minLength: 8
          maxLength: 11
          pattern: ^[a-zA-Z0-9]{4}[a-zA-Z]{2}[a-zA-Z0-9]{2}[a-zA-Z0-9]{0,3}$
          description: BIC (Bank Identifier Code) for wire transfer over SEPA.
        address:
          maxLength: 105
          minLength: 1
          type: string
          description: >
            The beneficiary's address. Required for correspondent banking
            transfers.

            Maximum 105 characters (split into 3x35-char lines by the provider).
        bankName:
          type: string
          maxLength: 150
          description: The beneficiary's bank name.
        bankAddress:
          maxLength: 150
          minLength: 1
          type: string
          description: The beneficiary's bank address.
        bankCountry:
          type: string
          description: The beneficiary's bank country in ISO 3166 alpha-2 format.
          maxLength: 2
          minLength: 2
          pattern: ^[A-Z]{2}$
        nationality:
          $ref: '#/components/schemas/Nationality'
        dateOfBirth:
          $ref: '#/components/schemas/DateOfBirth'
    CorrespondentBankingRIXBeneficiary:
      required:
        - name
        - iban
        - address
      type: object
      description: >-
        CBT-specific beneficiary details for RIX wire transfers with Banking
        Circle FI-to-FI field limits.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 35
          description: >
            The beneficiary's full name. >= 1 character and <= 35 characters.

            An extended character set is accepted to cater for all European
            languages.

            If RIX does not support a particular character, it is automatically

            converted to an acceptable alternative.
        iban:
          type: string
          minLength: 15
          maxLength: 34
          pattern: ^[A-Z]{2}[0-9]{2}[A-Z0-9]{11,30}$
          description: >-
            International Bank Account Number, required for wire transfer over
            RIX.
        bankIdentifierCode:
          type: string
          minLength: 8
          maxLength: 11
          pattern: ^[a-zA-Z0-9]{4}[a-zA-Z]{2}[a-zA-Z0-9]{2}[a-zA-Z0-9]{0,3}$
          description: BIC (Bank Identifier Code) for wire transfer over RIX.
        address:
          maxLength: 105
          minLength: 1
          type: string
          description: >
            The beneficiary's address. Required for correspondent banking
            transfers.

            Maximum 105 characters (split into 3x35-char lines by the provider).
        bankName:
          type: string
          maxLength: 150
          description: The beneficiary's bank name.
        bankAddress:
          maxLength: 150
          minLength: 1
          type: string
          description: The beneficiary's bank address.
        bankCountry:
          type: string
          description: The beneficiary's bank country in ISO 3166 alpha-2 format.
          maxLength: 2
          minLength: 2
          pattern: ^[A-Z]{2}$
        nationality:
          $ref: '#/components/schemas/Nationality'
        dateOfBirth:
          $ref: '#/components/schemas/DateOfBirth'
    CorrespondentBankingFasterPaymentsBeneficiary:
      required:
        - name
        - type
        - accountNumber
        - sortCode
        - address
      type: object
      description: >-
        CBT-specific beneficiary details for Faster Payments wire transfers with
        Banking Circle FI-to-FI field limits.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 35
          pattern: ^[a-zA-Z0-9\/\-?:().,'+\s#=!"%&*<>;\{@\r\n]*$
          description: >
            The beneficiary's full name. >= 1 character and <= 35 characters.

            Note: the ' symbol is the unicode value U+2019 (right single
            quotation mark)

            and not the unicode value U+0027 (apostrophe).
        type:
          type: string
          description: The type of beneficiary account. Required for Faster Payments.
          enum:
            - PERSONAL
            - BUSINESS
        accountNumber:
          type: string
          pattern: ^[0-9]{8}$
          description: Account number, required for wire transfer over Faster Payments.
        sortCode:
          type: string
          pattern: ^[0-9]{6}$
          description: Sort code, required for wire transfer over Faster Payments.
        secondaryReference:
          type: string
          description: Optional secondary reference for accounts without unique sort codes.
        address:
          maxLength: 105
          minLength: 1
          type: string
          description: >
            The beneficiary's address. Required for correspondent banking
            transfers.

            Maximum 105 characters (split into 3x35-char lines by the provider).
        bankName:
          type: string
          maxLength: 150
          description: The beneficiary's bank name.
        bankAddress:
          maxLength: 150
          minLength: 1
          type: string
          description: The beneficiary's bank address.
        bankCountry:
          type: string
          description: The beneficiary's bank country in ISO 3166 alpha-2 format.
          maxLength: 2
          minLength: 2
          pattern: ^[A-Z]{2}$
        nationality:
          $ref: '#/components/schemas/Nationality'
        dateOfBirth:
          $ref: '#/components/schemas/DateOfBirth'
    CorrespondentBankingExternalData:
      type: object
      description: External data key-value pair.
      required:
        - name
        - value
      properties:
        name:
          type: string
          maxLength: 50
          description: Name/key of the external data.
        value:
          type: string
          maxLength: 255
          description: Value of the external data.
    CorrespondentBankingOwtState:
      description: |
        The state of the correspondent bank transfer transaction, as follows:
          - INVALID: The transfer has failed initial validation checks.
          - PENDING_CHALLENGE: The transfer requires the completion of a transaction confirmation challenge before it can be submitted.
          - SUBMITTED: The transfer has been submitted to the sending financial institution for processing.
          - REJECTED: The transfer that was submitted was rejected.
          - APPROVED: The transfer that was submitted has been approved and is being processed by the sending financial institution.
          - FAILED: There was an issue with the transfer, and the transaction has failed.
          - COMPLETED: The requested funds have been sent from the source instrument.
          - RETURNED: The transfer has been returned to the sender.
          - SCHEDULED: The transfer will be executed at the scheduled time.
          - CANCELLED: The scheduled transfer has been cancelled.
          - PENDING_CONFIRMATION: The transfer requires a manual confirmation by the user before proceeding.
      type: string
      enum:
        - INVALID
        - PENDING_CHALLENGE
        - SUBMITTED
        - REJECTED
        - APPROVED
        - FAILED
        - COMPLETED
        - RETURNED
        - SCHEDULED
        - CANCELLED
        - PENDING_CONFIRMATION
    CorrespondentBankingOwtValidationOutcome:
      type: object
      required:
        - category
        - categoryResult
      properties:
        category:
          type: string
          enum:
            - SEPA_VERIFICATION_OF_PAYEE
            - UK_CONFIRMATION_OF_PAYEE
        categoryResult:
          oneOf:
            - $ref: '#/components/schemas/SEPAVerificationOfPayeeResult'
            - $ref: '#/components/schemas/UKConfirmationOfPayeeResult'
    TransactionBatchInterceptState:
      type: string
      enum:
        - PENDING
        - ALLOWED
        - DENIED
        - FAILED
        - SUSPENDED
    BulkProcessOperationStatus:
      type: string
      enum:
        - SUBMITTED
        - RUNNING
        - COMPLETED
        - FAILED
        - CANCELLED
    IbanState:
      type: string
      description: >
        The state of the instrument indicating what it can and cannot do as
        follows:
          - PENDING: The instrument is pending creation.
          - ACTIVE: The instrument is in an active state and can be used in transactions.
          - BLOCKED: The instrument is temporarily blocked and cannot be used. Any funds on the instrument are also frozen. The `blockedReason` provides more information as to why it was blocked.
          - REJECTED: The instrument was rejected from being created.
          - DESTROYED: The instrument has been permanently destroyed. The `destroyReason` provides more information as to why it was destroyed.
      enum:
        - PENDING
        - ACTIVE
        - BLOCKED
        - REJECTED
        - DESTROYED
    PhoneNumber:
      maxLength: 20
      minLength: 5
      pattern: ^\+[0-9]+$
      type: string
    CardPaymentAuthorisationEvent:
      description: >-
        An authorisation lifecycle event — the merchant asked the bank for
        funds, or an existing hold was adjusted / released. No money moves until
        clearing. Used inside `CardPayment.events[]`; the parent card payment
        provides `cardPaymentId`, `card`, and `merchant` so this lean variant
        doesn't repeat them. For a standalone version with that context
        attached, see `CardPaymentAuthorisationEventDetail`.
      allOf:
        - $ref: '#/components/schemas/CardPaymentEvent'
        - type: object
          required:
            - id
            - subtype
            - timestamp
          properties:
            id:
              type: string
              pattern: ^[0-9]+$
            subtype:
              type: string
              description: >-
                Card-scheme network classification of the underlying
                transaction, representing the type of activity the authorisation
                is for. Reversal-vs-original lives on the separate `reversal`
                field.
              enum:
                - sale_purchases
                - cash_withdrawals
                - sales_with_cashback
                - mail_or_telephone_orders
                - account_funding
            reversal:
              type: boolean
              description: >-
                True when this event is a reversal of a prior authorisation in
                the same lifecycle (e.g. merchant void, expiry, explicit
                cancellation). False for originals.
            result:
              description: >-
                Approved or declined by the issuer. Populated on originals;
                omitted on reversals.
              $ref: '#/components/schemas/CardPaymentEventResult'
            authorisationCategory:
              description: >-
                Pre-auth (provisional hold, will clear separately) or final auth
                (estimated amount equals final amount).
              $ref: '#/components/schemas/AuthorisationCategory'
            authForwardingDetails:
              description: >-
                When the card is configured for auth forwarding, the forwarding
                context for this event.
              $ref: '#/components/schemas/CardPaymentAuthForwardingDetails'
            declineReason:
              description: Present when `result` is `DECLINED`.
              $ref: '#/components/schemas/CardPaymentDeclineReason'
            authRuleFailedReason:
              type: string
              description: >-
                The specific auth rule that caused the decline. Present when
                `declineReason` is `AUTH_RULE_CHECKS_FAILED`. Mirrors the legacy
                authorisation webhook's `authRuleFailedReason`.
            cancellationReason:
              type: string
              maxLength: 255
              description: >-
                Free-text reason for an explicit cancellation of an
                authorisation hold. Populated on `reversal: true` events driven
                by explicit cancellation rather than network reversal.
            transactionAmount:
              description: >-
                The amount for this event, in the merchant's currency (ISO 8583
                DE 4).
              $ref: '#/components/schemas/CurrencyAmount'
            billingAmount:
              description: >-
                The amount applied to the card, in the card's currency (ISO 8583
                DE 6).
              $ref: '#/components/schemas/CurrencyAmount'
            forex:
              description: >-
                Auth-time FX context — `exchangeRate` and `padding`. Populated
                on cross-currency authorisations.
              $ref: '#/components/schemas/CardPaymentForex'
            userAmount:
              description: >-
                Presentation-only amount to be shown to the cardholder in their
                app. The `userAmount` will only differ from the `billingAmount`
                if a `userCurrency` was set for the card during card creation.
              $ref: '#/components/schemas/CurrencyAmount'
            userExchangeRate:
              description: >-
                Rate applied to convert `transactionAmount` into `userAmount`.
                Presentation-only.
              $ref: '#/components/schemas/ScaledAmount'
            authCode:
              type: string
              description: >-
                Issuer authorisation code on this scheme message (ISO 8583 DE
                38). Echoed by subsequent settlement, refund, OCT messages in
                the same lifecycle.
            fees:
              type: array
              description: >-
                Fees applied as part of this specific event (e.g. interchange on
                a settlement, forex markup on an authorisation, chargeback fee
                on a dispute step).
              items:
                $ref: '#/components/schemas/CardPaymentFee'
            timestamp:
              type: integer
              format: int64
              description: >-
                When this event occurred at the point-of-interaction, Epoch
                millis.
            processedTimestamp:
              type: integer
              format: int64
              description: When this event was processed by the platform, Epoch millis.
    CardPaymentSettlementEvent:
      description: >-
        A settlement event — money actually moves between the cardholder's
        account and the merchant, or back the other way. *Visa Financial
        Transaction 0220 · Mastercard First Presentment 1240.*
      allOf:
        - $ref: '#/components/schemas/CardPaymentEvent'
        - type: object
          required:
            - id
            - subtype
            - settlementState
            - timestamp
          properties:
            id:
              type: string
              pattern: ^[0-9]+$
            subtype:
              type: string
              description: >-
                Card-scheme network classification of the underlying transaction
                being settled.
              enum:
                - sale_purchases
                - cash_withdrawals
                - sales_with_cashback
                - mail_or_telephone_orders
                - account_funding
            reversal:
              type: boolean
              description: >-
                True when this event reverses a prior settlement; funds return
                to the card. False for originals.
            settlementState:
              description: Processing state of this settlement on the platform.
              $ref: '#/components/schemas/CardPaymentSettlementState'
            transactionAmount:
              description: The amount cleared, in the merchant's currency (ISO 8583 DE 4).
              $ref: '#/components/schemas/CurrencyAmount'
            billingAmount:
              description: >-
                The amount billed against the card, in the card's currency (ISO
                8583 DE 6). May differ from any earlier authorisation due to
                final amount and forex movement.
              $ref: '#/components/schemas/CurrencyAmount'
            exchangeRate:
              description: Forex rate applied at clearing time.
              $ref: '#/components/schemas/ScaledAmount'
            userAmount:
              description: >-
                Presentation-only amount to be shown to the cardholder in their
                app. The `userAmount` will only differ from the `billingAmount`
                if a `userCurrency` was set for the card during card creation.
              $ref: '#/components/schemas/CurrencyAmount'
            userExchangeRate:
              description: >-
                Rate applied to convert `transactionAmount` into `userAmount`.
                Presentation-only.
              $ref: '#/components/schemas/ScaledAmount'
            authCode:
              type: string
              description: >-
                Issuer authorisation code (ISO 8583 DE 38) echoed from the
                originating authorisation.
            fees:
              type: array
              description: >-
                Fees applied as part of this specific event (e.g. interchange on
                a settlement, forex markup on an authorisation, chargeback fee
                on a dispute step).
              items:
                $ref: '#/components/schemas/CardPaymentFee'
            timestamp:
              type: integer
              format: int64
              description: When this settlement event occurred, Epoch millis.
            processedTimestamp:
              type: integer
              format: int64
              description: When this event was processed by the platform, Epoch millis.
    CardPaymentRefundEvent:
      description: A refund credited to the card, tied to an earlier purchase.
      allOf:
        - $ref: '#/components/schemas/CardPaymentEvent'
        - type: object
          required:
            - id
            - timestamp
          properties:
            id:
              type: string
              pattern: ^[0-9]+$
            reversal:
              type: boolean
              description: >-
                True when this event reverses a prior refund (money was returned
                to the cardholder and is now being clawed back). False for an
                original refund credit.
            subtype:
              type: string
              description: >-
                Card-scheme network classification of the refund.
                Reversal-vs-original lives on the separate `reversal` field.
              enum:
                - purchase_refunds
                - purchase_refund_reversals
            reasonCode:
              type: string
              description: >-
                Network reason code accompanying the event, when provided by the
                scheme.
            transactionAmount:
              description: The amount credited / reversed, in the merchant's currency.
              $ref: '#/components/schemas/CurrencyAmount'
            billingAmount:
              description: The amount applied to the card, in the card's currency.
              $ref: '#/components/schemas/CurrencyAmount'
            exchangeRate:
              description: >-
                Forex rate applied to convert `transactionAmount` into
                `billingAmount`.
              $ref: '#/components/schemas/ScaledAmount'
            userAmount:
              description: >-
                Presentation-only amount to be shown to the cardholder in their
                app. The `userAmount` will only differ from the `billingAmount`
                if a `userCurrency` was set for the card during card creation.
              $ref: '#/components/schemas/CurrencyAmount'
            userExchangeRate:
              description: >-
                Rate applied to convert `transactionAmount` into `userAmount`.
                Presentation-only.
              $ref: '#/components/schemas/ScaledAmount'
            authCode:
              type: string
              description: >-
                Issuer authorisation code (ISO 8583 DE 38) echoed from the
                originating authorisation.
            fees:
              type: array
              description: >-
                Fees applied as part of this specific event (e.g. interchange on
                a settlement, forex markup on an authorisation, chargeback fee
                on a dispute step).
              items:
                $ref: '#/components/schemas/CardPaymentFee'
            timestamp:
              type: integer
              format: int64
              description: When this event occurred, Epoch millis.
            processedTimestamp:
              type: integer
              format: int64
              description: When this event was processed by the platform, Epoch millis.
    CardPaymentOriginalCreditEvent:
      description: >-
        A push credit to the card not tied to a prior purchase. *Visa Original
        Credit Transaction (OCT) · Mastercard MoneySend.*
      allOf:
        - $ref: '#/components/schemas/CardPaymentEvent'
        - type: object
          required:
            - id
            - timestamp
          properties:
            id:
              type: string
              pattern: ^[0-9]+$
            reversal:
              type: boolean
              description: >-
                True when this event reverses a prior OCT (push credit being
                clawed back). False for an original push credit.
            subtype:
              type: string
              description: >-
                Card-scheme network classification of the OCT.
                Reversal-vs-original lives on the separate `reversal` field.
              enum:
                - original_credit_transactions
                - original_credit_transaction_reversals
            reasonCode:
              type: string
              description: >-
                Network reason code accompanying the event, when provided by the
                scheme.
            transactionAmount:
              description: The amount credited / reversed, in the merchant's currency.
              $ref: '#/components/schemas/CurrencyAmount'
            billingAmount:
              description: The amount applied to the card, in the card's currency.
              $ref: '#/components/schemas/CurrencyAmount'
            exchangeRate:
              description: >-
                Forex rate applied to convert `transactionAmount` into
                `billingAmount`.
              $ref: '#/components/schemas/ScaledAmount'
            userAmount:
              description: >-
                Presentation-only amount to be shown to the cardholder in their
                app. The `userAmount` will only differ from the `billingAmount`
                if a `userCurrency` was set for the card during card creation.
              $ref: '#/components/schemas/CurrencyAmount'
            userExchangeRate:
              description: >-
                Rate applied to convert `transactionAmount` into `userAmount`.
                Presentation-only.
              $ref: '#/components/schemas/ScaledAmount'
            authCode:
              type: string
              description: >-
                Issuer authorisation code (ISO 8583 DE 38) echoed from the
                originating authorisation.
            fees:
              type: array
              description: >-
                Fees applied as part of this specific event (e.g. interchange on
                a settlement, forex markup on an authorisation, chargeback fee
                on a dispute step).
              items:
                $ref: '#/components/schemas/CardPaymentFee'
            timestamp:
              type: integer
              format: int64
              description: When this event occurred, Epoch millis.
            processedTimestamp:
              type: integer
              format: int64
              description: When this event was processed by the platform, Epoch millis.
    CorrespondentBankingBankAccountDetails:
      required:
        - account
        - financialInstitution
      type: object
      description: Bank account details for the originator.
      properties:
        account:
          type: string
          minLength: 1
          maxLength: 34
          pattern: ^[a-zA-Z0-9]{1,34}$
          description: >-
            Can be either an account number or an International Bank Account
            Number (IBAN).
        financialInstitution:
          type: string
          minLength: 8
          maxLength: 11
          pattern: ^[a-zA-Z0-9]{8,11}$
          description: >-
            Bank Identifier Code (BIC) of the originator's financial
            institution.
    CorrespondentBankingIndividualAddressAndIdInfo:
      required:
        - documentType
        - documentNumber
      type: object
      description: Personal identification for an individual originator.
      properties:
        documentType:
          type: string
          enum:
            - NATIONAL_ID
            - PASSPORT
            - TAX_ID
            - OTHER
          description: Type of personal identification document.
        documentNumber:
          type: string
          maxLength: 35
          description: Personal identification document number.
    CorrespondentBankingIndividualAddressAndBirthInfo:
      required:
        - dateOfBirth
        - placeOfBirth
      type: object
      description: Birth information for an individual originator.
      properties:
        dateOfBirth:
          type: string
          format: date
          description: Date of birth in YYYY-MM-DD format.
        placeOfBirth:
          type: string
          maxLength: 140
          description: Place of birth - city and country.
    CorrespondentBankingBusinessAddressAndIdInfo:
      required:
        - documentType
        - documentNumber
      type: object
      description: Business identification for a business originator.
      properties:
        documentType:
          type: string
          enum:
            - LEI
            - REGISTRATION_NUMBER
            - TAX_ID
            - OTHER
          description: Type of business identification document.
        documentNumber:
          type: string
          maxLength: 35
          description: >-
            Business identification document number (e.g. LEI code, company
            registration number).
    CardPaymentEventResult:
      type: string
      description: Outcome of an authorisation event.
      enum:
        - APPROVED
        - DECLINED
    CardPaymentAuthForwardingDetails:
      type: object
      description: Details of auth-forwarding handling on the authorisation.
      properties:
        triggered:
          type: boolean
          description: True if auth forwarding was triggered for this authorisation.
        decisionOutcome:
          description: Default decision applied if the innovator did not respond in time.
          $ref: '#/components/schemas/CardPaymentAuthForwardingDecisionOutcome'
        innovatorTimedOut:
          type: boolean
          description: >-
            True if the innovator failed to respond within the configured
            timeout and the default decision was applied.
    CardPaymentDeclineReason:
      type: string
      description: >-
        Reason an authorisation was declined; populated only when `result =
        DECLINED`. Mirrors the legacy authorisation webhook's decline reason
        values.
      enum:
        - NO_REASON
        - PHYSICAL_NOT_ACTIVATED
        - INSUFFICIENT_BALANCE
        - CVV_CHECKS_FAILED
        - CVV_RETRIES_EXCEEDED
        - CARD_STATUS_NOT_ALLOWED
        - PIN_CHECKS_FAILED
        - PIN_RETRIES_EXCEEDED
        - CARD_EXPIRY_CHECKS_FAILED
        - AVS_CHECKS_FAILED
        - ATM_WITHDRAWAL_LIMIT_EXCEEDED
        - SCA_REQUIRED
        - AUTH_RULE_CHECKS_FAILED
        - TRANSACTION_NOT_PERMITTED
        - TIMEOUT
        - SINGLE_SPEND
    CardPaymentForex:
      type: object
      description: >-
        Auth-time FX context: the rate applied at authorisation and the cushion
        blocked to cater for rate movement before settlement. Surfaced as a pair
        on `AUTHORISATION` events only — on settlement/refund/oct the rate sits
        at the event top-level (it modifies that event's amounts directly) and
        padding has already been absorbed or released at clearing time.
      properties:
        exchangeRate:
          description: >-
            Rate applied to convert `transactionAmount` into `billingAmount` at
            authorisation time. Populated on cross-currency authorisations.
          $ref: '#/components/schemas/ScaledAmount'
        padding:
          description: >-
            Extra amount blocked at authorisation time to cater for currency
            fluctuation between auth and settlement. Already included in the
            event's `transactionAmount`; surfaced separately so the embedder can
            show the cardholder how much of the charge is the FX cushion.
            Released or absorbed at clearing time.
          $ref: '#/components/schemas/CurrencyAmount'
    ScaledAmount:
      type: object
      properties:
        value:
          type: integer
          format: int64
        scale:
          maximum: 127
          minimum: -128
          type: integer
          format: int32
      description: >-
        A floating point number, represented as a value and its scale. Its
        actual value can be obtained using the equation: value * pow(10,
        -scale).
    CardPaymentFee:
      type: object
      description: |
        A fee accrued on a specific card payment event. Discriminated by `type`:
          - `PLATFORM_FEE` → `CardPaymentPlatformFee` — fee charged by the platform; points at the underlying `FeeTransaction`.
          - `FOREX_FEE` → `CardPaymentForexFee` — forex padding + forex fee captured at authorisation on a cross-currency event.
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/CardPaymentFeeType'
      discriminator:
        propertyName: type
        mapping:
          PLATFORM_FEE: '#/components/schemas/CardPaymentPlatformFee'
          FOREX_FEE: '#/components/schemas/CardPaymentForexFee'
    CardPaymentSettlementState:
      type: string
      description: Processing state of a settlement event at the scheme.
      enum:
        - PENDING
        - COMPLETED
    CardPaymentAuthForwardingDecisionOutcome:
      type: string
      description: >-
        Default decision applied if the innovator does not respond in time
        during auth-forwarding.
      enum:
        - APPROVE
        - DECLINE
    CardPaymentFeeType:
      type: string
      enum:
        - PLATFORM_FEE
        - FOREX_FEE
    CardPaymentPlatformFee:
      description: >-
        A fee charged by the platform on this card payment event (a
        `FeeTransaction` posted against the cardholder's instrument). The `id`
        points at the underlying fee transaction, retrievable in full via the
        Transaction Activity API.
      allOf:
        - $ref: '#/components/schemas/CardPaymentFee'
        - type: object
          required:
            - id
            - subtype
            - amount
          properties:
            id:
              type: string
              pattern: ^[0-9]+$
              description: Identifier of the underlying `FeeTransaction`.
            subtype:
              description: Category of fee.
              $ref: '#/components/schemas/CardPaymentFeeSubtype'
            amount:
              description: >-
                Fee amount, in the currency of the instrument the fee was
                applied to.
              $ref: '#/components/schemas/CurrencyAmount'
    CardPaymentForexFee:
      description: >-
        Forex fee charged on a cross-currency event. Already included in the
        event's `transactionAmount` — surfaced here so the embedder can show the
        cardholder how much of the charge was the forex fee.
      allOf:
        - $ref: '#/components/schemas/CardPaymentFee'
        - type: object
          properties:
            amount:
              description: >-
                The forex fee charged on this event, in the currency of the
                instrument the fee was applied to.
              $ref: '#/components/schemas/CurrencyAmount'
    CardPaymentFeeSubtype:
      type: string
      description: >-
        The category of a platform fee accrued on a card payment event.
        Restricted to subtypes that can fire on card payments.
      enum:
        - purchase_fees
        - refund_fees
        - atm_withdrawal_fees
        - withdrawal_fees
        - chargeback_fees
        - fee_reversals
        - custom_fees
        - other_fees
paths: {}
