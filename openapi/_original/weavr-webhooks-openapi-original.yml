        - DESTINATION_LIMIT_EXCEEDED
        - SEND_TO_INSTRUMENT_UNSUPPORTED
        - INSUFFICIENT_FUNDS
        - SOURCE_INSTRUMENT_BLOCKED
        - DESTINATION_INSTRUMENT_BLOCKED
        - INVALID_AMOUNT
        - IDENTITY_KYC_LEVEL_STEPUP_REQUIRED
        - PROFILE_NOT_FOUND
        - SCHEDULED_TIMESTAMP_INVALID
