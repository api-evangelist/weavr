            `SEPA` <= `35` characters. An extended character set is accepted to
            cater for all European languages. If `SEPA` does not support a
            particular character, it is automatically converted to an acceptable
            alternative, in line with `SEPA` scheme guidance.


            `Faster Payments` <= `18` characters
        externalData:
