components:
  schemas:
    DepositRequestByAccountId:
      required:
        - depositAmount
      type: object
      properties:
        depositAmount:
          allOf:
            - $ref: '#/components/schemas/CurrencyAmount'
            - description: The amount of the incoming wire transfer
              x-fieldValidation: required
        senderName:
          type: string
          description: >-
            The name of the person or business sending the incoming wire
            transfer
        reference:
          type: string
          description: The reference is the transaction description
        receiverName:
          type: string
          description: The name of the recipient of the incoming wire transfer
        txId:
          type: integer
          description: >-
            Id used for the transaction if provided, otherwise one will be
            generated
          format: int64
        senderIban:
          maxLength: 50
          pattern: ^[a-zA-Z0-9_-]+$
          type: string
          x-fieldValidation: size(_,50) regex(^[a-zA-Z0-9_-]+$)
        sepa:
          $ref: '#/components/schemas/IBANDetails'
        fasterPayments:
          $ref: '#/components/schemas/FasterPaymentsBankDetails'
        accountDescriptor:
          $ref: '#/components/schemas/AccountDescriptorDetails'
        paymentNetwork:
          allOf:
            - $ref: '#/components/schemas/TransferType'
            - description: >-
                Optional field which indicates the payment network to use. If
                not provided, a default payment network will be chosen based on
                the currency.
    CurrencyAmount:
      required:
        - currency
      type: object
      properties:
        currency:
          maxLength: 3
          minLength: 3
          pattern: ^[A-Z]*$
          type: string
          description: >-
            The currency ISO-4217 code, i.e. a three letter uppercase code, such
            as GBP, EUR, USD.
          x-fieldValidation: required size(3,3) regex([A-Z]*)
        amount:
          type: integer
          description: >-
            The monetary amount, scaled to the lowest denomination of the
            currency. For example, an amount of 1000 for a EUR currency is
            actually 1000 Euro cents, i.e. EUR 10.00.
          format: int64
      description: A message representing a monetary amount in a particular currency.
    IBANDetails:
      required:
        - iban
      type: object
      properties:
        iban:
          maxLength: 34
          minLength: 15
          pattern: ^[A-Z]{2}[0-9]{2}[A-Z0-9]{11,30}$
          type: string
          description: >-
            International Bank Account Number, required for wire transfer over
            SEPA or RIX
          x-fieldValidation: required size(15,34) regex(^[A-Z]{2}[0-9]{2}[A-Z0-9]{11,30}$)
        bankIdentifierCode:
          maxLength: 11
          minLength: 8
          pattern: ^[a-zA-Z0-9]{4}[a-zA-Z]{2}[a-zA-Z0-9]{2}[a-zA-Z0-9]{0,3}$
          type: string
          description: BIC, for wire transfer over SEPA or RIX
          x-fieldValidation: >-
            size(8,11)
            regex(^[a-zA-Z0-9]{4}[a-zA-Z]{2}[a-zA-Z0-9]{2}[a-zA-Z0-9]{0,3}$)
    FasterPaymentsBankDetails:
      required:
        - accountNumber
        - sortCode
      type: object
      properties:
        accountNumber:
          maxLength: 8
          minLength: 8
          pattern: ^[0-9]{8}$
          type: string
          description: Account number, required for wire transfer over Faster Payments.
          x-fieldValidation: required size(8,8) regex(^[0-9]{8}$)
        sortCode:
          maxLength: 6
          minLength: 6
          pattern: ^[0-9]{6}$
          type: string
          description: Sort code, required for wire transfer over Faster Payments.
          x-fieldValidation: required size(6,6) regex(^[0-9]{6}$)
    AccountDescriptorDetails:
      required:
        - accountDescriptor
      type: object
      properties:
        accountDescriptor:
          maxLength: 50
          type: string
          description: >-
            An identifier of an account that has neither an IBAN nor Faster
            Payments details.
          x-fieldValidation: required size(_,50)
    TransferType:
      type: string
      enum:
        - SEPA
        - FASTER_PAYMENTS
        - SWIFT
        - BACS
        - CHAPS
        - RIX
    DepositResponse0:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/DepositResponseDepositResponseCode1'
    DepositResponseDepositResponseCode1:
      type: string
      enum:
        - COMPLETED
        - DENIED_ACCOUNT_NOT_FOUND
        - DENIED_AMOUNT_NOT_POSITIVE
        - DENIED_CURRENCY_NOT_ACCOUNT_CURRENCY
        - DENIED_ACCOUNT_INACTIVE
        - DENIED_INVALID_TX_ID
        - DENIED_OTHER
        - DENIED_ACCOUNT_NOT_UPGRADED_TO_IBAN
    ClientInvalidRequest:
      type: object
      properties:
        message:
          maxLength: 255
          type: string
          description: When present helps to identify and fix the problem.
          x-fieldValidation: size(_,255)
        validation:
          allOf:
            - $ref: '#/components/schemas/MessageValidation'
            - description: Description of fields which were invalid.
    MessageValidation:
      type: object
      properties:
        invalid:
          type: boolean
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldValidationErrors'
    FieldValidationErrors:
      type: object
      properties:
        name:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldValidation'
    FieldValidation:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/FieldValidationType'
        params:
          type: array
          items:
            type: string
    FieldValidationType:
      type: string
      enum:
        - REQUIRED
        - HAS_TEXT
        - REQUIRES
        - SIZE
        - RANGE
        - IN
        - NOT_IN
        - REGEX
        - EXACTLY
        - AT_LEAST
        - AT_MOST
        - ALL_OR_NONE
    DefaultError:
      type: object
      properties:
        message:
          maxLength: 255
          type: string
          description: When present helps to identify and fix the problem.
          x-fieldValidation: size(_,255)
      description: A default error model in case of errors other than 400, 409 or 504.
    DepositRequest:
      required:
        - depositAmount
      type: object
      properties:
        iban:
          type: string
          description: >-
            The iban of the account the incoming wire transfer should be
            processed against
          deprecated: true
        paymentReference:
          type: string
          description: >-
            The payment reference is needed to identify which account, in cases
            where the same iban is used
        depositAmount:
          allOf:
            - $ref: '#/components/schemas/CurrencyAmount'
            - description: The amount of the incoming wire transfer
              x-fieldValidation: required
        senderName:
          type: string
          description: >-
            The name of the person or business sending the incoming wire
            transfer
        reference:
          type: string
          description: A reference provided by the sender of the incoming wire transfer.
        receiverName:
          type: string
          description: The name of the recipient of the incoming wire transfer
        txId:
          type: integer
          description: >-
            Id used for the transaction if provided, otherwise one will be
            generated
          format: int64
        senderIbanDetails:
          $ref: '#/components/schemas/IbanDetails'
        senderFasterPaymentsDetails:
          $ref: '#/components/schemas/FasterPaymentsDetails'
        senderAccountDescriptorDetails:
          $ref: '#/components/schemas/AccountDescriptorDetails'
        destinationIbanDetails:
          $ref: '#/components/schemas/IbanDetails'
        destinationFasterPaymentsDetails:
          $ref: '#/components/schemas/FasterPaymentsDetails'
        paymentNetwork:
          allOf:
            - $ref: '#/components/schemas/TransferType'
            - description: >-
                Optional field which indicates the payment network to use. If
                not provided, a default payment network will be chosen based on
                the currency.
    IbanDetails:
      required:
        - iban
      type: object
      properties:
        iban:
          pattern: ^[A-Z0-9]*$
          type: string
          x-fieldValidation: required regex([A-Z0-9]*)
        bankIdentifierCode:
          pattern: ^[A-Z0-9]*$
          type: string
          x-fieldValidation: regex([A-Z0-9]*)
    FasterPaymentsDetails:
      required:
        - accountNumber
        - sortCode
      type: object
      properties:
        sortCode:
          maxLength: 6
          minLength: 6
          pattern: ^[0-9]*$
          type: string
          x-fieldValidation: required size(6,6) regex([0-9]*)
        accountNumber:
          pattern: ^[0-9]*$
          type: string
          x-fieldValidation: required regex([0-9]*)
        secondaryReference:
          type: string
          description: >-
            Supplementary identifier used by financial institutions for accounts
            without unique sort codes, ensuring distinction between different
            accounts or customers
    DepositResponse1:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/DepositResponseDepositResponseCode0'
    DepositResponseDepositResponseCode0:
      type: string
      enum:
        - COMPLETED
        - DENIED_ACCOUNT_NOT_FOUND
        - DENIED_AMOUNT_NOT_POSITIVE
        - DENIED_CURRENCY_NOT_ACCOUNT_CURRENCY
        - DENIED_ACCOUNT_INACTIVE
        - DENIED_INVALID_TX_ID
        - DENIED_OTHER
    ExpireManagedCardConflict:
      type: object
      properties:
        errorCode:
          $ref: '#/components/schemas/ExpireManagedCardConflictErrorCode'
    ExpireManagedCardConflictErrorCode:
      type: string
      enum:
        - INSTRUMENT_DESTROYED
        - INSTRUMENT_NOT_EXPIRABLE
        - TRANSACTION_BATCH_EXCEPTION
    PurchaseRequestByCardId:
      required:
        - merchantName
        - transactionAmount
      type: object
      properties:
        merchantName:
          maxLength: 50
          minLength: 1
          type: string
          description: The merchant name
          x-fieldValidation: required size(1,50)
        merchantId:
          maxLength: 15
          minLength: 1
          type: string
          description: The merchant id (MID). If not specified, a random value will be used
          x-fieldValidation: size(1,15)
        merchantCategoryCode:
          maxLength: 4
          minLength: 1
          type: string
          description: >-
            The merchant category code (MCC). If unspecified or an invalid MCC
            is specified, the Merchant Code 5399 (Misc. General Merchandise)
            will be used instead
          x-fieldValidation: size(1,4)
        transactionAmount:
          allOf:
            - $ref: '#/components/schemas/CurrencyAmount'
            - description: The amount of the purchase
              x-fieldValidation: required
        transactionCountry:
          maxLength: 3
          minLength: 3
          pattern: ^[A-Z]*$
          type: string
          description: The transaction country in ISO 3166 - alpha-3 format
          x-fieldValidation: size(3,3) regex([A-Z]*)
        forexFee:
          type: integer
          description: >-
            If this is a cross-currency transaction, the forex fee amount in the
            card currency. Deprecated; the forex fee percentage configured at
            the card profile will be applied if this field is not provided
          format: int64
          deprecated: true
        forexPadding:
          type: integer
          description: >-
            If this is a cross-currency transaction, the forex padding amount in
            the card currency. Deprecated; a 2% forex padding will be applied if
            this field is not provided
          format: int64
          deprecated: true
        atmWithdrawal:
          type: boolean
          description: >-
            If set to true, this purchase simulates and ATM Withdrawal
            transaction. MCC will automatically be set to 6011
        additionalMerchantData:
          allOf:
            - $ref: '#/components/schemas/AdditionalMerchantData'
            - description: Additional merchant data
        cardHolderPresent:
          allOf:
            - $ref: '#/components/schemas/CardHolderPresent'
            - description: >-
                Optional detail indicating if the card holder was present when
                the authorisation occurred.
        cardPresent:
          type: boolean
          description: >-
            Optional detail indicating if the card was present when the
            authorisation occurred.
        initiateBiometricThreeDSecure:
          type: boolean
          description: >-
            If the card is enrolled for Biometric Authentication, a 3DS Flow is
            initiated before the Purchase can resume.
        transactionTimestamp:
          type: integer
          description: Epoch timestamp using millisecond precision.
          format: int64
    AdditionalMerchantData:
      type: object
      properties:
        merchantStreet:
          type: string
        merchantCity:
          type: string
        merchantState:
          type: string
        merchantPostalCode:
          type: string
        merchantCountry:
          maxLength: 3
          minLength: 3
          pattern: ^[A-Z]*$
          type: string
          x-fieldValidation: size(3,3) regex([A-Z]*)
        merchantTelephone:
          type: string
        merchantURL:
          type: string
        merchantNameOther:
          type: string
        merchantNetworkId:
          type: string
        merchantContact:
          type: string
    CardHolderPresent:
      type: string
      enum:
        - PRESENT
        - NOT_PRESENT
        - PRESENCE_UNKNOWN
    PurchaseResponse:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/PurchaseResponsePurchaseResponseCode'
        threeDSecureChallengeId:
          $ref: '#/components/schemas/NullableInt64'
    PurchaseResponsePurchaseResponseCode:
      type: string
      enum:
        - APPROVED
        - DENIED_NOT_ENOUGH_FUNDS
        - DENIED_CARD_NOT_FOUND
        - DENIED_INCORRECT_CVV
        - DENIED_CARD_EXPIRY
        - DENIED_AMOUNT_NOT_POSITIVE
        - DENIED_CARD_INACTIVE
        - DENIED_OTHER
        - DENIED_SPEND_CONTROL
        - PENDING_BIOMETRIC_THREEDS_VERIFICATION
        - CARD_NOT_ENROLLED_FOR_BIOMETRIC_THREEDS
    NullableInt64:
      type: object
      properties:
        value:
          type: integer
          description: If value is 0, set has_value to true
          format: int64
        hasValue:
          type: boolean
          description: >-
            If value is default (0) then true indicates 0 while false indicates
            null
    RenewManagedCardConflict:
      type: object
      properties:
        errorCode:
          $ref: '#/components/schemas/RenewManagedCardConflictErrorCode'
    RenewManagedCardConflictErrorCode:
      type: string
      enum:
        - INSTRUMENT_DESTROYED
        - INSTRUMENT_MARKED_LOST_STOLEN
        - INSTRUMENT_NOT_RENEWABLE
        - TRANSACTION_BATCH_EXCEPTION
    PurchaseRequest:
      required:
        - cardNumber
        - cvv
        - expiryDate
        - merchantName
        - transactionAmount
      type: object
      properties:
        cardNumber:
          maxLength: 50
          minLength: 16
          pattern: ^[0-9 ]*$
          type: string
          description: The 16-digit card number.
          x-fieldValidation: required has_text size(16,50) regex(^[0-9 ]*$)
        cvv:
          type: string
          description: The 3-digit cvv
          x-fieldValidation: required has_text
        expiryDate:
          type: string
          description: The expiry date in format MMYY
          x-fieldValidation: required has_text
        merchantName:
          maxLength: 50
          minLength: 1
          type: string
          description: The merchant name
          x-fieldValidation: required size(1,50)
        merchantId:
          maxLength: 15
          minLength: 1
          type: string
          description: The merchant id (MID). If not specified, a random value will be used
          x-fieldValidation: size(1,15)
        merchantCategoryCode:
          maxLength: 4
          minLength: 1
          type: string
          description: >-
            The merchant category code (MCC). If unspecified or an invalid MCC
            is specified, the Merchant Code 5399 (Misc. General Merchandise)
            will be used instead
          x-fieldValidation: size(1,4)
        transactionAmount:
          allOf:
            - $ref: '#/components/schemas/CurrencyAmount'
            - description: The amount of the purchase
              x-fieldValidation: required
        forexFee:
          type: integer
          description: >-
            If this is a cross-currency transaction, the forex fee amount in the
            card currency. Deprecated; the forex fee percentage configured at
            the card profile will be applied if this field is not provided
          format: int64
          deprecated: true
        forexPadding:
          type: integer
          description: >-
            If this is a cross-currency transaction, the forex padding amount in
            the card currency. Deprecated; a 2% forex padding will be applied if
            this field is not provided. Deprecated; a 2% forex padding will be
            applied if this field is not provided
          format: int64
          deprecated: true
        atmWithdrawal:
          type: boolean
          description: >-
            If set to true, this purchase simulates and ATM Withdrawal
            transaction. MCC will automatically be set to 6011
        additionalMerchantData:
          allOf:
            - $ref: '#/components/schemas/AdditionalMerchantData'
            - description: Additional merchant data
        cardHolderPresent:
          allOf:
            - $ref: '#/components/schemas/CardHolderPresent'
            - description: >-
                Optional detail indicating if the card holder was present when
                the authorisation occurred.
        cardPresent:
          type: boolean
          description: >-
            Optional detail indicating if the card was present when the
            authorisation occurred.
        initiateBiometricThreeDSecure:
          type: boolean
          description: >-
            If the card is enrolled for Biometric Authentication, a 3DS Flow is
            initiated before the Purchase can resume.
        transactionTimestamp:
          type: integer
          description: Epoch timestamp using millisecond precision.
          format: int64
    Response:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/ResponseResponseCode'
    ResponseResponseCode:
      type: string
      enum:
        - COMPLETED
        - DENIED
        - DENIED_WIRE_TRANSFER_NOT_FOUND
        - DENIED_WIRE_TRANSFER_ALREADY_COMPLETED
    SimulateVerifyChallengeResponse:
      required:
        - code
      type: object
      properties:
        code:
          allOf:
            - $ref: '#/components/schemas/SimulateVerifyChallengeResponseResponseCode'
            - x-fieldValidation: required
    SimulateVerifyChallengeResponseResponseCode:
      type: string
      enum:
        - COMPLETED
        - DENIED
    LinkedAccountRunRequest:
      type: object
      properties:
        state:
          $ref: '#/components/schemas/LinkedAccountRunRequestState'
    LinkedAccountRunRequestState:
      type: string
      enum:
        - VERIFIED
        - REJECTED
    VerifyRequestByAccountId:
      type: object
      properties:
        steps:
          type: array
          items:
            $ref: '#/components/schemas/VerifyRequestByAccountIdVerificationStep'
        result:
          $ref: '#/components/schemas/VerifyRequestByAccountIdVerificationState'
    VerifyRequestByAccountIdVerificationStep:
      type: string
      enum:
        - INTERNAL_CHECKS
        - TRANSFER_INSTRUCTION
        - USER_DECLARATION_SCA_CHALLENGE
        - MICRO_DEPOSIT
    VerifyRequestByAccountIdVerificationState:
      type: string
      enum:
        - COMPLETED
        - REJECTED
    VerifyStepsRequestConflict:
      type: object
      properties:
        errorCode:
          $ref: '#/components/schemas/VerifyStepsRequestConflictErrorCode'
    VerifyStepsRequestConflictErrorCode:
      type: string
      enum:
