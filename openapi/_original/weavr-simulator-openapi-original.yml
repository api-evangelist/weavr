openapi: 3.0.1
info:
  title: Weavr Simulator
  x-logo:
    url: https://storage.googleapis.com/weavr-cdn/weavr_logo-new.png
    backgroundColor: '#FFFFFF'
    altText: Weavr
  description: >-
    This is a Simulator API which is only available on the Weavr Sandbox
    Environment
  contact:
    name: Weavr
    url: http://weavr.io
  version: v2
servers:
  - url: https://sandbox.weavr.io/simulate/api"
paths:
  /accounts/{account_id}/deposit:
    post:
      tags:
        - Accounts
      summary: Simulate incoming wire transfer using account id
      description: >-
        This tool is a quick and easy way to put funds on a Managed Account
        (previously called ‘deposit’), that you may need for testing elsewhere.
        Provide account id and transaction amount and the transaction will be
        processed through the system. This method skips some of the steps when
        processing IWTs. To test this fully, please use the accounts_deposit
        endpoint.
      operationId: accounts_account_id_deposit
      parameters:
        - name: account_id
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/call-ref'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepositRequestByAccountId'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositResponse0'
        '400':
          description: Invalid Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientInvalidRequest'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultError'
      security:
        - API_Secret_Key: []
  /accounts/deposit:
    post:
      tags:
        - Accounts
      summary: Simulate an incoming wire transfer using IBAN
      description: >-
        This tool is used to simulate incoming wire transfers (IWT) into managed
        accounts. IWTs are processed in line with the configuration of your
        application. For EUR and USD IWTs provide the destinationIbanDetails of
        your Managed Account, for GBP IWTs provide
        destinationFasterPaymentDetails or destinationIbanDetails of your
        Managed Account. Sender Details can also be added that is used to
        identify whether the IWT originated from a Linked Account (if
        configured) or a third party.
      operationId: accounts_deposit
      parameters:
        - $ref: '#/components/parameters/call-ref'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepositRequest'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositResponse1'
        '400':
          description: Invalid Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientInvalidRequest'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultError'
      security:
        - API_Secret_Key: []
  /cards/{card_id}/expire:
    post:
      tags:
        - Cards
      summary: Simulate expiry of card
      description: >-
        Expire a managed card by Card ID. Provide card id and the card will be
        expired.
      operationId: cards_card_id_expire
      parameters:
        - name: card_id
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/call-ref'
      responses:
        '204':
          description: Success - No Content
        '400':
          description: Invalid Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientInvalidRequest'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpireManagedCardConflict'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultError'
      security:
        - API_Secret_Key: []
  /cards/{card_id}/about_to_expire:
