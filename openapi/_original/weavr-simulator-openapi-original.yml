        - ALREADY_REJECTED
  parameters:
    call-ref:
      name: call-ref
      in: header
      description: >-
        A call reference generated by the caller and unique to the caller to
        provide correlation between the caller and system with a maximum length
        of 255
      required: false
      style: simple
      explode: false
      schema:
        type: string
    programme-key:
      name: programme-key
      in: header
      required: true
      style: simple
      explode: false
      schema:
        type: string
  headers:
    create-id:
      description: The generated id for the call
      required: true
      style: simple
      explode: false
      schema:
        type: string
  securitySchemes:
    API_Secret_Key:
      type: apiKey
      description: >-
        The API Secret Key - available from the Configuration area of the
        Innovator Portal
      name: programme-key
      in: header
    Auth_Token:
      type: http
      description: >-
        Authorization Token returned by login - example format:
        e6YrWi53lW0Bb6TbBL4ADA==
      scheme: bearer
      bearerFormat: JWT
