        - Operations
      summary: Update spend rules for a managed card
      operationId: bulksManagedCardSpendRulesUpdate
      description: >
        Submit the details to update the spend rules of Managed Cards.


        The  bulkId returned in the response can subsequently be used to launch
        the updating of Managed Card spend rules process through <Execute bulk
        process>. A submitted bulk process can be managed (executed, accessed,
        paused, resumed and cancelled) by any other Authorised User of the same
        identity of the user that submits the details.


        The status of the bulk process after execution of this operation is set
        to ‘SUBMITTED’. The execution of the bulk process is launched through
        the Execute bulk process operation.


        The submission of data for a bulk process does not expire but it can be
        cancelled through <Cancel bulk process>.


        The system is configured to accept bulk requests to process up to a
        maximum of 10,000 bulk operations.


        Each spend rules update operation in this bulk process is processed via
        <Managed Cards > Update a Managed Card.
      parameters:
        - $ref: '#/components/parameters/idempotency-ref'
      responses:
        '201':
          description: Success - returning bulk process
          content:
            application/json:
