                        type: string
                        pattern: ^[0-9]+$
                  requestBody:
                    $ref: '#/components/schemas/UpdateCardLevelSpendRules'
              maxItems: 10000
              minItems: 1
  /bulks/transfers:
    post:
      tags:
        - Operations
      description: >
        Submit the details for the creation of a batch of Transfers.


        The bulkId returned in the response can subsequently be used to launch
        the execution of the bulk process through [Execute Bulk
        Process](#tag/Manage/operation/bulkIdExecute). A submitted bulk process
        can be managed (executed, accessed, paused, resumed and cancelled) by
        any Authorised User of the same identity of the user that submits the
        details.


        The status of the bulk process after execution of this operation is set
        to ‘SUBMITTED’. The execution of the bulk process is launched through
        the Execute bulk process operation.


        The submission of data for a bulk process does not expire but it can be
        cancelled through [Cancel Bulk
        Process](#tag/Manage/operation/bulkIdCancel).


        The system is configured to accept bulk requests to process up to a
        maximum of 10,000 bulk operations.


        Each individual operation in this bulk will be processed via [Create a
        Transfer Transaction](#tag/Transfers/operation/transferCreate).
      summary: Create transfer transactions in bulk
      operationId: bulksTransferCreate
      parameters:
        - $ref: '#/components/parameters/idempotency-ref'
      responses:
        '201':
          description: Success - returning bulk process
          content:
            application/json:
              schema:
                type: object
                properties:
                  bulkId:
                    type: string
                  operationCount:
                    type: integer
                  path:
                    type: string
      security:
        - auth_token: []
          api_key: []
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  pathParams:
                    type: object
                    properties: {}
                  requestBody:
                    required:
                      - profileId
                      - source
                      - destination
                      - destinationAmount
                    type: object
                    properties:
                      profileId:
                        $ref: '#/components/schemas/ProfileId'
                      tag:
                        $ref: '#/components/schemas/Tag'
                      source:
                        description: >-
                          The managed account or managed card from where the
                          funds will be transferred.
                        $ref: '#/components/schemas/InstrumentId'
                      description:
                        type: string
                        maxLength: 255
                        pattern: ^[a-zA-Z0-9\/\-?:().$_,'+\s#=!"%&*<>;\{@\r\n]*$
                        description: >-
                          The description details that are included in the
                          transaction as reference.
                      destination:
                        description: >-
                          The managed account or managed card to where the funds
                          will be transferred.
                        $ref: '#/components/schemas/InstrumentId'
                      destinationAmount:
                        description: >-
                          The amount, in same currency as the source and
                          destination instruments, to be transferred to the
                          destination (exclusive of any fee amount that may be
                          specified in the profile).
                        $ref: '#/components/schemas/CurrencyAmount'
                      scheduledTimestamp:
                        $ref: '#/components/schemas/ScheduledTimestamp'
              maxItems: 10000
              minItems: 1
