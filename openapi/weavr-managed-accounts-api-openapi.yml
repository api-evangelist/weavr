          description: Can be either an account number or an International Bank Account Number (IBAN).
        financialInstitution:
          type: string
          minLength: 8
          maxLength: 11
          pattern: ^[a-zA-Z0-9]{8,11}$
          description: Bank Identifier Code (BIC) of the originator's financial institution.
    TransactionActivityStatus:
      type: string
      description: "Normalised lifecycle status of a transaction:\n  - DRAFT: Transaction ID has been created. There are additional user-actions required before the transaction is considered an “executable instruction” that is fully submitted. No balance movements have taken place on the target instrument yet.\n  - SUBMITTED: Transaction has been submitted and is awaiting processing. No balance movements have taken place yet. Transactions scheduled for processing on a future date remain in a submitted status.\n  - PROCESSING: The submitted transaction is being processed.\n  - COMPLETED: Executed and processed. Funds have moved, actual balance changed.\n  - CANCELLED: Transaction was cancelled before completion. Funds have been returned to the original instrument. \n  - RETURNED: The transaction was previously COMPLETED but has been returned. Funds have been returned to the original instrument. Note that card refunds may be separate transactions, not RETURNED purchases.\n"
      enum:
      - DRAFT
      - SUBMITTED
      - PROCESSING
      - COMPLETED
      - CANCELLED
      - RETURNED
