      headers:
        request-ref:
          $ref: '#/components/headers/request-ref'
      content:
        application/json:
          schema:
            type: object
            properties:
              errorCode:
                type: string
                enum:
                - INSUFFICIENT_PERMISSIONS
    BackofficeBadRequestError:
      description: Bad Request Error - Your request is invalid.
      headers:
        request-ref:
          $ref: '#/components/headers/request-ref'
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                maxLength: 255
                type: string
                description: When present helps to identify and fix the problem.
              validationErrors:
                $ref: '#/components/schemas/ValidationError'
    ManagedAccountsIBANUpgradeConflict:
      description: Conflict
      content:
        application/json:
          schema:
            type: object
            properties:
              errorCode:
                type: string
                enum:
                - INSTRUMENT_ALREADY_UPGRADED_TO_IBAN
                - INSTRUMENT_IS_NOT_ACTIVE
                - IBAN_ALLOCATION_EXCEEDED
                - IBAN_NOT_SUPPORTED
                - IBAN_ALREADY_REQUESTED
                - OWNER_NOT_VERIFIED
    InstrumentTransactionActivityResponse:
      description: Success
      headers:
        request-ref:
          $ref: '#/components/headers/request-ref'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InstrumentTransactionActivityItem'
    NoContent:
      description: Success - No Content.
      headers:
        request-ref:
          $ref: '#/components/headers/request-ref'
  parameters:
    state:
      name: state
      in: query
      required: false
      schema:
        type: array
        uniqueItems: true
        items:
          $ref: '#/components/schemas/InstrumentState'
    idempotency-ref:
      name: idempotency-ref
      in: header
      description: A unique call reference generated by the caller that, taking into consideration the payload as well as the operation itself, helps avoid duplicate operations. Idempotency reference uniqueness is maintained for at least 24 hours.
      required: false
      schema:
        type: string
    orderByTimestamp:
      name: orderByTimestamp
      in: query
      required: false
      description: "Orders the result in ascending or descending order.\n  - ASC: Ascending order, oldest transactions first.\n  - DESC: Descending order, most recent transactions first.\n\nIf not specified, the transactions will be returned in descending order.\n"
      schema:
        type: string
        enum:
        - ASC
        - DESC
    singleEntryPerTransaction:
      name: singleEntryPerTransaction
      in: query
      required: false
      description: 'Returns transactions that span multiple movements as a single entry.

        Only includes transactions that have been completed.

        Defaults to true for PDF statements, false otherwise.

        Note: due to the fact that only completed transactions are included, some

        transactions that are in progress and have modified the balance of the instrument

        will not be shown, which could lead to seemingly inconsistent balance being displayed.

        '
      schema:
        type: boolean
    tag:
      name: tag
      in: query
      required: false
      description: Filter by the managed account/card tag. The exact tag must be provided, as wildcards are not supported. Leave out to fetch all managed accounts/card.
      schema:
        type: string
    lastUpdatedTimestampTo:
      name: lastUpdatedTimestampTo
      in: query
      required: false
      description: Filter for transactions last updated before this timestamp. Epoch timestamp using millisecond precision.
      schema:
        type: integer
        format: int64
    statementLimit:
      name: statementLimit
      in: query
      required: false
      description: The limit of the results for statements paging, starting at the offset. Limit is capped at 500.
      schema:
        maximum: 500
        minimum: 1
        type: integer
        format: int32
    profileId:
      name: profileId
      in: query
      required: false
      description: Filter by the managed account/card profile. Leave out to fetch all managed accounts/card.
      schema:
        $ref: '#/components/schemas/ProfileId'
    transactionActivityType:
      name: type
      in: query
      required: false
      description: Filter by one or more transaction activity types.
      schema:
        type: array
        items:
          $ref: '#/components/schemas/TransactionActivityType'
    currency:
      name: currency
      in: query
      required: false
      description: 'Filter by the managed account/card currency.


        Currencies are expressed as an ISO 4217 code. Leave out to fetch all managed accounts/card.

        '
      schema:
        $ref: '#/components/schemas/Currency'
    transactionActivityDirection:
      name: direction
      in: query
      required: false
      description: Filter by transaction direction (CREDIT or DEBIT).
      schema:
        $ref: '#/components/schemas/TransactionActivityDirection'
    lastUpdatedTimestampFrom:
      name: lastUpdatedTimestampFrom
      in: query
      required: false
      description: Filter for transactions last updated after this timestamp. Useful for pulling recently changed transactions. Epoch timestamp using millisecond precision.
      schema:
        type: integer
        format: int64
    createdTo:
      name: createdTo
      in: query
      required: false
      description: Filter for managed accounts/cards created before `createdTo` timestamp. Timestamp is expressed in Epoch timestamp using millisecond precision. Leave out to fetch all managed accounts/cards.
      schema:
        type: integer
        format: int64
    state_blockedReason:
      name: state.blockedReason
      in: query
      required: false
      schema:
        type: array
        uniqueItems: true
        items:
          $ref: '#/components/schemas/BlockedReason'
    statementTransactionType:
      name: transactionType
      in: query
      required: false
      description: Filter by the transaction type. Leave out to fetch all entries.
      schema:
        type: array
        uniqueItems: true
        items:
          $ref: '#/components/schemas/StatementTransactionType'
    creationTimestampTo:
      name: creationTimestampTo
      in: query
      required: false
      description: Filter for transactions created before this timestamp. Epoch timestamp using millisecond precision.
      schema:
        type: integer
        format: int64
    friendlyName:
      name: friendlyName
      in: query
      required: false
      description: 'Filter by the managed account/card friendly name. Leave out to fetch all managed accounts/card.


        The exact name must be provided, as wildcards are not supported.

        '
      schema:
        minLength: 1
        maxLength: 50
        type: string
    transactionActivityStatus:
      name: status
      in: query
      required: false
      description: Filter by one or more normalised transaction statuses.
      schema:
        type: array
        items:
          $ref: '#/components/schemas/TransactionActivityStatus'
    toTimestamp:
      name: toTimestamp
      in: query
      required: false
      description: Filter for transactions having transaction timestamp before `toTimestamp`. Timestamp is expressed in Epoch timestamp using millisecond precision. If omitted, all matching transactions up to the present will be included. If both `fromTimestamp` and `toTimestamp` are provided, `toTimestamp` must be greater than `fromTimestamp`.
      schema:
        type: integer
        format: int64
    sortOrder:
      name: sortOrder
      in: query
      required: false
      description: "Sort order for the results:\n  - ASC: Ascending order, oldest first.\n  - DESC: Descending order, most recent first.\n"
      schema:
        type: string
        enum:
        - ASC
        - DESC
    offset:
      name: offset
      in: query
      required: false
      description: The offset value for paging, indicating the initial item number to be returned from the data set satisfying the given criteria. Leave out to fetch the first page of results.
      schema:
        minimum: 0
        type: integer
        format: int32
    createdFrom:
      name: createdFrom
      in: query
      required: false
      description: Filter for managed accounts/cards created after `createdFrom` timestamp. Timestamp is expressed in Epoch timestamp using millisecond precision. Leave out to fetch all managed accounts/cards.
      schema:
        type: integer
        format: int64
    fromTimestamp:
      name: fromTimestamp
      in: query
      required: false
      description: Filter for transactions having transaction timestamp after `fromTimestamp`. Timestamp is expressed in Epoch timestamp using millisecond precision. If omitted, all matching transactions up to the present will be included.
      schema:
        type: integer
        format: int64
    accept:
      name: accept
      in: header
      description: 'A request parameter specifying the type of response the client would like. Must be one of `application/json`, `application/pdf` or `text/csv`.


        The default response type (`application/json`) will be returned if specified incorrectly or not specified.

        '
      required: false
      schema:
        type: string
    limit:
      name: limit
      in: query
      required: false
      description: The limit of the results for paging, starting at the offset. Limit is always capped at 100.
      schema:
        maximum: 100
        minimum: 1
        type: integer
        format: int32
    state_destroyedReason:
      name: state.destroyedReason
      in: query
      required: false
      schema:
        type: array
        uniqueItems: true
        items:
          $ref: '#/components/schemas/DestroyedReason'
    transactionActivitySortBy:
      name: sortBy
      in: query
      required: false
      description: The field to sort transaction activity results by. Defaults to `creationTimestamp`.
      schema:
        $ref: '#/components/schemas/TransactionActivitySortBy'
    creationTimestampFrom:
      name: creationTimestampFrom
      in: query
      required: false
      description: Filter for transactions created after this timestamp. Epoch timestamp using millisecond precision.
      schema:
        type: integer
        format: int64
    showFundMovementsOnly:
      name: showFundMovementsOnly
      in: query
      required: false
      description: 'Deprecated. Use singleEntryPerTransaction instead.


        Returns only the entries which contain fund movements.

        '
      schema:
        type: boolean
  headers:
    request-ref:
      description: A request identifier. Providing this reference when contacting our support team will help us investigate your query.
      required: true
      schema:
        type: string
    x-ratelimit-reset:
      description: The number of seconds until the window is reset.
      required: true
      schema:
        minimum: 0
        type: integer
        format: int32
    x-ratelimit-limit:
      description: 'Example: `20, 10;w=60, 20;w=3600, 200;w=86400`

        The first number (20) is the limit that has been exceeded.

        The remaining numbers are the limits that are in force, with ''w'' meaning ''window in seconds''. In this example `20;w=3600` was exceeded. 20 calls in 3600secs (1hr)

        '
      required: true
      schema:
        type: string
  requestBodies:
    ManagedAccountCreateRequest:
      content:
        application/json:
          schema:
            required:
            - profileId
            - friendlyName
            - currency
            type: object
            properties:
              profileId:
                $ref: '#/components/schemas/ProfileId'
              friendlyName:
                type: string
                minLength: 1
                maxLength: 50
                description: The friendly name to be given to the managed account.
              currency:
                $ref: '#/components/schemas/Currency'
              tag:
                $ref: '#/components/schemas/Tag'
              lowBalanceThreshold:
                $ref: '#/components/schemas/AccountLowBalanceThreshold'
      required: true
    ManagedAccountUpdateRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              tag:
                $ref: '#/components/schemas/Tag'
              friendlyName:
                maxLength: 50
                minLength: 1
                type: string
                description: Updates the friendly name of the managed account. Leave blank if no change is needed.
              lowBalanceThreshold:
                $ref: '#/components/schemas/AccountLowBalanceThreshold'
              clearLowBalanceThreshold:
                type: boolean
                description: When true, clears the configured low balance threshold on the account. Ignored if lowBalanceThreshold is also provided.
  securitySchemes:
    api_key:
      type: apiKey
      description: The API Key representing your Multi account.
      name: api-key
      in: header
    auth_token:
      type: http
      description: The authentication token representing the user. This will be included in the login response object.
      scheme: bearer
      bearerFormat: JWT
x-tagGroups:
- name: Access
  tags:
  - Access Token
  - User Impersonation
  - Consent Request
- name: Identities
  tags:
  - Corporates
  - Consumers
- name: User Management
  tags:
  - Authorised Users
- name: Instruments
  tags:
  - Managed Accounts
  - Managed Cards
- name: Transactions
  tags:
  - Transfers
- name: Fees
  tags:
  - Fees
- name: Bulk Operations [Beta]
  tags:
  - Operations
  - Manage
