    patch:
      description: 'Update the details of the buyer that the logged-in user belongs to.


        The following Buyer details are verified during due diligence (KYB) and cannot be updated via the API once the Buyer has been verified:

        - Admin User Name

        - Admin User Surname

        - Admin User Email

        - Admin User Mobile Country Code

        - Admin User Mobile Number

        - Admin Date of Birth

        - Company Business Address


        *If these details need to be changed after due diligence is completed, please contact Customer Support to restart the Due Diligence process.*



        Required user role: `ADMIN`'
      summary: Update Buyer's KYB details
      operationId: buyerUpdateKyb
      tags:
      - Buyers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tag:
                  type: string
                  description: The tag field is a custom field that can be used to search and filter.
                  maxLength: 50
                  pattern: ^[a-zA-Z0-9_-]+$
                company:
                  type: object
                  description: The details associated with the company. The details provided need to match exactly with the details provided during KYB.
                  properties:
                    businessAddress:
                      description: The address where the business is based.
                      type: object
                      required:
                      - addressLine1
                      - city
                      - postCode
                      - country
                      properties:
                        addressLine1:
                          minLength: 1
                          maxLength: 150
                          type: string
                          description: The first line of the address.
                        addressLine2:
                          maxLength: 150
                          type: string
                          description: The second line of the address.
                        city:
                          minLength: 1
                          maxLength: 50
                          type: string
                          description: The city of the address.
                        postCode:
                          minLength: 1
                          maxLength: 10
                          pattern: ^[A-Za-z0-9 -]*$
                          type: string
                          description: The post cost associated with the address.
                        state:
                          maxLength: 50
                          type: string
                          description: The state of the address.
                        country:
                          maxLength: 2
                          minLength: 2
                          pattern: ^[A-Z]+$
                          type: string
                          description: The country of the address expressed in ISO 3166 alpha-2 format.
                adminUser:
                  type: object
                  description: The legal representative of the buyer. Admin users can invite and manage the buyer's authorised users.
                  properties:
                    name:
                      maxLength: 100
                      type: string
                      description: First name of the admin user.
                    surname:
                      maxLength: 100
                      type: string
                      description: Last name of the admin user.
                    email:
                      type: string
                      description: E-mail Address of the user
                      format: email
                    mobile:
                      type: object
                      description: Mobile number of the user
                      required:
                      - number
                      - countryCode
                      properties:
                        countryCode:
                          maxLength: 6
                          minLength: 1
                          pattern: ^[\+][0-9]{1,5}$
                          type: string
                          description: The country code of the Buyer's admin user mobile number (e.g. +44).
                        number:
                          maxLength: 15
                          minLength: 1
                          pattern: ^[0-9]+$
                          type: string
                          description: The mobile number of the Buyer's admin user - excluding country code.
                    dateOfBirth:
                      allOf:
                      - type: object
                        required:
                        - year
                        - month
                        - day
                        properties:
                          year:
                            type: integer
                            format: int32
                            maximum: 2100
                            minimum: 1900
                          month:
                            type: integer
                            format: int32
                            maximum: 12
                            minimum: 1
                          day:
                            type: integer
                            format: int32
                            maximum: 31
                            minimum: 1
                      - description: Date of birth of the authorised user.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                required:
                - id
                - adminUser
                - company
                - acceptedTerms
                - creationTimestamp
                - supportedCurrencies
                type: object
                properties:
                  id:
                    type: string
                    pattern: ^[0-9]+$
                    description: Id of the buyer.
                  tag:
                    type: string
                    description: The tag field is a custom field that can be used to search and filter.
                    maxLength: 50
                    pattern: ^[a-zA-Z0-9_-]+$
                  adminUser:
                    required:
                    - id
                    - email
                    - name
                    - surname
                    - mobile
                    - active
                    - emailVerified
                    - mobileNumberVerified
                    - companyPosition
                    - roles
                    type: object
                    properties:
                      id:
                        allOf:
                        - type: string
                          pattern: ^[0-9]+$
                          description: The identifier of the user.
                        - description: The Corporate Id
                      name:
                        maxLength: 100
                        type: string
                        description: First name of the admin user.
                      surname:
                        maxLength: 100
                        type: string
                        description: Last name of the admin user.
                      email:
                        type: string
                        description: E-mail Address of the user
                        format: email
                      mobile:
                        type: object
                        description: Mobile number of the user
                        required:
                        - number
                        - countryCode
                        properties:
                          countryCode:
                            maxLength: 6
                            minLength: 1
                            pattern: ^[\+][0-9]{1,5}$
                            type: string
                            description: The country code of the Buyer's admin user mobile number (e.g. +44).
                          number:
                            maxLength: 15
                            minLength: 1
                            pattern: ^[0-9]+$
                            type: string
                            description: The mobile number of the Buyer's admin user - excluding country code.
                      companyPosition:
                        type: string
                        description: The company position of the Buyer Admin User.
                        enum:
                        - DIRECTOR
                        - AUTHORISED_REPRESENTATIVE
                      dateOfBirth:
                        description: Date of birth of the authorised user.
                        type: object
                        required:
                        - year
                        - month
                        - day
                        properties:
                          year:
                            type: integer
                            format: int32
                            maximum: 2100
                            minimum: 1900
                          month:
                            type: integer
                            format: int32
                            maximum: 12
                            minimum: 1
                          day:
                            type: integer
                            format: int32
                            maximum: 31
                            minimum: 1
                      active:
                        type: boolean
                        description: The state of the admin user. If false, then the user will not be able to log in.
                        readOnly: true
                      emailVerified:
                        type: boolean
                        description: Indicates if the admin user's email has been verified.
                        readOnly: true
                      mobileNumberVerified:
                        type: boolean
                        description: Indicates if the admin user's mobile number has been verified.
                        readOnly: true
                      roles:
                        type: array
                        minItems: 1
                        description: 'Roles define the level of access assigned to the user.


                          * `CREATOR`: Users assigned this role can create, view and update payment runs.

                          * `CONTROLLER`: Users assigned this role can view and link their company''s bank accounts as well as fund payment runs.

                          * `ADMIN`: Users assigned to this role can create a business and ensure that systems and processes are effectively managed.

                          '
                        items:
                          type: string
                          enum:
                          - ADMIN
                          - CREATOR
                          - CONTROLLER
                    description: The admin user of the Buyer Identity.
