                          - SK
                          - SI
                          - ES
                          - SE
                          description: The country of company registration in ISO 3166 alpha-2.
                    - type: object
                      properties:
                        registeredAddress:
                          required:
                          - addressLine1
                          - city
                          - country
                          type: object
                          description: The legal address of the company. This information is captured via the Due Diligence (KYB) process.
                          properties:
                            addressLine1:
                              type: string
                            addressLine2:
                              type: string
                            city:
                              type: string
                            postCode:
                              maxLength: 10
                              pattern: ^[A-Za-z0-9 -]*$
                              type: string
                            state:
                              maxLength: 50
                              type: string
                            country:
                              maxLength: 2
                              minLength: 2
                              pattern: ^[A-Z]+$
                              type: string
                              description: Country of the identity in ISO 3166 alpha-2 format.
                          readOnly: true
                        incorporatedOn:
                          description: The company's date of incorporation
                          type: object
                          required:
                          - year
                          - month
                          - day
                          properties:
                            year:
                              type: integer
                              format: int32
                              maximum: 2100
                              minimum: 1900
                            month:
                              type: integer
                              format: int32
                              maximum: 12
                              minimum: 1
                            day:
                              type: integer
                              format: int32
                              maximum: 31
                              minimum: 1
                          readOnly: true
                  acceptedTerms:
                    type: boolean
                    description: Must be set to *true* to indicate that the admin user has accepted the terms and conditions.
                  supportedCurrencies:
                    type: array
                    items:
                      type: object
                      required:
                      - currency
                      - status
                      properties:
                        currency:
                          type: string
                          description: The currency expressed in ISO-4217 code.
                          maxLength: 3
                          minLength: 3
                          enum:
                          - GBP
                          - EUR
                        status:
                          type: string
                          description: 'The status of the currency, which can include the following values


                            * `PENDING_KYB_APPROVAL`: The buyer’s KYB process is pending approval.

                            * `STEPUP_LOGIN_REQUIRED`: The buyer needs to perform a stepped-up login for higher authentication.

                            * `PENDING_CREATION`: Awaiting the setup completion of the currency

                            * `ACTIVE`: The ZBA has been successfully created and is ready for use.

                            * `UNAVAILABLE`: The currency is unavailable and cannot be used.

                            '
                          enum:
                          - PENDING_KYB_APPROVAL
                          - STEPUP_LOGIN_REQUIRED
                          - PENDING_CREATION
                          - ACTIVE
                          - UNAVAILABLE
                  creationTimestamp:
                    type: integer
                    format: int64
                    description: The time when the Buyer was created, expressed in Epoch timestamp using millisecond precision.
                    readOnly: true
        '400':
          description: Bad Request Error - Your request is invalid.
          headers:
            request-ref:
              description: A request identifier. Providing this reference when contacting our support team will help us investigate your query.
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    maxLength: 255
                    type: string
                    description: When present helps to identify and fix the problem.
                  syntaxErrors:
                    type: object
                    description: Is returned as part of an HTTP error response whenever a syntax error is detected. A list of the fields together with their syntax error will be provided.
                    properties:
                      invalidFields:
                        type: array
                        items:
                          type: object
                          properties:
                            params:
                              type: array
                              items:
                                type: string
                            fieldName:
                              type: string
                            error:
                              type: string
                              enum:
                              - REQUIRED
                              - HAS_TEXT
                              - REQUIRES
                              - SIZE
                              - RANGE
                              - IN
                              - NOT_IN
                              - REGEX
                              - EXACTLY
                              - AT_LEAST
                              - AT_MOST
                              - ALL_OR_NONE
        '401':
          description: Unauthorized - Your credentials or access token are invalid.
          headers:
            request-ref:
              description: A request identifier. Providing this reference when contacting our support team will help us investigate your query.
              required: true
              schema:
                type: string
        '403':
          description: Forbidden - Access to the requested resource or action is forbidden.
          headers:
            request-ref:
              description: A request identifier. Providing this reference when contacting our support team will help us investigate your query.
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorCode:
                    type: string
                    enum:
                    - INSUFFICIENT_PERMISSIONS
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorCode:
                    type: string
                    enum:
                    - ADMIN_EMAIL_NOT_UNIQUE
                    - CURRENCY_UNSUPPORTED
                    - COUNTRY_INVALID
                    - TERMS_NOT_ACCEPTED
                    - MOBILE_OR_COUNTRY_CODE_INVALID
                    - COUNTRY_UNSUPPORTED
                    - COMPANY_TYPE_UNSUPPORTED
                    - IDEMPOTENT_REQUEST_IN_PROGRESS
        '429':
          description: Too many requests.
          headers:
            request-ref:
              description: A request identifier. Providing this reference when contacting our support team will help us investigate your query.
              required: true
              schema:
                type: string
            x-ratelimit-limit:
              description: 'Example: `20, 10;w=60, 20;w=3600, 200;w=86400`

                The first number (20) is the limit that has been exceeded.

                The remaining numbers are the limits that are in force, with ''w'' meaning ''window in seconds''. In this example `20;w=3600` was exceeded. 20 calls in 3600secs (1hr)

                '
              required: true
              schema:
                type: string
            x-ratelimit-reset:
              description: The number of seconds until the window is reset.
              required: true
              schema:
                minimum: 0
                type: integer
                format: int32
        '500':
          description: Internal Server Error - There is a problem with the server. Please try again later.
          headers:
            request-ref:
              description: A request identifier. Providing this reference when contacting our support team will help us investigate your query.
              required: true
              schema:
                type: string
        '503':
          description: Service Unavailable - We're temporarily offline for maintenance. Please try again later.
          headers:
            request-ref:
              description: A request identifier. Providing this reference when contacting our support team will help us investigate your query.
              required: true
              schema:
                type: string
        default:
          description: Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
