        When patching a mobile number, the new mobile number should be enrolled for Additional Factors.



        Required user role: `ADMIN`'
      summary: Update a user
      operationId: userUpdate
      tags:
      - Buyer Authorised Users
      parameters:
      - name: user_id
        in: path
        required: true
        description: The unique identifier for the user.
        schema:
          type: string
          pattern: ^[0-9]+$
          example: '110747174434373672'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: UserUpdate
              type: object
              properties:
                name:
                  maxLength: 20
                  type: string
                  description: The first name of the user.
                surname:
                  maxLength: 20
                  type: string
                  description: The last name of the user.
                email:
                  type: string
                  description: E-mail Address of the user
                  format: email
                mobile:
                  type: object
                  description: Mobile number of the user
                  required:
                  - number
                  - countryCode
                  properties:
                    countryCode:
                      maxLength: 6
                      minLength: 1
                      pattern: ^[\+][0-9]{1,5}$
                      type: string
                      description: The country code of the Buyer's admin user mobile number (e.g. +44).
                    number:
                      maxLength: 15
                      minLength: 1
                      pattern: ^[0-9]+$
                      type: string
                      description: The mobile number of the Buyer's admin user - excluding country code.
                dateOfBirth:
                  description: Date of birth of the authorised user.
                  type: object
                  required:
                  - year
                  - month
                  - day
                  properties:
                    year:
                      type: integer
                      format: int32
                      maximum: 2100
                      minimum: 1900
                    month:
                      type: integer
                      format: int32
                      maximum: 12
                      minimum: 1
                    day:
                      type: integer
                      format: int32
                      maximum: 31
                      minimum: 1
                roles:
                  type: array
                  minItems: 1
                  description: 'Roles define the level of access assigned to the user.


                    * `CREATOR`: Users assigned this role can create, view and update payment runs.

                    * `CONTROLLER`: Users assigned this role can view and link their company''s bank accounts as well as fund payment runs.

                    '
                  items:
                    type: string
                    enum:
                    - CREATOR
                    - CONTROLLER
